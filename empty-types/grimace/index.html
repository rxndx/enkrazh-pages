ми, за что и получил своё название.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"На его спине и груди можно разглядеть мышечные наросты, которые при напряжении превращаются в острые шипы.\"}],\" В моменты отчаяния Гримасник может выгнуть тело, используя их для защиты или внезапного удара, пробивая даже металлические поверхности. Данные шипы периодически отрастают заново, становясь всё более острыми с течением годов существования.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Руки и ноги Гримасника — длинные, жилистые, заканчивающиеся когтями, которые кажутся слишком большими для его конечностей.\"}],\" Лапы способны изгибаться в любых направлениях, что придаёт ему неописуемую ловкость и возможность перемещаться по всевозможным поверхностям подобно мартышкам. На его спине виднеются причудливые наросты, напоминающие острые рёбра, пробившиеся наружу. Хвост короткий и толстый, покрытый мелкими шипами, которые он использует для дополнительной устойчивости.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Особое внимание привлекают его глаза — маленькие, чёрные точки, утопленные в глубоких впадинах.\"}],\" Иногда их может не быть на черепе (если это относительно молодой Гримасник), а у некоторых просматриваются глаза (у более старших по иерархии). В то же время, отсутствие или же присутствие глазниц не играет роль на ориентацию в пространстве — у Гримасника превосходно обострены несколько чувств.\"]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности\"}],[\"
