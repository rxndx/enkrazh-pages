нный к скоростному передвижению и преследованию добычи на открытой местности. Внешне напоминает вытянутую четвероногую рептилию с непропорционально длинным туловищем и хвостом.\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Средняя высота в холке — около 3 метров. Общая длина тела, включая хвост, составляет от 7 до 9 метров.\"}],\" Телосложение сухое, мускулистое, с выраженной сегментацией мышц по бокам корпуса.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"images\":[{\"src\":\"/animals/skrag.webp\",\"alt\":\"Внешний вид скрага\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения (Скраг)\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"name\":\"Сухожилия\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Подкожный жировой слой минимален\"}],\", из-за чего рёбра и сухожилия частично читаются под кожей. В связи с этим они обладают крайне медленным, но исключительно эффективным регенеративным метаболизмом, который активируется только вне состояния активной охоты. В период покоя их тело перераспределяет ресурсы на уплотнение и перепрошивку уже существующих структур. Именно этим объясняется способность Скрагов сохранять боеспособность даже после тяжёлых повреждений без видимых следов заживления.\"]}],[\"$\",\"$L12\",null,{\"name\":\"Хвостовые узлы\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Регенерация протекает незаметно и может занимать десятилетия.\"}],\" Потерянные конечности не восстанавливаются, однако повреждённые кости и сухожилия со временем становятся прочнее первоначальных, что приводит к накоплению индивидуальных морфологических искажений у старых особей.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Основная опора приходится на четыре мощные задние и средние конечности.\"}],\" Они длинные, с обратным изгибом суставов, что обеспечивает высокий импульс при разгоне и \",[\"$\",\"strong\",null,{\"children\":\"позволяет развивать скорость до 100 км/ч на коротких дистанциях.\"}],\" Копытообразные окончания лап узкие, рассчитанные на твёрдую почву и каменистые равнины. \",[\"$\",\"strong\",null,{\"children\":\"Хвост длинный, тяжёлый, и в состоянии агрессии используется также как вспомогательное оружие для сбивания цели с ног.\"}]]}],[\"$\",\"$L12\",null,{\"name\":\"Сегменты позвоночника\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[\"Во время ускорения позвоночник Скрага изгибается волнообразно, а хвост действует как инерционный якорь, позволяя резко менять направление без потери скорости. \",[\"$\",\"strong\",null,{\"children\":\"На максимальном разгоне Скраг фактически перестаёт шагать и переходит в серию удлинённых прыжков.\"}]]}],[\"$\",\"$L12\",null,{\"name\":\"Передние клешни\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Передняя дополнительная пара конечностей расположена ближе к грудной клетке и по строению напоминает укороченные клешни богомола.\"}],\" Несмотря на малые размеры относительно основного корпуса, они обладают высокой плотностью тканей и заострёнными краями. Используются для захвата, удержания и пробивания твёрдых поверхностей; \",[\"$\",\"strong\",null,{\"children\":\"зафиксированы случаи пробития бетона с образованием аккуратных сквозных отверстий.\"}],\" Эти же конечности применяются при питании — из-за специфического строения челюстей Скраг не способен эффективно разрывать доб ,{\"children\":\"На верхней части пасти формируется роговой вырост.\"}]]}],[\"$\",\"$L12\",null,{\"name\":\"Рог\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Рог выполняет роль стабилизирующего накопителя проклятой энергии в виде атрибута Тьмы. Без рога Милвус не способен длительно применять свои способности без серьёзного вреда для организма.\"}],\" Лишение рога не приводит к гибели, однако в связи с тем, что рог является основным источником атрибута Тьмы, его отсутствие ведёт к распространению атрибута в мягких тканях, что может вызвать ожоги или же выраженные поведенческие нарушения. \",[\"$\",\"strong\",null,{\"children\":\"Такие особи становятся агрессивными, теряют способность к координации в стае и нередко погибают в течение последующих десятилетий\"}],\" либо от внутренних повреждений, либо в результате конфликтов.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Милвусы инстинктивно защищают область рога даже в ущерб другим жизненно важным зонам\"}],\" — бывали случаи, когда особи подставляли корпус или крылья под удар, лишь бы избежать повреждения рогового нароста. \",[\"$\",\"strong\",null,{\"children\":\"Потеряв рог однажды, больше не могут его восстановить.\"}]]}]]]}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения (Веспертиол)\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Веспертиолы представляют собой наиболее визуально и поведенчески тревожную эволюционную форму.\"}],\" Их внешний облик отличается выраженной асимметрией и гипертрофией: передние конечности чрезмерно удлинены и снабжены острыми, режущими краями, не уступающими по опасности дополнительным отросткам Скрагов (если не превышающими её).\"]}],[\"$\",\"p\",null,{\"children\":\"Череп Веспертиолов частично закрыт плотной костной или роговой структурой, создающей впечатление защитного «шлема», однако наличие зрительных органов под ним остаётся предметом споров. Челюстной аппарат напоминает пасть псовых, но оснащён значительно большим количеством острых зубов, что делает укусы более направленными и ощутимыми.\"}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"В данной форме Веспертиолы превосходят Милвусов по скорости и манёвренности, особенно в воздухе.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"name\":\"Кожный покров\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожа Скрагов плохо удерживает тепло в связи с отсутствием подкожного жира. При понижении температуры (-40 градусов и ниже) они становятся менее активными\"}],\" и чаще замирают в неподвижности, что внешне может выглядеть как сон или даже смерть. \",[\"$\",\"strong\",null,{\"children\":\"В жарких местах, напротив, Скраги демонстрируют повы
