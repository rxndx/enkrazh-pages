oundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"При коммуникации в стае\"}],\" общаются быстрыми волнами с некоторыми паттернами.\"]}]]}],\"\\n\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"В темноте тело излучает мягкий внутренний свет, похожий на свет далеких звезд или туманности. Интенсивность свечения коррелирует с силой особи и ее эмоциональным состоянием. Альфа-особь светится ярче всех.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда обитания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"По всему Энкражу. Основные места пребывания – любые верхние точки\"}],\", напр. обширные пространства под сводами пещер, гигантского дупла или открытого мира, где мало физических препятствий и есть место для изящных манёвров. \",[\"$\",\"strong\",null,{\"children\":\"Часто скапливаются в местах с естественными выбросами проклятой или чистой энергий, что считаются их пастбищами или точками сбора.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Избегают непроходимые и густые леса\"}],\" (туманный, крови или беспросветный, но с радостью пребывают в лесу грёз благодаря его необычной симметричной форме роста), зон сильной крайне агрессивной магии, а также мест с сильными турбулентными потоками энергии, напр. в высоких горах.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни и питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Предпочитает путешествовать в стаях из 5-7 особей до нескольких десятков (или же Флотилиях Элисии), координируясь через световые сигналы друг меж другом.\"}],\" Основана иерархия на силе и чистоте внутреннего свечения: \",[\"$\",\"strong\",null,{\"children\":\"альфа-особь (часто самая старая и мудрая) светится ярче и стабильнее всех\"}],\" – она задает курс флотилии, принимает решения (куда лететь, где кормиться, реагировать ли на угрозу) с помощью сложных световых сигналов. Ее решения никогда не оспариваются.\"]}],[\"$\",\"$L12\",null,{\"name\":\"Эссенция спирали\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"У них присутствует собственная световая азбука\"}],\", например, где быстрые вспышки разной длины и цвета отвечают за аналоги точек и тире; также они концентрируются на волнах цвета, бегущих по телу от головы к хвосту или наоборот. Хоть и не обладают высокой разумностью, \",[\"$\",\"strong\",null,{\"children\":\"способны рисовать простые фигуры кончиком хвоста (круги, спирали, зигзаги).\"}],\" Эта коммуникация мгновенна и позволяет стае действовать как единый организм, совершая сложные синхронные маневры.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Их полёт всегда медленный, плавный, грациозный.\"}],\" Движения крыльев волнообразные, создают ощущение, что они плывут по воздуху. Способны к резким, но все равно элегантным маневрам за счет изгиба тела и вибрации задних крыльев. В стае летят в сложных, постоянно меняющихся формациях, напоминающих танец или движение косяка рыб.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Основным способом питания является симбиотическое поглощение ауры\"}],\" – Элисия мягко приближается к существу или магическому объекту с сильной и неагрессивной аурой. \",[\"$\",\"strong\",null,{\"children\":\"Она не является паразитом, а как раз способна очищать искажённые и нестабильные формы проклятой энергии.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"Элисия зависает рядом или очень осторожно касается поверхностью тела (чаще всего передним краем или хвостом). Происходит тонкое энергетическое соединение, с помощью которого Элисия считывает и поглощает избыточную, рассеянную ауру или энергию. \",[\"$\",\"strong\",null,{\"children\":\"Процесс безболезнен для донора, часто даже приятен (ощущение тепла, спокойствия, легкой эйфории). Элисия не может поглотить жизненно необходимую энергию – связь автоматически прерывается, если аура донора ослабевает ниже безопасного уровня.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"В местах сильных естественных энергетических аномалий могут пастись, просто паря над источником и поглощая рассеянную энергию, не собранную в конкретные формы (атрибуты).\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Развитие и размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Детёныши появляются из сгустков энергии после слияния.\"}],\" Крошечные (5-15 см), похожие на ярких светлячков или искорки. Тело почти шарообразное, крылья маленькие, хвост очень короткий. Свечение интенсивное, но нестабильное, часто мигающее. \",[\"$\",\"strong\",null,{\"children\":\"Сразу после рождения сбиваются в плотные, мерцающие рои, что движутся как единое целое\"}],\", управляемое коллективным инстинктом и слабыми световыми сигналами. Флотилия взрослых особей охраняет и направляет малые рои к безопасным местам с рассеянной энергией для питания и роста.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Постепенно светлячки растут, их тело вытягивается, крылья и хвост удлиняются, свечение становится стабильнее\"}],\" и приобретает характерные сине-фиолетовые тона. Рой распадается, когда молодые Элисии достигают примерно трети взрослого размера и начинают интегрироваться во флотилию или формировать новые, меньшие группы.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Размножение происходит между двумя (реже – тремя) совместимыми взрослыми особями, обычно в периоды энергетического изобилия\"}],\" (например, в зоне сильной, но неагрессивной природной аномалии). Особи сближаются, синхронизируя свои световые ритмы и цвета, начинают лететь строго параллельно, почти касаясь друг друга. Их энергетические поля сливаются, образуя яркую, пульсирующую сферу света между ними.\"]}],[\"$\",\"p\",null,{\"children\":[\"Внутри этой сферы происходит сложное взаимодействие их волн (уникальных энергетических паттернов). \",[\"$\",\"strong\",null,{\"children\":\"Если симметрия (резонанс и комплементарность) достигается, сфера схлопывается, выпуская в окружающее пространство множество мелких энергетических сгустков – будущих светлячков, падающих вниз\"}],\" – чем, к слову говоря, напоминают звездопад. Сами родительские особи после слияния временно светятся тусклее, но быстро восстанавливаются.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Миролюбивы, осторожно-любопытны, редко проявляют агрессию и сами стараются избегать.\"}],\" Летают стаями, иногда взаимодействуют с парящими или же одинокими путниками. \",[\"$\",\"strong\",null,{\"children\":\"Особенно их притягивают грешники с отрицательной противоположностью как необычный источник, однако более дружелюбны к положительным. Элисии могут добровольно делиться своей успокаивающей энергией\"}],\", чем-то напоминая Эксилей.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Иногда их можно заметить вокруг острого и необычного источника (даже агрессивного): любопытство Элисий нередко приводит к тому, что они наблюдают с большого расстояния, излучая нейтральные или слегка тревожные сигналы (мерцание).\"}],\" Приближаются редко и с крайней осторожностью, так как такая аура может быть нестабильной и опасной для контакта. Могут попытаться сгладить крайние всплески отрицательных эмоций своим успокаивающим влиянием на расстоянии.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Пустые интереса не вызывают.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"С другими парящими существами могут вступать в танцы\"}],\" – обмен световыми сигналами, синхронное маневрирование. С наземными или нелетучими – наблюдают сверху или осторожно снижаются, если чувствуют открытость и отсутствие угрозы.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Самозащита и нападение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Используют маневренность и синхронность стаи, чтобы уйти от угрозы.\"}],\" Могут резко гасить свое свечение, становясь почти невидимыми в темноте (остается лишь слабый контур), или наоборот, \",[\"$\",\"strong\",null,{\"children\":\"создавать вокруг себя кратковременную завесу из рассеянного света энергетического шлейфа, напоминающую туманность, чтобы скрыть точное местоположение.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если угроза близка и неминуема, вся стая (или одна особь) может синхронно выпустить мощную, кратковременную вспышку чистого белого света, что не причиняет физического вреда, но временно ослепляет и дезориентирует нападающего\"}],\", давая Элисиям время скрыться.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если существо враждебно и атакует Элисию во время контакта (питания), защитная реакция Элисии может вызвать обратный энергетический импульс оттоком проклятой энергии в обидчика\"}],\" – это не с
