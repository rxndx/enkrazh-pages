айне высокой концентрации, которые сами принимают форму, напоминающую живой организм. Их структура существует только благодаря постоянному перераспределению энергии. Если источник подпитки исчезает, Ноэ постепенно теряет форму и распадается; если меняется преобладающий атрибут среды, его структура может перестроиться вслед за ним.\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":\"В связи с этим Эдиониды считаются одним из наиболее чистых природных примеров того, как атрибут может быть закреплён в живой материи: их исключительная простота позволяет наблюдать взаимодействие ПЭ, атрибута и организма практически без тех многочисленных промежуточных процессов, которые присутствуют у более сложных существ, за что исследователи особенно любят Эдионид.\"}],\"\\n\",[\"$\",\"section\",null,{\"id\":\"особенности-строения\",\"data-rule-section\":true,\"data-rule-section-title\":\"Особенности строения\",\"className\":\"not-prose my-10 flow-root clear-both scroll-mt-24  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Текучий слой\"},{\"name\":\"Кораллоид\"},{\"name\":\"Тендрилы\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Базовая анатомия всех морфотипов идентична и состоит из двух неразрывно связанных частей:\"}],\" текучий слой — прозрачная гелатинозная оболочка, выполняющая функции защиты, плавучести и первичного поглощения рассеянной ПЭ. Внутри него плавает кораллоид — плотное ядро, составленное из сконденсированных эдионов определённого атрибута. Именно кораллоид определяет атрибутную принадлежность конкретного зоида и служит его метаболическим центром. У некоторых морфотипов из текучего слоя вырастают нитевидные псевдоподии или тендрилы, увеличивающие площадь контакта с энергетическими потоками.\"]}],\"$L13\",\"$L14\",\"$L15\",\"$L16\",\"$L17\",\"$L18\",\"$L19\",\"$L1a\",\"$L1b\",\"$L1c\",\"$L1d\",\"$L1e\",\"$L1f\",\"$L20\",\"$L21\",\"$L22\",\"$L23\",\"$L24\",\"$L25\",\"$L26\",\"$L27\",\"$L28\",\"$L29\"]]}],\"\\n\",\"$L2a\",\"\\n\",\"$L2b\",\"\\n\",\"$L2c\",\"\\n\",\"$L2d\",\"\\n\",\"$L2e\",\"\\n\",\"$L2f\",\"\\n\",\"$L30\",\"\\n\",\"$L31\",\"\\n\",\"$L32\",\"\\n\",\"$L33\",\"\\n\",\"$L34\"]}]\n"])</script><script>self.__next_f.push([1,"35:I[44350,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ghvbjj9_suid.js\",\"/enkrazh-pages/_next/static/chunks/3o82u4_5i9xho.js\",\"/enkrazh-pages/_next/static/chunks/10ekzsq_ze25s.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/22tuoqf9y8ckp.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"CreatureDropCard\"]\n6a:I[723063,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ghvbjj9_suid.js\",\"/enkrazh-pages/_next/static/chunks/3o82u4_5i9xho.js\",\"/enkrazh-pages/_next/static/chunks/10ekzsq_ze25s.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/22tuoqf9y8ckp.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"AnimalAbilities\"]\n6b:I[723063,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunk  и ширины текучего слоя в зависимости от характера движения воды, вследствие чего одна и та же особь в состоянии покоя напоминает прозрачную каплю, а в потоке вытягивается в длинную ленту. В состоянии покоя зоид сохраняет форму прозрачной капли диаметром около 0,3–0,7 мм, однако при движении воды способен вытягиваться в ленту длиной более 1,4 мм, практически не изменяя объём собственного кораллоида. Последний не закреплён внутри оболочки и может свободно смещаться на расстояние до 20–30% длины зоида, благодаря чему Гидрелла не разрывается даже при резком изменении направления потока. Тендрилы короткие, многочисленные и практически прозрачные, они не используются для захвата пищи и служат преимущественно для увеличения площади соприкосновения с водой. При соприкосновении двух зоидов текучие слои временно сливаются, после чего кораллоиды самостоятельно расходятся, сохраняя индивидуальную структуру. Гидреллы образуют наиболее подвижные колонии: вместо плотных скоплений они формируют длинные полупрозрачные полосы, следующие за течениями ПЭ.17:[\"$\",\"p\",null,{\"children\":[[\"$\",\"str"])</script><script>self.__next_f.push([1,"ong\",null,{\"children\":\"Гидрелла (Вода).\"}],\"$37\"]}]\n18:[\"$\",\"$L35\",null,{\"name\":\"Матрица Пиреллы\",\"align\":\"left\"}]\n19:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Пирелла (Огонь).\"}],\" Пирелла — один из наиболее динамичных морфотипов Эдионид. Зоид вытянут в лентовидную структуру длиной до 1,5 мм, причём основная часть текучего слоя имеет толщину менее 0,05 мм. Длинные тендрилы располагаются преимущественно позади кораллоида и постоянно меняют направление, создавая характерный силуэт, напоминающий языки пламени. Янтарно-оранжевый кораллоид занимает эксцентричное положение и постоянно совершает небольшие колебательные движения.\"]}]\n1a:[\"$\",\"$L35\",null,{\"name\":\"Проводник Аэреллы\",\"align\":\"left\"}]\n1b:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Аэрелла (Возду lassName\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Литолепис (Земля).\"}],\" Развивается медленнее большинства морфотипов. Около 65–70% поглощаемой ПЭ направляется на увеличение плотности кораллоида и текучего слоя, и лишь оставшаяся часть используется непосредственно для роста. Поэтому молодой Литолепис увеличивается в размерах постепенно, зато сформировавшийся зоид способен сохранять жизнеспособность даже при продолжительном снижении концентрации ПЭ. Полный цикл деления при благоприятных условиях занимает в среднем 18–30 часов. После достижения предельной плотности дальнейшее увеличение кораллоида прекращается, а избыточная ПЭ откладывается в минеральных включениях.\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Гидрелла (Вода).\"}],\" Отличается высокой скоростью восстановления собственного объёма. После потери до 40% текучего слоя зоид способен восстановить первоначальный объём примерно за 2–3 часа при достаточной концентрации ПЭ. Рост Гидреллы происходит преимущественно за счёт увеличения площади текучего слоя, а не его плотности, вследствие чего старые особи становятся заметно более вытянутыми. Полный цикл деления занимает около 8–14 часов. При этом дочерние кораллоиды первое время сохраняют повышенную подвижность и могут несколько часов оставаться частью исходной колонии, прежде чем окончательно отделиться.\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[\"$L58\",\" Развивается крайне быстро, однако отличается высокой нестабильностью ранних стадий. При оптимальной концентрации ПЭ молодой зоид способен сформировать полноценный кораллоид менее чем за 6 часов. Около 20% новых зоидов при особенно резких энергетических выбросах погибает ещё до завершения развития из-за нарушения внутренней организации кораллоида, поэтому высокая скорость размножения Пирелл не всегда приводит к пропорциональному увеличению численности колонии. В устойчивой среде доля погибших дочерних зоидов снижается до 5–8%.\"]}]]}],\"\\n\",\"$L59\",\"\\n\",\"$L5a\",\"\\n\",\"$L5b\",\"\\n\",\"$L5c\",\"\\n\",\"$L5d\",\"\\n\",\"$L5e\",\"\\n\",\"$L5f\",\"\\n\",\"$L60\",\"\\n\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"30:[\"$\",\"section\",null,{\"id\":\"размножение\",\"data-rule-section\":true,\"data-rule-section-title\":\"Размножение\",\"className\":\"not-prose my-10 flow-root clear-both scroll-mt-24  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Размножение бесполое. Происходит исключительно путём бинарного деления кораллоида внутри текучего слоя.\"}],\" Нерестовых циклов, половых желёз и икры не существует. Перед делением кораллоид постепенно утрачивает первоначальную компактность и формирует две энергетически обособленные области. После завершения разделения каждая из них окружает себя частью текучего слоя и становится самостоятельным дочерним зоидом. Средняя доля успешно сформировавшихся дочерних особей составляет около 85–95%, однако показатель существенно различается между морфотипами.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Особенности деления по морфотипам:\"}]}],[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Литолепис (Земля).\"}],\" Деление происходит преимущественно в поперечном направлении относительно плоскости зоида. Благодаря плотности кораллоида обе дочерние части почти сразу приобретают одинаковую массу. Около 92% делений завершаются образованием двух жизнеспособных зоидов. Оставшиеся случаи сопровождаются потерей одной из половин кораллоида, после чего повреждённая часть становится минеральным осадком.\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Гидрелла (Вода).\"}],\" Деление может происходить даже во время движения колонии. Текучий слой сначала растягивается между двумя формирующимися кораллоидами, посл :\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Эдиониды не способны целенаправленно нападать и не обладают органами, предназначенными для нанесения повреждений.\"}],\" Основной механизм защиты заключается в массовости, постоянном перемещении колонии и способности переходить в криптобиоз.\"]}],[\"$\",\"p\",null,{\"children\":\"При возникновении опасного энергетического воздействия отдельные морфотипы расходятся в разные слои воды, оставляя наиболее устойчивые формы в зоне воздействия. До 70–80% зоидов может одновременно прекратить активное питание и перейти в состояние покоя, если изменение концентрации ПЭ происходит слишком быстро. Особенно хорошо эта реакция проявляется во время «Дыхания Холода», «Редкой Миракль» и грозовых угроз — Эдиониды не пытаются противостоять аномалии, а фактически пережидают её.\"}],[\"$\",\"p\",null,{\"children\":\"После возвращения подходящих условий восстановление колонии начинается с наиболее устойчивых Литолеписов, Хризелл и Ноктилл, которые становятся энергетическим центром для последующего восстановления остальных морфотипов.\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Опасность для крупных организмов представляют не сами живые зоиды, а массовые скопления погибших оболочек:\"}],\" после разрушения кораллоида текучий слой сохраняет форму от нескольких часов до нескольких суток и способен закупоривать тонкие каналы, жабры, цепи и сосуды. Во время Морской угрозы подобный осадок особенно опасен: после резкого отлива его концентрация на обнажившемся дне может превышать обычную в 10–15 раз.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"32:[\"$\",\"$L6a\",null,{\"children\":[\"$\",\"$L6b\",null,{\"children\":[[\"$\",\"$L6c\",null,{\"title\":\"Биологический фильтр ПЭ\",\"variant\":\"abilities\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Совокупность кораллоидов позволяет колониям Эдионид выполнять функцию естественного биологического фильтра ПЭ:\"}],\" в зависимости от состава морфотипов зрелая колония способна переработать от 5 до 18% рассеянной энергии за сутки, не изменяя общего количества ПЭ — изменяются её распределение, концентрация отдельных атрибутов и степень энергетической стабильности.\"]}],[\"$\",\"p\",null,{\"children\":\"Различные морфотипы фактически выполняют разные стадии одного процесса: Гидреллы и Аэреллы переносят энергию между участками колонии, Пиреллы и Фульгуреллы перерабатывают нестабильные всплески, Ноктиллы связывают остаточную хаотичную ПЭ, Альбеллы отделяют смешанные примеси, Изоцеллы сглаживают энергетические перепады, а Хризеллы способны временно сохранять избыток; Литолеписы фиксируют часть переработанной энергии в придонных структурах, тогда как Гемеллы обеспечивают её перераспределение между живыми зоидами. Небуллы выполняют роль промежуточного слоя, смягчающего резкие изменения энергетического фона.\"}]]}],[\"$\",\"$L6c\",null,{\"title\":\"Влияние на аномалии\",\"variant\":\"abilities\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Благодаря подобному уровню взаимосвязи Эдиониды способны влиять на развитие Аномалий Статуса\"}],\", хотя не способны самостоятельно остановить крупную аномалию: небольшая колония может практически не повлиять на окружающую среду, тогда как скопление площадью более 100 м² способно заметно изменить локальный энергетический фон. В экспериментальных резервуарах такие колонии снижали амплитуду кратковременных энергетических всплесков на 25–40%.\"]}],[\"$\",\"p\",null,{\"children\":\"Особенно хорошо Эдиониды проявляют себя после окончания аномалий: после грозовых и огненных угроз они поглощают оставшуюся нестабильную ПЭ; после «Песни Цикад» ускоренное размножение позволяет быстро занять освободившийся энергетический слой; после «Редкой Миракль» Хризеллы и Изоцеллы постепенно возвращают колонии стабильность.\"}],[\"$\",\"p\",null,{\"children\":\"При этом Эдиониды не способны компенсировать исчезновение самой ПЭ: если фон опускается ниже 50% от необходимого уровня, фильтрационная способность колонии начинает быстро падать. А вот при превышении пропускной способности примерно в 300–400% Эдиониды перестают успевать перерабатывать поступающую энергию, и в таком состоянии их колониальная система сама становится вторичным фактором нестабильности: вокруг неё начинают формироваться свободные скопления ПЭ, способные дать начало появлению Ноэ на береговых линиях.\"}]]}]]}]}]\n"])</script><script>self.__next_f.push([1,"33:[\"$\",\"$L6d\",null,{\"children\":[\"$\",\"$L6b\",null,{\"children\":[[\"$\",\"$L6c\",null,{\"title\":\"Аномальное цветение\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Аномальное цветение.\"}],\" Во время «Песни Цикад», грозовой угрозы и некоторых проявлений «Сердца Свободы» Эдиониды способны начать неконтролируемое размножение. Если скорость поступления ПЭ превышает обычную более чем в 300%, численность колонии за сутки может увеличиться в 10–50 раз. Такое цветение не обязательно является благоприятным: после прекращения аномалии до 80% возникших зоидов может погибнуть в течение следующих 24 часов, оставив после себя плотный планктонный осадок.\"]}]}],[\"$\",\"$L6c\",null,{\"title\":\"Белая вода\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Белая вода.\"}],\" После «Редкой Миракль» в некоторых водоёмах наблюдается обратное цветение: вода становится молочно-белой даже при отсутствии большого количества Альбелл — одновременно погибают несколько морфотипов и их оболочки остаются во взвешенном состоянии. Явление обычно исчезает через 6–18 часов после прекращения осадков.\"]}]}],[\"$\",\"$L6c\",null,{\"title\":\"Чёрный прилив\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Чёрный прилив.\"}],\" Во время ",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Определение атрибута.\"}],\" Эдионидовый бульон логичным образом изменяет цвет и структуру при контакте с ПЭ соответствующего атрибута, поэтому алхимики используют его как дешёвый реактив для определения энергетического состава неизвестных жидкостей. В то же время, это не всегда может быть эффективно: жидкости со сложным атрибутным составом или же крайне высокими по рангу (или агрессивными) компонентами не поддаются определяющим воздействиям планктонов без присутствия большого скопления зоидов различных морфотипов.\"]}]}],\"$L6e\",\"$L6f\",\"$L70\",\"$L71\",\"$L72\",\"$L73\"]}]}]\n"])</script><script>self.__next_f.push([1,"34:[\"$\",\"$L74\",null,{}]\n"])</script><script>self.__next_f.push([1,"38:[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Фульгурелла (Молния):\"}],\" бледно-жёлтая или бело-синяя, с кратковременными светящимися вспышками при высокой концентрации.\"]}]]}]\n39:[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Небулла (Морок):\"}],\" почти полностью прозрачная. Большая колония вызывает визуальное дрожание и лёгкое расслоение очертаний предметов за ней.\"]}]]}]\n3a:[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",nul
