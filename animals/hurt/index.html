 об этом поведать.\"}],\"\\n\",[\"$\",\"$L11\",null,{\"images\":[{\"src\":\"/animals/hurt1.webp\",\"alt\":\"Внешний вид хурта\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Хитин\"},{\"name\":\"Шипы\"}]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Размеры в среднем значении одинаковы для самок и самцов: длина от головы до кончика хвоста – 180 см, ширина туловища в самой объемной части – 60 см, длина жвал – 30 см, длина ножек – 50 см, длина вибриссов – 50 см.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Туловище состоит из хитинового панциря, защищающего как спину, так и брюхо. Прочность высокая, способна выдержать магию вплоть до S+ ранга.\"}],\" Сброшенный хитин молодого хурта даёт сопротивляемость ранга А. Взрослого – S+. \",[\"$\",\"strong\",null,{\"children\":\"Средний вес – 100 кг. Скорость перемещения – 50 км/ч.\"}],\" Высокая скорость реакции.\"]}],[\"$\",\"p\",null,{\"children\":\"По бокам и ближе к хвосту с внутренней стороны расположены костяные шипы, похожие на клыки, размеры которого составляют от 5 до 15 см. Ножки также защищены, довольно мощные, хоть и слабые на вид. Позволяют без особо труда рыть землю, а также взбираться по отвесным стенам и удерживаться на потолках.\"}],[\"$\",\"p\",null,{\"children\":[\"Маленький рот имеет два ряда острых зубов. \",[\"$\",\"strong\",null,{\"children\":\"Сила укуса – примерно как у койота.\"}],\" Сильные жвала позволяют как потрошить мясо жертвы, так и рыть тоннели.\"]}],[\"$\",\"$L13\",null,{\"name\":\"Хвост\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Хвост внешне похож на жало скорпиона, но только в сомкнутом состоянии.\"}],\" Так, он способен раскрываться подобно пасти с клыками, что помогает эффективнее захватывать жертву. \",[\"$\",\"strong\",null,{\"children\":\"Уровень удара жалом ощущается примерно как укус чёрного медведя.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"Вибриссы втягиваются под панцирь, преимущественно когда хурт находится под землей или ведет бой. \",[\"$\",\"strong\",null,{\"children\":\"Это наиболее уязвимая часть тела\"}],\", поэтому для неё предусмотрен такой механизм защиты.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Сильные голосовые связки: замечено, что общаются хурты между собой посредством стрекотания.\"}],\" Поначалу кажется, что он однотонный, но, проведя рядом с ними какое-то время, можно понять, что «речь» имеет различные тона и полутона.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Отличие самок от самцов: более агрессивное поведение самок\"}],\", особенно во время беременности и первых лет жизни потомства, более высокий тон стрёкота и «визга». У самцов вдоль брюха и до самого хвоста «очерчена» чёрная полоса, проявляется в течение первых суток после рождения.\"]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[\"$L14\",\"$L15\",[\"$L16\",\"$L17\",\"$L18\",\"$L19\",\"$L1a\"]]}],\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\", \"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Особые колебания хвоста, вводящие в около гипнотическое состояние, вызывающие дезориентацию.\"}]}]}],[\"$\",\"$L27\",null,{\"title\":\"Рывок\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Быстрей прыжок вперед на 5 метров.\"}],\" Используется, как правило, для эффекта внезапности или после «транса». Завершается ударом хвоста и стрёкотом, сигнализирующим успех или провал.\"]}]}],[\"$\",\"$L27\",null,{\"title\":\"Объятья до последнего вздоха\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Если существо сильно ранено и не сможет отступить, оно намертво цепляется хвостом в жертву и сжимает изо всех сил, игнорируя собственные повреждения. Хватка не ослабляется даже после смерти хурта.\"}]}]}],[\"$\",\"$L27\",null,{\"title\":\"Яд\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В слюне хурта содержится нервно-паралитический яд, вызывающий эффект анестезии.\"}],\" На грешниках проявляется слабее, вызывая онемение только в части тела.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L28\",null,{\"children\":[\"$\",\"$L26\",null,{\"children\":[[\"$\",\"$L27\",null,{\"title\":\"Кулинария\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Мясо хурта нежное и сладкое.\"}],\" Но его нужно правильно приготовить, подчеркнуть вкус правильными специями и выдержать, в зависимости от способа приготовления, определенное время. В противном случае мясо станет безвкусным и жестким. \",[\"$\",\"strong\",null,{\"children\":\"Считается, что особенный вкус, приводящий в экстаз, у мяса беременных самок.\"}]]}]}],[\"$\",\"$L27\",null,{\"title\":\"Медицинское применение\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",
