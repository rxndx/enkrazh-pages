95)\"}],\". Изначальный материал — глубинная безглазая угреобразная форма Е- ранга, добытая из анаэробных водоносных слоёв на малых глубинах. Эти существа обладали примитивной хеморецепцией, но были полностью слепы к ПЭ. Сирена-биолог \",[\"$\",\"$L25\",null,{\"href\":\"/npc/calliope-melanthes\",\"children\":\"Каллиопа Меланфы\"}],\" при поддержке \",[\"$\",\"$L25\",null,{\"href\":\"/sinners/character/?slug=hieronymus-anagnostu\",\"children\":\"нынешнего Верховного Арбитра Иеронима Анагносту\"}],\" предположила, что их нервная система может стать проводником для более сложных энергетических структур.\"]}],\"\\n\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Фаза первая: Имплантация (1695–1696)\"}],\". Ключевой этап — гибридизация с Ноэ. Были отобраны малые особи, обладавшие особой чувствительностью к эдионам Крови. С помощью разнообразных синтагм (сплав атрибутов Кровь + Космос в ёмкости из Отсутствующего) сирены при поддержке Иеронима Анагносту, опытного в алхимии, провели эмбриональную индукцию: икру A. subterranea на стадии бластулы погружали в суспензию, где эдионы Крови постепенно проникали через мембрану в зародышевые ткани. Результат первых трёх поколений (F1–F3) был катастрофическим: 94% эмбрионов погибло от магического отторжения. Выжившие обладали нестабильной нервной системой — их каналы перегорали при контакте с концентрированной ПЭ, и особи умирали в течение месяца.\"]}],\"\\n\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Фаза вторая: Стабилизация (1696–1698)\"}],\". Переломный момент наступил в 1696 году, когда ассистент \",\"$L26\",\" предложила изменить подход: вместо агрессивного внедрения эдионов Крови напрямую, она создала адаптивную среду — водную смесь, насыщенную разбавленной кровью грешников и стабилизированной синтагмой Космос + Вода + Кровь, что позволило эмбрионам постепенно привыкать к всплескам ПЭ, а не противостоять ей. F4 показала 40% выживаемости; F5 дала первые признаки трубчатых каналов — тёмные прожилки на боках, реагировавшие на присутствие крови в воде. Именно в этот период проект получил своё современное название — Лигория, а сами существа были впервые описаны как самостоятельная линия.\"]}],\"\\n\"]}]]}],\"\\n\",\"$L27\",\"\\n\"]}],\"$L28\",\"$L29\",\"$L2a\"]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Поведение Лигории полно покоя, прерываемого редкими актами плавного перемещения.\"}],\" Основное состояние характеризуется парением в толще жидкости с минимальными движениями плавников, при котором трубчатая система непрерывно изучает окружающую среду. При обнаружении  концентрацию (погрешность ±0,3%); состояние жидкости (свежая, заражённая, модифицированная); направление и скорость потока; любые изменения в концентрации или магическом составе окружающей её среды.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Адаптация\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Организм способен перестраивать структуру трубчатых каналов\"}],\" для выработки устойчивости к конкретным сочетаниям компонентов. Процесс занимает 3–5 поколений при лабораторной селекции или 15–20 лет у взрослой особи.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Навигация\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Точное определение направления потока жидкости\"}],\" даже при минимальном градиенте давления проклятой энергии. Позволяет находить утечки в герметичных системах.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Детекция магии\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Усики и кожа способны детектировать магические примеси и следы ПЭ\"}],\", недоступные обычным детекторам. Слабые заклинания (до B+ ранга), направленные на существо, рассеиваются его мембраной без эффекта.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L2e\",null,{\"children\":[\"$\",\"$L2c\",null,{\"children\":[[\"$\",\"$L2d\",null,{\"title\":\"Конфликт НАЭ и Вальгардов\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Между Вальгардами и Научной Ассоциацией Энкража постепенно возникли разногласия\"}],\" по поводу селекционного разведения животных. Вальгарды и сами практиковали выведение питомцев, однако делали это преимущественно для формирования более подходящих и разумных компаньонов, тогда как НАЭ рассматривала селекцию прежде всего как способ усиления полезных биологических свойств. Именно Лигория стала одним из наиболее заметных примеров подобного конфликта: её поколения отбирались по точности анализа жидкости, чувствительности к проклятой энергии и способности адаптироваться к конкретным средам. Вальгарды считали, что превращение живого существа в специализированный биологический инструмент постепенно стирает границу между разведением и созданием ресурса, тогда как НАЭ настаивала, что отсутствие у Лигории развитого разума делает подобные исследования допустимыми при соблюдении установленных норм. И некоторые особенно дотошные Вальгарды до сих пор, после удачных диссертаций 1700-х годов, продолжают продвигать идею прекращения экспериментов не только вокруг в частности Лигорий, но и Ноэ.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Специализация индикатора\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если особь содержалась в среде с определённой формулой более 10 лет\"}],\", её трубчатая система настолько оптимизируется под этот состав, что теряет способность адекватно анализировать другие варианты. Такая особь становится бесполезной для универсальной диагностики, но непревзойдённым индикатором именно своей системы.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Индикатор ритуала\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Во время сложных многофазных ритуалов поведение Лигории меняется синхронно\"}],\" с переходом от одной фазы к другой. Опытный исследователь может определить стадию ритуала по тому, на какой глубине парит рыба и как направлены её усики.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Игнорирование иллюзий\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Поскольку Лигория ориентируется исключительно на энергетический состав\"}],\", она полностью игнорирует визуальные и звуковые иллюзии. В лабораторных условиях их используют для проверки чистоты резервуаров от загрязнений и проклятий.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Признак чистоты\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если в резервуаре с Лигориями наблюдается стабильное, ровное парение всех особей в течение более 6 часов\"}],\" — это считается гарантией того, что система работает в штатном режиме. Этот метод используют как финальную проверку перед началом крупных ритуалов.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"Вдохновение для ИКР\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В период фазы стабилизации Лигорий\"}],\" во время их первых выведений, Иероним Анагносту вдохновился на создание своего будущего алхимического шедевра — ИКР.\"]}]}],[\"$\",\"$L2d\",null,{\"title\":\"«Чёрная линия F13»\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Существуют слухи о нелегальном ответвлении\"}],\", выведенном в 1725 году группой сирен без ведома Научной Ассоциации. Эти особи якобы агрессивны, способны к самостоятельной охоте на мелких деворантов и обладают нестабильными, перевёрнутыми каналами чёрного цвета. НАЭ категорически отрицает их существование, однако в 1732 году в камерах Рек Крови были найдены останки Ноэ с характерными для Лигории следами укусов. Некоторые Вальгарды подозревают, что существует другая линия, используемая в странных экспериментах, однако доказательства найдены не были.\"]}]}],\"$L2f\",\"$L30\",\"$L31\",\"$L32\"]}]}]\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L33\",null,{}]\n"])</script><script>self.__next_f.push([1,"26:[\"$\",\"$L25\",null,{\"href\":\"/npc/irinia-callisti\",\"children\":\"Ириния Каллисти\"}]\n27:[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":
