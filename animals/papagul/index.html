жающей среде.\"}]]}]}],[\"$\",\"$L22\",null,{\"title\":\"Обучение\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Среди приручённых особей встречаются те, кто начинает обучать других:\"}],\" если рядом содержится несколько Папагулей, один может стать источником звуков для остальных, фактически формируя общий репертуар. Такие группы быстрее адаптируются, но и быстрее накапливают сложные искажения, которые сложнее контролировать.\"]}]}],[\"$\",\"$L22\",null,{\"title\":\"Носители сообщений\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В редких случаях Папагули используются как своеобразные носители сообщений (по крайней мере, так было до изобретения Песочных Зеркал).\"}],\" При должной тренировке особь может запомнить и воспроизвести длинную последовательность звуков или слов в нужный момент. Однако надёжность такого метода низкая: сообщение может исказиться, дополниться или смешаться с другими звуками, особенно если птица подвергалась сильным эмоциональным воздействиям.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"$L24\",null,{}]\n"])</script><script>self.__next_f.push([1,"25:I[96923,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/342ps15a9-yb-.js\",\"/enkrazh-pages/_next/static/chunks/3okb46m5uyfvy.js\",\"/enkrazh-pages/_next/static/chunks/0gkg3_pbo_heb.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\"],\"Providers\"]\n26:I[811522,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.
