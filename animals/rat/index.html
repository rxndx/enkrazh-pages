артефакты, оставляя последствия.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Желудок вырабатывает едкий сок, способный растворять кость и минеральные, металлические сплавы.\"}],\" Избыточное количество данной жидкости Раты способны срыгивать наружу в виде едкой слизи, вызывающей ожоги до третьей степени.\"]}],[\"$\",\"$L12\",null,{\"name\":\"Бляшки\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожа плотная, грубая, особенно в области груди и живота. В этих зонах она покрыта плотными кератиновыми бляшками, способными рассеивать кинетическую энергию удара\"}],\", что делает Ратов почти невосприимчивыми к тупому оружию и даже к прямому попаданию мелкокалиберного огня, выполненного из ресурсов мира. \",[\"$\",\"strong\",null,{\"children\":\"Кератиновые бляшки на коже самок также содержат микроскопические полости, способные поглощать свет\"}],\", что делает их почти невидимыми в тени, но и позволяет частично игнорировать энергию магических атак, особенно основанных на свете, молнии и огне (не касается легендарных орудий).\"]}],\"$L13\",\"$L14\",\"$L15\"]]}],\"\\n\",\"$L16\",\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\"]}]\n"])</script><script>self.__next_f.push([1,"20:I[252775,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/1zwpvfl412twt.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\" ые порезы и выворачивая суставы.\"]}],[\"$\",\"$L20\",null,{\"items\":[{\"name\":\"Желудочный сок (слеза демона)\"},{\"name\":\"Железа дымки\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В случае угрозы со стороны превосходящего врага Раты могут выделять плотную чёрную дымку, скрывающую их положение.\"}],\" Дымка, как предположили Вальгарды, – это плотная взвесь тьмы и частиц их желудочного сока, создающая область тотального поглощения звука, света и магии. \",[\"$\",\"strong\",null,{\"children\":\"Внутри подобного купола царит абсолютная тишина и темнота, а жертва начинает испытывать удушье\"}],\", как будто сама тьма впитывает воздух из легких (даже если грешник не дышит).\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Замечено было недавно (в сражениях января 2019 года) и такое, что Рат способен фокусироваться и выплевывать сгусток чистой тьмы, создавая временный коридор в теневом плане.\"}],\" По данному коридору его сородичи могут совершить мгновенный бросок на короткое расстояние, появляясь из тени другой цели. Подобное требует огромных затрат энергии и координации, что доказывает их развитый интеллект и способность к эволюции.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Против хорошо бронированного одиночного противника два или три Рата могут применить синхронизированную тактику:\"}],\" один отвлекает фронтальной атакой, второй в это время молниеносно атакует сухожилия на ногах, чтобы повалить жертву, а третий в прыжке наносит удар по незащищенной шее или стыкам доспехов.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"$L21\",null,{\"children\":[\"$\",\"$L22\",null,{\"children\":[[\"$\",\"$L23\",null,{\"title\":\"Метка\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Взгляд Рата может наложить на жертву невидимую метку. Отмеченная цель становится легче отслеживается для всего клана, а её
