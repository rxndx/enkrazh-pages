е повреждения противнику, фактически служа дополнительными орудиями обороны и устрашения.\"]}],[\"$\",\"$L11\",null,{\"name\":\"Нёбный глаз\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Внутри основной пасти (какой, ещё надо догадаться!), на нёбе, расположен единственный настоящий глаз Сиддарта\"}],\" – огромный, лишенный зрачка, мерцающий, как полированный обсидиан. Он всегда открыт и служит неким рубильником для их самых мощных способностей, но увидеть его можно, только если Сиддарт сам этого захочет.\"]}],[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Рог\"},{\"name\":\"Шерсть/грива самок\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Спинно-задняя часть тела покрыта густой структурой, внешне напоминающей гриву, однако при детальном рассмотрении она представляет собой систему ветвистых роговых отростков\"}],\", морфологически схожих с древесными ветвями. Данные рога обеспечивают камуфляж, позволяя особям сливаться с ландшафтом горных склонов. В моменты использования своих способностей они могут слабо светиться тусклым, пепельным светом, а в спящем состоянии на них часто вырастают настоящие лишайники и мох, делая Сиддарта неотличимым от скалы. \",\"$L13\"]}]]]}],\"\\n\",\"$L14\",\"\\n\",\"$L15\",\"\\n\",\"$L16\",\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\"]}]\n"])</script><script>self.__next_f.push([1,"21:I[505014,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/0gkg3_pbo_heb.js\",\"/enkrazh-pages/_next/static/chunks/308b3b56paluj.js\",\"/enkrazh-pages/_next/static/chunks/412hvl12myu5u.js\",\"/enkrazh-pages/_next/static/chunks/342ps15a9-yb-.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/stat en\":[[\"$\",\"strong\",null,{\"children\":\"Сиддарты характеризуются сложной поведенческой моделью, сочетающей крайнюю физическую мощь и выраженную игривость.\"}],\" Независимо от возраста, особи демонстрируют устойчивую склонность к игровой активности, схожую с поведением крупных домашних псов: они таскают предметы, преследуют мелких животных и вовлекают грешников в своеобразные игры.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Их игра – это всегда диалог, где негативная реакция и скучные взаимодействия всегда приводят к соответствующей отдаче.\"}],\" Сиддарт изучает реакцию, подстраивается, усложняет правила. \",[\"$\",\"strong\",null,{\"children\":\"Если жертва проявляет смекалку и творческий подход к спасению (например, создает сложные ловушки или самоотверженно защищает других), Сиддарт может не только пощадить, но и одарить своеобразным подарком\"}],\" – кратковременной, но яркой позитивной иллюзией, например, видением утраченного родного дома.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Контакт с Сиддартом при первой встрече часто начинается с безобидных взаимодействий, однако со временем интенсивность игры возрастает, а ставки растут.\"}],\" Особь может проявлять всё более агрессивные формы поведения и наглеть, если не выставлять разумным образом границы, — сильные толчки, покусывания и удары, которые, учитывая размеры и силу существа, быстро становятся смертельно опасными. \",[\"$\",\"strong\",null,{\"children\":\"Попытки прекращения взаимодействия посредством скучного побега приводят к дезориентации и раздражению Сиддарта:\"}],\" известны случаи, когда подобная попытка вызвала у особи приступ агрессии, закончившийся гибелью грешника.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Сидарт, привязываясь с течением времени к грешнику, постепенно подпитывается его эмоциональными выбросами\"}],\" — азартом, страхом, радостью, привязанностью. Чем сильнее связь, тем вк
