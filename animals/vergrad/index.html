ext-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L11\",null,{\"items\":[{\"name\":\"Сегмент панциря\"},{\"name\":\"Онео\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Тело Верграда сегментировано: каждый элемент представляет собой гигантскую бронированную плиту, сформированную из структуры, напоминающей смесь обсидиана, металла и кристаллизованной лавы — ныне известного крайне редкого минерала, известного как Онео.\"}],\" Пластины частично перекрывают друг друга, образуя подвижный панцирь. Между ними проходят узкие каналы, заполненные плотной магмой, находящиеся под колоссальным давлением.\"]}],[\"$\",\"p\",null,{\"children\":[\"Согласно выдвинутым гипотезам, магма выполняет сразу несколько функций: служит гидравлической системой, передающей усилие по всему телу; служит источником тепловой и энергетической активности; а также участвует в восстановлении повреждённых сегментов. \",[\"$\",\"strong\",null,{\"children\":\"В состоянии покоя пластины выглядят тусклыми, почти каменными, при возбуждении или атаке магма начинает светиться сквозь трещины, и поверхность панциря становится почти зеркальной.\"}]]}],[\"$\",\"$L12\",null,{\"name\":\"Якорный шип\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Туловище Верграда также покрыто множеством острых отростков, напоминающих гигантские серпы или шипы, используемые для бурения и разрыхления породы:\"}],\" при движении через камень эти отростки начинают вибрировать, разрушая структуру минералов. В результате твёрдая порода временно становится пластичной, что позволяет существу буквально плыть сквозь горные массивы. Кроме того, существуют специализированные отростки, выделяющиеся среди прочих и напоминающие якорные шипы. \",[\"$\",\"strong\",null,{\"children\":\"Они способны вонзаться в камень и фиксировать тело, позволяя Верграду совершать толчки и мгновенно разгоняться даже в плотной породе.\"}]]}],[\"$\",\"$L12\",null,{\"name\":\"Зубчатая пластина\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Клиновидная передняя часть тела Верграда формирует массивную голову, представляющую собой своеобразный бурящий конус, адаптированный к разрушению твёрдых пород.\"}],\" Челюстной аппарат устроен по радиальному принципу: несколько концентрических колец зубчатых пластин окружают центральное жерло, образуя структуру, напоминающую воронку. Каждая пластина способна незначительно смещаться относительно соседних, создавая эффект непрерывного измельчения. \",\"$L13\"]}],\"$L14\",\"$L15\",\"$L16\",\"$L17\",\"$L18\",\"$L19\"]]}],\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\"]}]\n"])</script><script>self.__next_f.push([1,"25:I[723063,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/1zwpvfl412twt.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"AnimalAbilities\"]\n26:I[723063,[\"/enkrazh-pages/_next/st
