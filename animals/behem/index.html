\u0026\u003ep]:my-2\",\"children\":[\"$\",\"p\",null,{\"children\":\"...Невиданный зверь поднялся из пучин, будто остров, восставший против Бога. Волны его гнали к скалам. Мы, в безумии, метнули гарпун. Железо лопнуло о шкуру, словно стекло. Чудище даже не взглянуло. Лишь один из его щупальцев-отростков медленно повернулся в нашу сторону и... бросил в нас камень. Не слепой обломок, а идеально отполированный шар, размером с бочку. Он просвистел над мачтой и упал за кормой, испуская синий свет. Наш шаман, старик Эйрик, сказал, что это было предупреждение. «Камень гнева», — прошептал он. Мы бросили второе копьё. И тогда... тогда море под нами вздохнуло. Единый удар хвоста, и нас швырнуло на подводные рифы. Он не атаковал. Он просто... оттолкнул. Как грешник отмахивается от назойливой мухи. Нам едва ли удалось пережить эту встречу\"}]}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Голова крупная и широкая, составляет почти треть длины тела.\"}],\" Верхняя часть головы покрыта массивными, ороговевшими пластинами, образующими нечто вроде шлема.\"]}],[\"$\",\"$L13\",null,{\"name\":\"Зуб\",\"align\":\"left\"}],\"$L15\",\"$L16\",\"$L17\",\"$L18\",\"$L19\",\"$L1a\"]]}],\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\n\",\"$L26\",\"\\n\",\"$L27\"]}]\n"])</script><script>self.__next_f.push([1,"28:I[23063,[\"/enkrazh-pages/_next/static/chunks/35zw57cq-m4lr.js\",\"/enkrazh-pages/_next/static/chunks/1xqs7k9e1x0l8.js\",\"/enkrazh-pages/_next/static/chunks/1-8s9_t85wwr4.js\",\"/enkrazh-pages/_next/static/chunks/1vne73me6mm8f.js\",\"/enkrazh-pages/_next/static/chunks/1mbkeomlmz_y9.js\",\"/enkrazh-pages/_next/static/chunks/04c2wy6uiyy8a.js\",\"/enkrazh-pages/_next/static/chunks/38blq-k4r5m2g.js\",\"/enkrazh-pages/_next/static/chunks/082eoqf00ov_m.js\",\"/enkrazh-pages/_next/static/chunks/27p9edb5u969d.js\",\"/enkra ицы оседают на зубах-фильтрах, откуда специальным языком-скребком счищаются и проглатываются.\"]}]\n16:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Внутренняя поверхность глотки и желудка Бехема выстлана чрезвычайно прочными мускулистыми стенками, способными выдерживать абразивное воздействие проглоченных камней и металлов.\"}],\" Процесс пищеварения сопровождается выделением высококонцентрированных кислот и мощных импульсов, способных на короткое время выводить из строя чувствительную навигационную аппаратуру прямо над местом его кормёжки.\"]}]\n17:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Плавники мощные, грудные – широкие и сильные, схожи на ласты, дабы ползать по дну или же маневрирования меж скал; хвостовой – крупный, в форме полумесяца, способный генерировать колоссальную тягу, что может создавать подводные толчки.\"}],\" Очевидцы, что застали погибель и разрушение собственных лодок или же кораблей, описывали, как один взмах мог воссоздать четырёхметровые волны или же закрутить водоворот.\"]}]\n18:[\"$\",\"$L13\",null,{\"name\":\"Полипы\",\"align\":\"left\"}]\n19:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожа толстая (до 1.5 метров в наиболее защищенных местах), темно-свинцово-серая, покрытая целыми террасами и каньонами.\"}],\" Текстура напоминает плотную кору дерева или вулканическую породу. В складках кожи обитают колонии симбиотических полипов, которые подсвечивают контуры существа мягким ало-зеленым светом, создавая мутную прослойку, часто видимую в Море Кровавых Слёз.\"]}]\n1a:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Спина и бока Бехема покрыты массивными, костяными наростами, похожими на сталактиты, которые формируют настоящий бронированный панцирь.\"}],\" Данные образования являются результатом вековой секреции избыточных минералов через поры кожи, создавая уникальный для каждой особи отпечаток или же ландшафт поверхности, по которым исследователи и различали Бехемов.\"]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Вокруг рта растет венчик коротких, толстых щупалец (как у морского черта), но они не используются для хватания: каждое пронизано сенсорными рецепторами, улавливающими малейшие колебания воды, ауры и даже движение живущих вокруг существ.\"}],\" Это его основной орган зрения и ориентации в кромешной тьме, и ими же они находят минеральные жилы на дне.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"По бокам головы расположены ряды углублений, похожих на боковую линию у рыб, но гораздо более чувствительных, улавливающих изменения давления и температуры\"}],\", что позволяет Бехему чувствовать тектонический стресс и находить трещины в земной коре.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Глаза небольшие, глубоко посаженные, с молочно-белой радужкой\"}],\", на фоне всего тела Бехема напоминающих скорее бусины. Они почти не видят детали, но чрезвычайно чувствительны к проблескам света, включая тусклое сияние глубоководных существ.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Окрас\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Узоры индивидуальны для каждой особи, как отпечатки пальцев.\"}],\" Из примечательного, с возрастом окрас Бехемов темнеет, приобретая более насыщенные металлические оттенки — от медного до глубокого синевато-стального, в зависимости от преобладающих металлов в их рационе. \",[\"$\",\"strong\",null,{\"children\":\"Молодые особи имеют более светлый, землисто-серый цвет.\"}]]}]]}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда обитания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Море Кровавых Слёз.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Встречается в секторах S4-S8, радиальных поясах P6-P7 (молодые особи были замечены в поясах P4-P5), глубинных слоях L5-L7 (иногда поднимаются до L4 в периоды геомагнитных бурь).\"}],\" Крайне редким явлением считается поднятие Бехема на L1, впервые отмеченном в 1419 году официально Вальгардами (старый судовой журнал, чьи записи датированы 248 годом, встретил своё подтверждение именно в это время, равно как и отмеченные старые легенды жилой зоны).\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"S4-S5 P5-P6 L5-L6\"}],\" считается редким местом обитания для молодых особей, что предпочитают скорее пещеры и термальные зоны.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"S6-S8 P6-P7 L6-L7\"}],\" является основным местом обитания взрослых титанов, зоной их сновидений и местом геомагической активности.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"S3 P4 L1-L4\"}],\" исключительно редкое всплытие во время бурь или же иных аномальных явлений.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни и питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Всплывают на средние и верхние границы моря крайне редко, обычно в периоды геомагнитных бурь, колоссальных толчков или тяжелейших аномалий.\"}],\" Их жизненный цикл в целом тесно связан с активностью дна: отмечается, что \",[\"$\",\"strong\",null,{\"children\":\"в периоды сейсмического затишья Бехемы могут впадать в состояние, похожее на спячку, зарываясь в донный ил и значительно замедляя метаболизм\"}],\", что делает их почти неотличимыми от скал. В остальном же порядке, они бороздят глубоководные просторы Моря Кровавых Слёз, ведя оседлый образ жизни, годами патрулируя свои обширные кормовые территории.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Основной их рацион — минералы:\"}],\" они часто подплывают к глубоководным жилам и соскребают свои мощные губы и язык о стенки источников, поглощая богатые металлами отложения. Их зубы в этом процессе помогают соскабливать особенно твердые наросты, осколки от которых может выносить на берега морских вод.\"]}],[\"$\",\"blockquote\",null,{\"className\":\"not-prose relative flow-root my-8 rounded-xl border border-[#9c7b3f26] bg-[#1a1315]/60 backdrop-blur-sm shadow-[0_0_40px_-24px_rgba(0,0,0,0.9)] px-4 py-5 pl-10 sm:px-6 sm:py-6 sm:pl-14\",\"children\":[[\"$\",\"$L14\",null,{\"ref\":\"$undefined\",\"iconNode\":\"$5:props:articleContent:6:props:children:2:1:props:children:0:props:iconNode\",\"className\":\"lucide-quote absolute left-3 top-5 sm:left-5 sm:top-6 h-4 w-4 text-[#c9bdb460] rotate-180\",\"aria-hidden\":true,\"strokeWidth\":1.5}],[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"absolute left-4 sm:left-6 top-14 sm:top-15 bottom-6 w-px bg-gradient-to-b from-[#7c2d3a80] to-transparent\"}],[\"$\",\"div\",null,{\"className\":\"font-(family-name:--font-whisper) text-[#c9bdb4] text-[1.15rem] leading-[1.85] tracking-normal [\u0026\u003ep]:my-2\",\"children\":[\"$\",\"p\",null,{\"children\":\"...И когда море начинало кипеть белой пеной, а ветер выл, будто души утопленников, грешники шептали: «Старик-Хребет проснулся». Они верили, что Бехемы спят, укоренившись в ил, и видят сны. И сны эти — о прошлом мира; о времени, когда воды здесь не было, а было лишь сплошное пламя. И если Бехему снится дурной сон — кошмар самого моря — он ворочается во сне, и от этого рождаются бури. Потому в шторм не проклинали Кобру, а бросали за борт отполированные камни и куски руды, шепча: «На, Хребет, грызи, не просыпайся». Считалось, что это подношение умастит его сон и сделает его сладким\"}]}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"«Оно – коллекционер. И, возможно, ценитель»\"}],\" — говорится в отчётах исследовательской группы Вальгардов после первого научного контакта с существом, установленном в 1419 году.\"]}],[\"$\",\"$L13\",null,{\"name\":\"Конкремент\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Побочный продукт пищеварения — чистейшие кристаллы и сплавы металлов, которые Бехем время от времени срыгивает в виде гладких, отполированных конкреций.\"}],\" Эти подарки так же иногда находят на берегу, более концентрированных, нежели размытые водой разрушенные осколки.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Развитие и размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Новорождённые Бехемы, размером не более акулы, первые несколько лет жизни проводят в пещерах на средней глубине\"}],\", на которой Вальгарды смогли зафиксировать активность, питаясь мягкими железистыми наростами и кораллами. \",[\"$\",\"strong\",null,{\"children\":\"Их броня и фильтрующие зубы формируются лишь к десяти годам\"}],\", после чего они начинают опускаться на глубину, накапливая огромное количество проклятой энергии и постепенно формируя устойчивый рацион. \",[\"$\",\"strong\",null,{\"children\":\"Полное погружение Бехемов происходит после достижения 50-60 лет (предположительно, половозрелости)\"}],\", после чего они теряются с радаров.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Родительской заботы замечено не было.\"}]}],[\"$\",\"$L13\",null,{\"name\":\"Минеральный нарост\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бехемы лишены привычных органов размножения. Согласно одной из маргинальных, но интригующих гипотез одного из Вальгардов, новые Бехемы не рождаются, а откалываются от тел старших особей во время особенно мощных тектонических событий.\"}],\" Гигантский минеральный нарост на спине родителя достигает критической массы и, поглотив достаточно энергии, отделяется, становясь новым, полностью сформированным существом.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Демонстрируют сложное социальное поведение: они общаются друг с другом, создавая песни, которые могут распространяться на сотни километров.\"}],\" Данные звуковые паттерны передают информацию о маршрутах миграции, богатых кормовых местах и, возможно, ещё некие сведения, непонятные другим видам. \",[\"$\",\"strong\",null,{\"children\":\"Каждый раз их общение сопровождается глубинным китовым рокотом, иногда сильно повышающим тревожность грешников, чувствительных к звукам.\"}]]}]]}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Приручение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Прямому приручению не поддаются в силу своего образа жизни и размеров.\"}],\" Однако, они способны узнавать отдельных существ, которые их не беспокоят, и могут проявлять к ним дружелюбный интерес: подплывать близко, позволять наблюдать за собой, иногда делиться особенно красивыми минеральными наростами, которые они находят. \",[\"$\",\"strong\",null,{\"children\":\"В редком исключении они могут вступать в контакт с сиренами.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Теоретически, можно достичь состояния признания: если разумное существо годами будет следовать за определенным Бехемом, не причиняя вреда, и подносить ему редкие минералы, кит может привыкнуть к его присутствию; может позволять такому соседу находиться на своей спине, изучать его экосистему, а иногда — дарить ему особенно ценные минеральные конкреции.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L28\",null,{\"children\":[[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"По данным наблюдений Вальгардов, на сегодняшний день подтверждено существование шести живых особей Бехемов, каждый из которых отличается не только окраской и структурой панциря, но и характером поведения, зависящим от преобладающего минерала в рационе. Виды были зафиксированы лишь единожды.\"}]}],[\"$\",\"$L13\",null,{\"name\":\"Перцептолит\",\"align\":\"left\"}],[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бехем Перцептолитовый\"}],\" — окрас его матово-чёрный с сетью ультрамариновых прожилок, которые слабо пульсируют в такт дыханию. Издали он кажется тенью, движущейся под толщей воды, — словно отсутствие света обрело форму. Поведение чаще тихое и неуловимое. \",[\"$\",\"strong\",null,{\"children\":\"Иногда из глубин Моря Кровавых Слёз благодаря нему поднимаются всполохи синего сияния — это «взгляд моря»\"}],\", когда Бехем переворачивается спиной вверх, чтобы обозревать поверхность, и который грешники нередко путают со взглядом Йормунганда.\"]}]]}],\"\\n\"]}],[\"$\",\"$L13\",null,{\"name\":\"Параллаксит\",\"align\":\"left\"}],[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бехем Параллакситовый\"}],\" — окрас темно-дымчатый, с переливами зеркальных пластин на боках. Каждая пластина отражает смещённый образ — искажённые морские глубины, которых нет, отчего тем, кому он встречался, говорили, будто он отражал свет затерянных вод Энгурры и зиккуратов города Эриду… \",[\"$\",\"strong\",null,{\"children\":\"Любопытен и склонен к играм с восприятием: в старых отчётах Вальгардов говорится, что он мог сопровождать корабль часами, отражаясь сразу в нескольких направлениях.\"}]]}]]}],\"\\n\"]}],[\
