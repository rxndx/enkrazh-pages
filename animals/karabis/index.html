atic/chunks/1-8s9_t85wwr4.js\",\"/enkrazh-pages/_next/static/chunks/1vne73me6mm8f.js\",\"/enkrazh-pages/_next/static/chunks/1mbkeomlmz_y9.js\",\"/enkrazh-pages/_next/static/chunks/04c2wy6uiyy8a.js\",\"/enkrazh-pages/_next/static/chunks/38blq-k4r5m2g.js\",\"/enkrazh-pages/_next/static/chunks/082eoqf00ov_m.js\",\"/enkrazh-pages/_next/static/chunks/27p9edb5u969d.js\",\"/enkrazh-pages/_next/static/chunks/2rnuhdqj80xwy.js\",\"/enkrazh-pages/_next/static/chunks/1a52kp8o17bts.js\"],\"AnimalDetailView\"]\n11:I[52775,[\"/enkrazh-pages/_next/static/chunks/35zw57cq-m4lr.js\",\"/enkrazh-pages/_next/static/chunks/1xqs7k9e1x0l8.js\",\"/enkrazh-pages/_next/static/chunks/1-8s9_t85wwr4.js\",\"/enkrazh-pages/_next/static/chunks/1vne73me6mm8f.js\",\"/enkrazh-pages/_next/static/chunks/1mbkeomlmz_y9.js\",\"/enkrazh-pages/_next/static/chunks/04c2wy6uiyy8a.js\",\"/enkrazh-pages/_next/static/chunks/38blq-k4r5m2g.js\",\"/enkrazh-pages/_next/static/chunks/082eoqf00ov_m.js\",\"/enkrazh-pages/_next/static/chunks/27p9edb5u969d.js\",\"/enkrazh-pages/_next/static/chunks/2rnuhdqj80xwy.js\",\"/enkrazh-pages/_next/static/chunks/1a52kp8o17bts.js\"],\"CreatureDropGallery\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"slug\":\"karabis\",\"articleContent\":[[\"$\",\"p\",null,{\"children\":\"Земляной Карабис обладает длинным, мускулистым телом, покрытым плотной кожей с шершавой текстурой. На его спине расположены мелкие защитные щитки, а в передней части тела — крепкие, изогнутые челюсти, которые помогают ему рыть туннели в земле. Его тело постепенно утончается к хвосту, что позволяет эффективно двигаться в узких пространствах.\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Карабис является своеобразным вредителем, который повсеместно любит уничтожать продовольствие или же плоды, растения, которые обладают высокой концентрацией.\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожа Земляного Карабиса чрезвычайно эластична и прочна, что позволяет ему не только легко перемещаться по узким туннелям, но и выдерживать давление на больших глубинах.\"}],\" Довольно много молодых Карабисов можно вылавливать на поверхности до 10 метров, и лишь самые крупные встречаются от 40 метров.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Основные размеры Карабиса составляют в длине от 2 до 15 сантиметров, при этом его диаметр может варьироваться от 1 до 5 сантиметров. Взрослая особь может весить до 1 килограмма\"}],\", в зависимости от насыщенности питанием и влажности окружающей среды.\"]}],[\"$\",\"$L11\",null,{\"items\":[{\"name\":\"Энергетические кристаллы\"},{\"name\":\"Слизь\"},{\"name\":\"Слепки\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В периоды линьки (которую Карабисы проходят несколько раз за жизнь, особенно в молодости) старая, сброшенная кожа не растворяется сразу.\"}],\" Благодаря смеси слизи, земли и энергетических кристаллов, она быстро затвердевает, образуя прочный слепок-футляр. Мелкие существа иногда используют пустые слепки как временные убежища. \",[\"$\",\"strong\",null,{\"children\":\"Находка такого слепка – верный признак, что Карабисы обитают в данной местности и, возможно, недавно линяли (значит, они активны и рядом).\"}]]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"У Земляного Карабиса нет глаз, но он обладает чувствительными волосками по бокам тела, которые воспринимают вибрации и изменения давления концентрации.\"}],\" Эти волоски позволяют ему легко ориентироваться в темноте подземных ходов, а также искать наиболее плодовитые земли, в которых наибольшее количество концентрации.\"]}]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[\"$L12\",\"$L13\",[\"$L14\",\"$L15\"]]}],\"\\n\",\"$L16\",\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\"]}]\n"])</script><script>self.__next_f.push([1,"1e:I[44350,[\"/enkrazh-pages/_next/static/chunks/35zw57cq-m4lr.js\",\"/enkrazh-pages/_next/static/chunks/1xqs7k9e1x0l8.js\",\"/enkrazh-pages/_next/static/chunks/1-8s9_t85wwr4.js\",\"/enkrazh-pages/_next/static/chunks/1vne73me6mm8f.js\",\"/enkrazh-pages/_next/static/chunks/1mbkeomlmz_y9.js\",\"/enkrazh-pages/_next/static/chunks/04c2wy6uiyy8a.js\",\"/enkrazh-pages/_next/static/chunks/38blq-k4r5m2g.js\",\"/enkrazh-pages/_next/static/chunks/082eoqf00ov_m.js\",\"/enkrazh-pages/_next/static/chunks/27p9edb5u969d.js\",\"/enkraz ,null,{\"children\":\"При длительном нахождении в зонах с очень низкой концентрацией энергии, синие пятна Карабиса не просто тускнеют, а приобретают тускло-серый, пепельный оттенок.\"}],\" Сама кожа также становится более матовой и безжизненной на вид. \",[\"$\",\"strong\",null,{\"children\":\"В таких условиях Карабис становится практически неотличим от безжизненного куска глины или камня\"}],\" даже для существ, чувствительных к энергии. Это позволяет ему переждать неблагоприятные периоды или прятаться от хищников, ищущих энергетически активную добычу.\"]}]\n16:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда обитания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Земляной Карабис обитает в глубинах плодородной почвы, предпочитая влажные и тёплые места.\"}],\" Он роет сложные туннельные системы. \",[\"$\",\"strong\",null,{\"children\":\"Карабис способен выдерживать тяжёлые перепады температуры\"}],\", если у него будут запасы, а почва не будет подвергнута катаклизмам.\"]}]]}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни и питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Своё основное время препровождения Карабис тратит на то, чтобы рыть тоннели и путешествовать с одной точки в другую ради поиска наибольшей энергетической жилы.\"}],\" Он ведёт преимущественно одиночный образ жизни, редко встречаясь с сородичами, кроме как в брачный период. Как правило, каждый Карабис стремится обзавестись плодовитым источником питания для комфортной жизни, в которой может себе позволить заводить потомство.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Он старается избегать активных магических источников, которые продуцируют грешники\"}],\", из-за своей чувствительности к изменению окружающего фона.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В исключительно редких случаях, при экстремальном стрессе или в местах аномально высокой и нестабильной энергии (например, эпицентр недавней магической битвы), множество Карабисов инстинктивно сбиваются в плотный шар.\"}],\" Внешние особи направляют свои защитные выделения и энергетические кристаллы наружу, создавая прочный, раздражающий и энергетически шумный барьер. Внутри шара их коллективные способности к аккумуляции и преобразованию энергии работают синхронно, пытаясь стабилизировать бушующие вокруг потоки и создать безопасный пузырь.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Земляной Карабис питается корнями растений, мелкими насекомыми и энергетическими остатками других существ.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Развитие и размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Развитие Земляного Карабиса проходит в несколько этапов: личинка, молодая особь и взрослая особь.\"}],\" Личинки развиваются в глинистых подземных камерах, питаясь энергетическими отложениями. После нескольких месяцев личинка превращается в молодую особь, которая начинает самостоятельную жизнь, рыть собственные туннели и искать пищу. \",[\"$\",\"strong\",null,{\"children\":\"Взрослый Карабис достигает полной зрелости через 2-3 года\"}],\", после чего начинает искать партнёра для размножения.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Карабисы стремятся найти для своего потомства наиболее концентрированный источник земли, либо же ищут иные средства.\"}],\" Например, огромную кладку Карабисов можно найти на местах недавней погибели каких-либо существ или же грешников, либо же на кровопролитных территориях.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Размножение Земляного Карабиса происходит раз в несколько лет, в зависимости от условий среды.\"}],\" Размножается Земляной Карабис путём откладывания яиц в специальные подземные камеры. \",[\"$\",\"strong\",null,{\"children\":\"В одной кладке может быть до 100 яиц\"}],\", из которых через несколько недель вылупляются маленькие личинки. Впрочем, лишь часть из них — действительно содержит потомство, в то время как другая половина выступает обманкой.\"]}],[\"$\",\"$L1e\",null,{\"name\":\"Яйца (куколки)\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Самка формирует вокруг кладки сложную структуру из пережеванной земли, своей слизи и слюны, создавая множество маленьких (с грецкий орех) пустотелых шариков-кукол, внутри которых и находятся яйца.\"}],\" Куклы защищают яйца от механических повреждений, перепадов влажности и температуры. \",[\"$\",\"strong\",null,{\"children\":\"Они очень прочны на сжатие (понадобится сила А- ранга), но хрупки при ударе.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Внешне куклы выглядят как обычные комки глины или мелкие камни, сливаясь с окружающей почвой.\"}],\" Стенки кукол пропитаны концентрированной проклятой, стабильной энергией из слизи самки. \",[\"$\",\"strong\",null,{\"children\":\"Вылупившаяся личинка первое время питается, поедая свою куклу изнутри, прежде чем выбраться наружу.\"}]]}]]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Земляной Карабис крайне осторожен и избегает прямых контактов с потенциальными угрозами.\"}],\" Он очень чувствителен к изменению влажности и температуры, а также концентрации, потому \",[\"$\",\"strong\",null,{\"children\":\"нарыть Карабисов порой бывает не так просто: магию использовать, как правило, запрещается, и приходится вручную выкапывать\"}],\", так как неестественные энергетические импульсы на поверхности заставляют Карабисов уходить на глубину подальше.\"]}]]}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Самозащита и нападение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В случае опасности Земляной Карабис быстро закапывается глубже в землю или использует свои мощные челюсти для обороны.\"}],\" Рекомендуется его ловить не за хвост или туловище, а вытягивать за верхние части, чтобы Карабис не мог развернуться и укусить. \",[\"$\",\"strong\",null,{\"children\":\"При угрозе он также выделяет неприятный запах, отпугивающий врагов.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если Карабиса схватить и удерживать, причиняя боль и панику, или если он попадает в зону внезапного мощного выброса чужеродной магии/энергии, его внутренние энергетические кристаллы вступают в нестабильную реакцию.\"}],\" Карабис совершает резкий мышечный спазм, провоцируя микровзрыв скопившейся в кристаллах энергии.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Взрыв не наносит большого физического урона, но оставляет после себя нарывающие миазмы в случае, если неправильно обращаться с существом.\"}],\" Однако микровзрыв оглушает и дезориентирует нападающего, повреждает тонкие магические связи, часто вызывая сбой в заклинаниях или работе артефактов, и дает Карабису шанс вырваться и зарыться.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Для самого Карабиса это крайне вредно\"}],\" – он теряет большую часть накопленной энергии, его кристаллы трескаются, а регенерация сильно замедляется. Он становится уязвимым и впадает в состояние энергетического голодания, вынужденный срочно искать пищу.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"$L1f\",null,{\"children\":[\"$\",\"$L20\",null,{\"children\":[[\"$\",\"$L21\",null,{\"title\":\"Аккумуляция энергии\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Одной из самых выдающихся его способностей является способность аккумулировать и хранить энергию.\"}],\" В периоды изобилия Карабис активно поглощает энергетические остатки из земли, растений и других существ, преобразовывая их в своеобразные энергетические кристаллы, которые откладываются в его теле. \",[\"$\",\"strong\",null,{\"children\":\"Эти кристаллы не только служат источником энергии в неблагоприятные сезоны, но и усиливают его регенеративные способности\"}],\", позволяя быстро восстанавливать повреждённые ткани.\"]}]}],[\"$\",\"$L21\",null,{\"title\":\"Кислотные челюсти\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Его челюсти не только мощные, но и могут выделять особую кислоту, которая разъедает даже самые твёрдые корни и минералы.\"}],\" Это позволяет Земляному Карабису прокладывать туннели в особенно плотных слоях почвы, которые другим подземным существам недоступны.\"]}]}],[\"$\",\"$L21\",null,{\"title\":\"Изменение окраса\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"При повышении концентрации энергетических потоков в почве, его пятна на коже начинают светиться тусклым синим светом.\"}],\" Это свечение помогает ему ориентироваться в поисках самых богатых энергетических жил и также отпугивает потенциальных хищников.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"$L22\",null,{\"children\":[\"$\",\"$L20\",null,{\"children\":[[\"$\",\"$L21\",null,{\"title\":\"Энергетический барометр\",\"variant\":\"facts\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Находка бледного (пепельного) Карабиса в подвале, погребе или на поле – тревожный знак для грешников.\"}],\" Можно сказать, что они являются прямым индикатором того, что почва в этом месте стала истощённой в энергетическом плане.\"]}],[\"$\",\"p\",null,{\"children\":[\"Конечно, для тех, кто желает добывать минералы, новость может показаться премного радостной, однако важно помнить и о том, что \",[\"$\",\"strong\",null,{\"children\":\"низкая концентрация энергии для минералов означает и потерю их качества.\"}],\" Их можно (и порой даже нужно) применять как местный барометр, особенно когда дело касается контроля проклятой энергии в разведении требовательных культур: \",[\"$\",\"strong\",null,{\"children\":\"грешники-фермеры или геоманты специально ищут или ставят ловушки для Карабисов в подозрительных местах, где обнаружение бледной особи – сигнал к срочному удобрению земли проклятой энергией\"}],\" (поливом из моря кровавых слёз или же удобрением иными ресурсами) или к отказу от использования участка под посевы/строительство. Игнорирование грозит неурожаем или ослаблением защитных свойств земли.\"]}]]}],[\"$\",\"$L21\",null,{\"title\":\"Терракотовые кодексы\",\"variant\":\"facts\",\"children\":[[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Слепки Карабиса – источник информации.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цвет или же блеск:\"}],\" яркий, с синеватыми вкраплениями слепок – почва здорова и богата; тусклый, серый, без синевы – почва беднеет; следы неестественного цвета (зелень, багрянец) – загрязнение чужеродной магией/ядом.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Текстура:\"}],\" гладкий, цельный слепок – особь была здорова и сыта; трещины, неровности – особь испытывала стресс, голод или находилась в аг
