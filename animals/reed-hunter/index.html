"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/35pjeplx5hjs4.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"CreatureDropCard\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"slug\":\"reed-hunter\",\"articleContent\":[[\"$\",\"p\",null,{\"children\":\"Камышовый Охотник, достигающий примерно метр в холке, представляет собой существо, созданное для выживания в болотистых местностях или же степных зонах.\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"Его крепкое тело, покрытое плотными наростами перьев, напоминающими засохшую траву и камни, делает его практически невидимым среди окружающей растительности. \",[\"$\",\"strong\",null,{\"children\":\"Перья создают идеальную маскировку, скрывая животное от хищников и добычи\"}],\", обладая, к тому же, свойством отталкивать дождь, а в сухую погоду — сохранять влагу, что помогает ему выживать в разнообразных климатических условиях.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"images\":[{\"src\":\"/animals/kamyshovyi_ohotnik.webp\",\"alt\":\"Внешний вид камышового охотника\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В среднем, дикие особи весят до 10 килограмм и напоминают индейку с характерным тонким гребнем, чётко улавливающим изменения в окружающей среде. Домашние особи, при этом, могут быть вскормлены до 20 кг\"}],\" и активно употреблены в пищу как естественная курятина.\"]}],[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Клюв\"},{\"name\":\"Секрет\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Клюв Камышового Охотника выделяется среди остальных частей тела: он обладает острыми зубами, расположенными вдоль внутренней стороны, что позволяет надежно захватывать и удерживать добычу.\"}],\" Эти зубы не предназначены для пережёвывания — вместо этого они помогают разрывать плотную кожу и раковины. \",[\"$\",\"strong\",null,{\"children\":\"Клюв также покрыт твёрдым секретом, схожим с кератином, что делает его устойчивым к сильным ударам и трению о камни.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Передние крылья Камышового Охотника выглядят рудиментарными и почти не пригодны для полёта\"}],\" – они скорее служат для поддержания равновесия при беге и резких поворотах. При опасности он может немного подниматься над землей, используя крылья для совершения коротких прыжков, но в основном предпочитает перемещаться бегом.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Лапы длинные, с широко расставленными пальцами, что помогает в быстром передвижении\"}],\" – настолько, что камышовые охотники могут перемещаться без увязаний в болотах. \",[\"$\",\"strong\",null,{\"children\":\"Скелет птицы обладает также повышенной гибкостью, позволяя протискиваться через густые заросли\"}],\" – некоторые из них могут протиснуться, если их держать в неволе, потому расстояние между прутьями должно быть минимальное.\"]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L13\",null,{\"name\":\"Глаз\",\"align\":\"left\"}],\"$L14\",\"$L15\",\"$L16\"]]}],\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\",\"\\n\",\"$L20\"]}]\n"])</script><script>self.__next_f.push([1,"21:I[723063,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/35pjeplx5hjs4.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"AnimalAbilities\"]\n22:I[723063,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/35pjeplx5hjs4.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/e gq.js\"],\"CreatureDrops\"]\n14:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Зрение Камышового Охотника развито на исключительном уровне:\"}],\" его глаза, расположенные по бокам головы, обеспечивают широкий обзор, что позволяет замечать мельчайшие движения. \",[\"$\",\"strong\",null,{\"children\":\"Существо также способно различать оттенки зелёного и коричневого\"}],\", что помогает ему обнаруживать добычу среди густой растительности, а благодаря исключительной остроте зрения, от него не скроются даже мошки в нескольких десятках метров.\"]}]\n15:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Слух Камышового "])</script><script>self.__next_f.push([1,"Охотника также весьма чувствителен:\"}],\" его уши, скрытые под перьями, способны улавливать тончайшие звуки – шорох листвы, плеск воды и даже дыхание других существ.\"]}]\n16:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Благодаря гребню Камышовый Охотник может улавливать энергетические колебания и реагировать на них\"}],\", равно как и более точно определять направления и источники звука, а также ориентироваться по природным циклам.\"]}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Окрас\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L13\",null,{\"name\":\"Перо\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Перья окрашены в различные оттенки коричневого и зеленого. Если он выводится в степях, его окрас становится золотистым или светло-зелёным.\"}],\" Пятна и полосы на перьях имитируют текстуру и цвет листьев, сухой травы и мха, создавая иллюзию, будто это не живое существо, а часть ландшафта. На шее и спине можно заметить более светлые зеленые и серые акценты, которые помогают разбить контуры тела, делая его ещё менее заметным среди камней и растительности.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Камышовый Охотник имеет способность изменять интенсивность своего окраса в зависимости от времени суток и условий, в которых находится, делая из птиц настоящих хамелеонов:\"}],\" в тени его окраска становится темнее и более монотонной, а на свету — ярче и контрастнее; перья могут имитировать блики (как на воде или мокрых камнях) и незначительно менять видимую текстуру поверхности, становясь более гладкими или шероховатыми для наблюдателя в зависимости от фона.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Некоторые охотники отмечают, что Камышовый Охотник способен искажать прямые лучи заклинаний простого сканирования или магических взглядов, отчего он незаметен для базовых магических средств поиска.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда обитания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Камышовый Охотник часто замечается на западе у вод туманного болота.\"}],\" На восточных землях природно не водится – Камышовый Охотник уже был выведен усилиями грешников. \",[\"$\",\"strong\",null,{\"children\":\"Искусственно выведенные при сотрудничестве Вальгардов и жилой зоны, одомашненный вид менее хорош в маскировке, зато необычайно плодовит.\"}]]}]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни и питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дикий Камышовый Охотник ведет преимущественно одиночный образ жизни, предпочитая держаться в стороне от других существ, включая представителей своего вида.\"}],\" Отмечается, что у каждого Камышового Охотника существует собственный ритм или же внутренние часы, по которым они активны. Допустим, когда наступает для них «утренние часы» или же «закат», он выходит на охоту. Когда же наступает «день», то Камышовый Охотник ищет укромное место для отдыха, прячась в густой растительности. Когда же наступает предполагаемая «ночь», он и вовсе не появляется, оставаясь в логове.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если же говорить о домашнем Камышовом Охотнике, не имеющем каких-либо природных угроз со стороны и обеспеченном постоянным питанием, тогда существу становится скучно находиться в одиночестве, и он начинает погружаться в социальную составляющую вида:\"}],\" можно не успеть заметить, как их численность уже вырастет до 200-та особей в мгновение ока, если не контролировать популяцию.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Камышовый Охотник питается разнообразной пищей, включая существ, подобных червям, улиткам и моллюскам:\"}],\" его острый клюв и зубы позволяют ему легко добывать пищу из сложных источников, таких как раковины и плотная кожа. В зависимости от доступности пищи и сезона, его рацион может изменяться.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"У него есть неожиданное пристрастие и талант: Камышовые Охотники обожают определенные виды подземных грибов (аналоги трюфелей), растущих в их ареале, и обладают феноменальным нюхом для их обнаружения.\"}],\" Взрослая птица, почуяв гриб, начинает характерно топтаться и копать на месте, издавая особое квохтание. Она не съедает находку сразу, так как приучена получать награду от хозяина, если речь идёт о домашних Охотниках.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Развитие и размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Птенцы рождаются с зубами на клюве, которые помогают им разбить скорлупу, но затем выпадают в течение первой недели жизни.\"}],\" Молодые особи остаются под опекой родителей до тех пор, пока не научатся самостоятельно искать пищу и защищаться от хищников – \",[\"$\",\"strong\",null,{\"children\":\"период может длиться до полугода\"}],\", после чего молодые Камышовые Охотники начинают самостоятельно охотиться.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Размножение Камышового Охотника происходит в определённые сезоны, когда самцы привлекают самок при помощи сложных танцев и звуков.\"}],\" Во время танца самец энергично разгребает землю/ил когтистыми лапами, создавая сложные узоры и углубления. Его движения настолько отточены, что форма и глубина этих узоров, говорят, не случайны.\"]}],[\"$\",\"$L13\",null,{\"name\":\"Яйцо\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Гнёзда обычно строятся в защищённых местах, где яйца могут быть безопасно выведены\"}],\", однако грешники могут приманивать домашних охотников и обустраивать им места – тогда птица совсем обленится и не будет искать ничего, спокойно высиживая яйца. После выведения птенцов, оба родителя участвуют в их воспитании, обучая их навыкам охоты и выживания.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"В то же время, если грешники забирают яйцо, обленившиеся (и часто объевшиеся) Охотники не особо беспокоятся за судьбу их яиц. В одной кладке, как правило, до 12 яиц за 10 дней.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"1b:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Камышовый Охотник ведёт себя осторожно и скрытно, что помогает ему выживать в условиях с высокой угроз le\":\"Хронограф\",\"variant\":\"facts\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Камышового Охотника грешники воспринимают местным петухом и курицей, так как он активничает лишь в конкретные времена суток.\"}],\" Порой дикие особи способны издавать очень тихий, ритмичный звук – похожий на тиканье часов или постукивание камешков. \",[\"$\",\"strong\",null,{\"children\":\"Грешники в жилой зоне, где много одомашненных охотников, буквально сверяют по ним время.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"Когда тихий хор тиканий стихает – значит, можно считать, что наступил полдень. Нарастающий гул – сигнал к вечеру. \",[\"$\",\"strong\",null,{\"children\":\"Отсутствие звука в положенное время – тревожный знак (болезнь, стресс, опасность).\"}],\" Некоторые опытные следопыты учатся улавливать их ритм в дикой природе, чтобы ориентироваться во времени суток даже под густым пологом леса или в пещерах.\"]}]]}],[\"$\",\"$L23\",null,{\"title\":\"Алхимия и крафт\",\"variant\":\"facts\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Железу, которая выделяет жир, грешники вырезают перед приготовлением охотника: её используют, чтобы избавиться от запаха, либо добавить устойчивость к водной стихии.\"}],\" Умелый алхимик через жир может определить типичных для этой местности хищников или аномальные зоны – \",[\"$\",\"strong\",null,{\"children\":\"чем старше и опытнее была особь, тем ценнее ее жир для такого анализа.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Кости взрослых особей (особенно крыльевые) ценятся мастерами по созданию тихих, но мощных духовых инструментов или компонентов для артефактов детекции вибраций/невидимых существ.\"}]}]]}],[\"$\",\"$L23\",null,{\"title\":\"Предсказания\",\"variant\":\"facts\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Есть поверье, что узоры, рисуемые самцами в брачные сезоны, предсказывают погоду на ближайшие дни\"}],\" (глубокие спирали – к дождю, резкие линии – к ветру, концентрические круги – к ясной погоде). Также общее направление лучей может указывать на места с сильной или искажённой энергией поблизости.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Даже поведение их способно меняться в случае, если проклятой энергии становится больше\"}],\" – одичавшие и озлобленные, они могут нападать на грешников, вырастивших их. \",[\"$\",\"strong\",null,{\"children\":\"По анализам танцев нередко планируют последующие сельхозработы.\"}]]}]]}],[\"$\",\"$L23\",null,{\"title\":\"Использование\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Грешники могут использовать камышового охотника как «носовых кур» для поиска различных подземных и полезных грибов.\"}],\" Считается, что бульон из костей обладает общеукрепляющими свойствами и ускоряет регенерацию. \",[\"$\",\"strong\",null,{\"children\":\"Перья, собранные во время брачного периода, обладают более сильными маскировочными свойствами, чем собранные в другое время.\"}]]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"$L25\",null,{}]\n"])</script><script>self.__next_f.push([1,"26:I[96923,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/35pjeplx5hjs4.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\"],\"Providers\"]\n27:I[811522,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/st
