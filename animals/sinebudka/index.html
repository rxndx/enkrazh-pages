"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"name\":\"Брюшко\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":\"Внутреннее строение также отличается высокой степенью сегментации: помимо стандартных органов пищеварения, в нём присутствуют расширенные резервуары, где накапливаются переработанные растительные соединения, используемые как для метаболизма, так и для генерации эффекта очарования. Данные резервуары напрямую связаны с нервной системой, что объясняет невозможность произвольно контролировать свечение — оно является рефлекторным.\"}],[\"$\",\"$L12\",null,{\"name\":\"Лапки\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Три пары передних лап Синебудки длинные, тонкие и кажутся непропорциональными относительно тела\"}],\", однако это компенсируется их многосегментной структурой, оснащённой чувствительными волосками, воспринимающими вибрации и изменения натяжения паутины. Концевые части лап лишены выраженных коготков, что указывает на ориентацию не на удержание добычи, а на точное позиционирование. \",[\"$\",\"strong\",null,{\"children\":\"Хелицеры относительно малы и не рассчитаны на механическое повреждение плотных тканей. Ядовитые железы развиты умеренно и занимают значительную часть грудного сегмента, что ограничивает объём токсина и делает невозможным накопление смертельных доз.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Внутри вида выражен половой диморфизм:\"}],\" в состоянии покоя брюшко самцов имеет более тёмный, насыщенно-синий оттенок, тогда как у самок он ближе к светло-лазурному. Верхняя часть тела у обоих полов остаётся серой, что снижает заметность при взгляде сверху.\"]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"name\":\"Нервные узлы\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Полное отсутствие зрения Синебудки компенсируется развитой периферической чувствительностью.\"}],\" Нервные узлы, распределённые по грудному сегменту и основаниям лап, образуют своеобразное тактильное поле, позволяющее Синебудке воспринимать форму и расстояние до объектов на очень коротких дистанциях. Особую роль играют длинные, тонкие усиковидные отростки, позволяющие пауку различать направления источников вибраций и отличать живые объекты от неживых.\"]}],\"$L13\"]]}],\"\\n\",\"$L14\",\"\\n\",\"$L15\",\"\\n\",\"$L16\",\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\"]}]\n"])</script><script>self.__next_f.push([1,"1c:I[723063,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/0gkg3_pbo_heb.js\",\"/enkrazh-pages/_next/static/chunks/308b3b56paluj.js\",\"/enkrazh-pages/_next/static/chunks/412hvl12myu5u.js\",\"/enkr
