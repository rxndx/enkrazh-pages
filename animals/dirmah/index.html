 шипами. \",[\"$\",\"strong\",null,{\"children\":\"В общем длина зверя варьируется от 13,5 до 15 м, больше половины которой приходится на хвост.\"}],\" Лапы достаточно вытянутые для земноводного, но позволяют ему развивать неплохую скорость на суше.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"images\":[{\"src\":\"/animals/dirmah.webp\",\"alt\":\"Внешний вид дирмаха\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Слизь\"},{\"name\":\"Мускусный секрет\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожа покрыта слизью, предохраняющей от пересыхания.\"}],\" Она также способна выделять особый пахучий секрет, запах которого напоминает смесь тухлых водорослей и озона – данный мускусный шлейф служит маркером территории и позволяет особям одной группы узнавать друг друга на расстоянии.\"]}],[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Кожа\"},{\"name\":\"Костяные наросты\"}]}],[\"$\",\"p\",null,{\"children\":[\"Небольшая рыбовидная голова вызывает чувство то ли страха, то ли отвращения, напоминая голову глубоководного иглорта. Под тонкой и эластичной кожей на спине и боках проступают темные пятна внутренних органов – \",[\"$\",\"strong\",null,{\"children\":\"это вторичные жабры, способные поглощать проклятую энергию из воды и воздуха, но с низкой эффективностью.\"}],\" Основной обмен происходит через легкие и кожу на брюхе, которая пронизана капиллярами и всегда остается влажной. \",[\"$\",\"strong\",null,{\"children\":\"Кожа покрыта острыми костяными шипами, помогающими цепляться за ил и скользкие поверхности\"}],\", когда они отдыхают или прячутся.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"На челюстях красуются хаотичные по своей кривизне зубы, позволяющие крепко удерживать скользкую и проворную добычу.\"}],\" Причем, что удивительно, нижняя челюсть намного длиннее верхней, с чем это связано – пока неясно. Вдоль шеи расположен перепончатый плавник. Также макушку, шею и холку в три ряда покрывают зазубренные наросты, служащие своеобразной защитой.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Их длинные лапы способны к частичной регенерации: при потере пальцев или когтей они отрастают заново, хоть и медленно.\"}]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Органы чувств\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"blockquote\",null,{\"className\":\"not-prose relative flow-root my-8 rounded-xl border border-[#9c7b3f26] bg-[#1a1315]/60 backdrop-blur-sm shadow-[0_0_40px_-24px_rgba(0,0,0,0.9)] px-4 py-5 pl-10 sm:px-6 sm:py-6 sm:pl-14\",\"children\":[[\"$\",\"$L13\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1 "/enkrazh-pages/_next/static/chunks/308b3b56paluj.js\",\"/enkrazh-pages/_next/static/chunks/412hvl12myu5u.js\",\"/enkrazh-pages/_next/static/chunks/342ps15a9-yb-.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/0uyv5f18u98b2.js\",\"/enkrazh-pages/_next/static/chunks/18al-stariwx3.js\",\"/enkrazh-pages/_next/static/chunks/2pouc23-csmgq.js\"],\"CreatureDrops\"]\n14:[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"absolute left-4 sm:left-6 top-14 sm:top-15 bottom-6 w-px bg-gradient-to-b from-[#7c2d3a80] to-transparent\"}]\n15:[\"$\",\"div\",null,{\"className\":\"font-(family-name:--font-whisper) text-[#c9bdb4] text-[1.15rem] leading-[1.85] tracking-normal [\u0026\u003ep]:my-2\",\"children\":[[\"$\",\"p\",null,{\"childr"])</script><script>self.__next_f.push([1,"en\":\"Утром на вылазке обнаружили труп молодой особи Дирмаха. Бедняге досталось, похоже, соперник попался неудачный. 14-метровую тушу у нас не нашлось возможностей перенести, так что приняли решение взять только голову. Сейчас принимаюсь за осмотр, пока экземпляр свежий...\"}],[\"$\",\"p\",null,{\"children\":[\"...Изучая глазные яблоки, обнаружил любопытный факт. Всегда интересовало, почему у этих тварей так светятся глаза, даже при вполне хорошей освещенности. Кажется, я нашел ответ. \",[\"$\",\"strong\",null,{\"children\":\"За сетчаткой обнаружился тапетум – светоотражающий слой, совсем как у обычных кошек.\"}],\" Но большая разница в кристаллах гуанина, они крупнее и имеют иную форму. И сам тапетум… Это не цельное пятно, а несколько пятен. Возможно, из-за этого Дирмахи и видят ночью намного лучше кошек. \",[\"$\",\"strong\",null,{\"children\":\"По примерным расчетам, их зрение превосходит человеческое в чувствительности в 30, а то и 40 раз!\"}],\" Это удивительное число при их размерах и образе жизни.\"]}]]}]\n16:[\"$\",\"$L25\",null,{\"name\":\"Глаз\",\"align\":\"left\"}]\n17:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Помимо сейсмочувствительных отростков на подбородке, Дирмахи обладают уникальной способностью улавливать изменения энергетических полей с помощью специальных рецепторов, расположенных у основания черепа.\"}],\" Это своего рода «компас», помогающий им ориентироваться в мутной воде и во время аномальных бурь, а также чувствовать биоритмы потенциальной добычи. \",[\"$\",\"strong\",null,{\"children\":\"Тем не менее, Дирмахи глухи: у них отсутствует слуховой аппарат, в связи с чем они никак не реагируют на окружающие звуки.\"}],\" На их подбородке можно дополнительно заметить два странных щупальцевидных отростка – это также один из органов чувств этого земноводного. С их помощью он улавливает малейшие колебания в толще воды, что помогает ему с легкостью обнаружить скрывающихся где бы то ни было существ.\"]}]\n18:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Носовые отверстия являются чисто обонятельным органом и не связаны с дыхательным горлом:\"}],\" Дирмах может «запирать» их изнутри, чтобы вода не попадала в легкие при нырянии, полностью переходя на кожное дыхание.\"]}]\n19:[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Глаза Дирмахов могут менять цвет в зависимости от состояния: в покое они бледно-жёлтые, в охоте — кроваво-красные, а при испуге становятся почти белыми.\"}]}]\n1a:[\"$\",\"$L25\",null,{\"name\":\"Же"])</script><script>self.__next_f.push([1,"леза\",\"align\":\"left\"}]\n1b:[\"$\",\"p\",null,{\"children\":\"У них также обнаружены необычные железы на языке, которые позволяют улавливать вкус магических веществ в воде — возможно, это помогает им находить источники проклятой энергии, однако данное утверждение требует дополнительных доказательств.\"}]\n"])</script><script>self.__next_f.push([1,"1c:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда обитания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Встречается в секторах S1-S4, радиальных поясах P0-P3, глубинных слоях L1-L3.\"}],\" Важно обратить внимание, что в зонах S1-S3 обитают скорее семейные стаи, в то время как одиночки предпочитают зону S4. \",[\"$\",\"strong\",null,{\"children\":\"Избегают открытого моря (P4+).\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дирмахи отлично себя чувствуют не столько в заболоченных местах, сколько на берегах морей, озер и даже рек.\"}],\" Поднятия уровня воды сказываются на них очень благоприятно, расширяя охотничьи угодья, так что земноводные невероятно любят сезоны ливней и соответствующие аномалии: например, \",[\"$\",\"strong\",null,{\"children\":\"во время отлива Дирмахи часто зарываются в ил полностью, оставляя снаружи лишь верхушку спинных наростов, и часами неподвижно лежат в засаде.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дирмахи часто расширяют и углубляют прибрежные водоемы, выкапывая лапами и хвостом ямы и тоннели в илистом дне\"}],\" – отчего, кстати, иногда грешники спотыкаются по невнимательности или попадают в зыбучие ловушки. Данные подводные «берлоги» служат им укрытием, а после ухода хозяина становятся домом для мелкой водной фауны, формируя новые пищевые цепочки.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Некоторые группы Дирмахов обживают заброшенные руины поблизости или каменные гроты, украшая вход костями добычи\"}],\" — как будто метят своё логово.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1d:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни и питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дирмахи не привередливы и питаются любыми тварями, которых они могут проглотить целиком.\"}],\" Способны охотиться как под водой, так и на суше, однако от водоемов далеко не отходят из-за риска пересыхания.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дирмахи демонстрируют зачатки инструментального поведения:\"}],\" было замечено, что они используют мощные струи воды, выплеснутые изо рта резким сокращением жабр, чтобы сбивать с веток прибрежных деревьев птиц и их гнезда. \",[\"$\",\"strong\",null,{\"children\":\"Также они могут кооперироваться для охоты на крупную добычу:\"}],\" одна группа загоняет жертву на мелководье, а другая поджидает в засаде.\"]}],[\"$\",\"$L25\",null,{\"name\":\"Желудочные камни\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дирмахи способны проглатывать камни, чтобы утяжелять желудок и быстрее нырять\"}],\" — такие балласты потом выходят через ту же слизь. Иногда вырывают целые корни водных растений и употребляют их.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Живут группами в 5-7 особей.\"}],\" Между ее участниками, как правило, конфликтов нет, хотя у Дирмахов выделяется сложная, но жесткая иерархия, определяемая размерами, возрастом и количеством шрамов от прошлых битв. \",[\"$\",\"strong\",null,{\"children\":\"Доминирующую пару (альфа-самца и самку) можно узнать по наиболее ярким и крупным наростам на спине и более интенсивному цвету кожи.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"Часто между группами происходят случаи бойни за территорию или пищу, однако \",[\"$\",\"strong\",null,{\"children\":\"Дирмахи могут нападать и на более крупное существо, что зашло на их территорию. Одиночную цель постараются окружить и перекрыть выходы к отступлению, если же чужаки явились стаей – разбить на более мелкие группы, чтобы было проще убить.\"}],\" Преследовать жертву в случае ее побега вся группа будет до тех пор, пока та не пересечет границу их территории, при этом одна особь останется на какое-то время патрулировать этот район.\"]}],[\"$\",\"p\",null,{\"children\":[\"Коммуникация осуществляется посредством клокочущих и гремучих звуков. Не исключено наличие своеобразных слов-сигналов, так как звуки в одних и тех же ситуациях (нападениях, нахождении пищи) похожи. Однако \",[\"$\",\"strong\",null,{\"children\":\"основной «язык» – это язык тела: вибрации хвоста, позы угрозы с раздутым горловым мешком и ритуальные поединки\"}],\", где соперники стараются не убить, а лишь опрокинуть друг друга на спину.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"При встрече двух стаек, вместо немедленного боя, иногда устраивают устрашающие парады\"}],\" — выстраиваются напротив друг друга, громко хлещут хвостами по воде и надувают горловые мешки. Если одна сторона дрогнет — битвы не будет.\"]}],[\"$\",\"p\",null,{\"children\":\"Они также способны в кругу семьи на своеобразные игры: молодые особи нередко перекатывают плавучие бревна или гоняются друг за другом без охоты.\"}]]]}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Как и многие земноводные, эти твари размножаются при помощи икры. Икринки (размером, кстати, примерно с человеческую голову) надежно крепятся между задних лап самца\"}],\", в связи с чем мужская половина особей имеет более широкий таз, нежели женская. Самцу приходится не только таскать развивающийся молодняк с собой, но и периодически проверять уровень их увлажненности. В период размножения отцы семейств редко покидают водоемы, не желая рисковать потомством. \",[\"$\",\"strong\",null,{\"children\":\"Примечательно, что самки в это время занимаются охраной территории, в связи с чем в период размножения и выведения потомства у них образуются огненные наросты, упрощающие самозащиту на суше.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Самка откладывает икру не в случайном месте, а в специально вырытую самцом подводную нору, которую он затем охраняет. Икра обладает удивительным свойством: в ответ на приближение хищника она выделяет ту же едкую слизь, что и взрослые особи, становясь несъедобной.\"}],\" Вылупившиеся же детеныши лишаются какой-либо заботы и уходят в открытое плавание. Перед тем как отпустить потомство, самец «метит» молодняк своим секретом, и данный отпечаток служит юным Дирмахам маяком, дабы узнавать сородичей из своего выводка и избегать инбридинга.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В среднем, из 30 маленьких Дирмахов выживают только 3-4 наиболее сильных и везучих.\"}],\" Ученые Вальгарды заметили, что потомство, выращенное в стае, выживает чаще, чем у одиночек, что может намекать на зачатки коллективного воспитания.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"20:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Исключения и нюансы\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Изредка встречаются одиночные особи-«изгои»\"}],\" – либо очень старые и сильные Дирмахи, изгнанные более молодыми конкурентами, что объединились против него, либо, наоборот, слабые особи, не нашедшие своей стаи. \",[\"$\",\"strong\",null,{\"children\":\"Такие одиночки крайне опасны и непредсказуемы, часто нападая на все подряд из-за постоянного стресса и голода.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Некоторые Дирмахи, подвергавшиеся воздействию аномалий, приобретают новые свойства: например, способность поднимать вокруг себя сильный туман.\"}]}]]]}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Самозащита и нападение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В бою Дирмах использует свой хвост не только как колющее, но и как дробящее оружие: мощный удар может сломать кости крупному зверю или перевернуть небольшую лодку.\"}],\" Ядовитые шипы при этом ломаются, оставаясь в чужой ране, но в течение нескольких месяцев у особи вырастают новые. \",[\"$\",\"strong\",null,{\"children\":\"Так же способны хватать врага зубами и одновременно обматывать хвостом, буквально душа, словно анаконда.\"}]]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Механизм укуса работает по принципу гидравлики:\"}],\" прежде чем вонзить зубы, Дирмах резко раскрывает пасть, создавая область низкого давления, которая всасывает воду и добычу прямо внутрь. \",[\"$\",\"strong\",null,{\"children\":\"Этот «гидравлический захват» не оставляет жертве шансов вырваться, особенно в воде.\"}]]}]]]}]\n"])</script><script>self.__next_f.push([1,"22:[\"$\",\"$L26\",null,{\"children\":[\"$\",\"$L27\",null,{\"children\":[[\"$\",\"$L28\",null,{\"title\":\"Токсичная слюна\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Помимо ядовитых шипов Дирмахи обладают токсичной слюной, большая концентрация которой способна прожечь плоть, словно кислота.\"}],\" Монстры умело этим пользуются, плюясь веществом в противников с расстояния до 20 метров.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Регенеративная слизь\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Слизь Дирмаха обладает не только увлажняющими, но и регенеративными свойствами: неглубокие раны на их теле затягиваются с невероятной скоростью, особенно в водной среде.\"}],\" Эта же слизь является мощным антисептиком в случае, если им требуется очистить чешую.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Проводник энергии\",\"variant\":\"abilities\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Их слизь может становиться проводником энергии:\"}],\" были зафиксированы случаи, когда удары чистой энергией будто втягивались в тело Дирмаха и никак ему не вредили.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L29\",null,{\"children\":[\"$\",\"$L27\",null,{\"children\":[[\"$\",\"$L28\",null,{\"title\":\"Яд\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Высушенные и размолотые ядовитые шипы хвоста Дирмаха используются часто для создания отравленных клинков.\"}],\" Яд Дирмаха, даже в малых дозах, вызывает мучительный паралич и приводит к некрозу оболочки.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Почитание\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Некоторые грешники почитают Дирмахов как детей шторма и плодородия, веря, что их появление предвещает дожди.\"}],\" Они никогда не охотятся на них, а вместо этого приносят «жертвы» — выбрасывают на отмели туши крупных животных, чтобы отвлечь чудовищ от своих земель. Признаться, традиция настолько давняя, что этим промышляют даже жители жилой зоны.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Экосистема\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В местах обитания Дирмахов практически не водится другая, более мелкая ядовитая живность:\"}],\" считается, что их секрет подавляет развитие конкурентов, делая экосистему практически стерильной для иных хищников их размера.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Титаны\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Существуют редкие сообщения о титанических Дирмахах, достигающих 20 метров в длину.\"}],\" Эти патриархи, по слухам, десятилетиями живут в изоляции в глубинах крупных озер и обладают интеллектом, способным на сложные тактические засады.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Симбиоз с паразитами\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В складках кожи и за броневыми наростами Дирмахов часто селятся крупные, похожие на многоножек паразиты – Эскальи.\"}],\" Эти существа питаются отмершей кожей и остатками пищи хозяина, но взамен их острые лапки постоянно массируют кожу Дирмаха, не давая ей грубеть. Дирмах терпит их присутствие, так как этот «салон красоты» жизненно важен для здоровья его кожных покровов.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Кровавый прилив\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В сезон вылупления молодняка, когда тысячи юных Дирмахов устремляются в открытые воды, в регионе наступает время пира для других хищников:\"}],\" более крупные рыбы, птицы и даже некоторые рептилии специально мигрируют в эти места, чтобы поживиться легкой добычей. Это явление получило у жителей жилой зоны название «Кровавый прилив», так вода буквально кипит от борьбы и крови.\"]}]}],[\"$\",\"$L28\",null,{\"title\":\"Метка\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если убить самца, несущего на себе икру, то его секрет, выделяемый в момент смерти, не выветривается годами.\"}],\" Этот запах будет преследовать убийцу
