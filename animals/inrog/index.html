name\":\"Клык\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Челюсть узкая, Инроги отличаются рядом острых зубов, которыми могут терзать и разрывать обидчиков; имеют много передних клыков для прокалывания кожи.\"}],\" Одним из отличительных знаков Инрогов является \",[\"$\",\"strong\",null,{\"children\":\"длинный (40-70 см) спиралевидный рог.\"}],\" Самцы и самки различаются по наличию (у самцов) или отсутствию (у самок) козлиной бородки. Грива Инрогов длинная, очень мягкая и шелковистая.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Туловище крепкое и изящное, напоминает туловище оленя.\"}],\" Когда Инрог движется, кажется, что все мышцы его тела максимально напряжены, когда он стоит — наоборот, мускулы почти не выделяются и единороги приобретают особенно великолепный вид.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Ноги длинные (около 111-120 см), высокие и очень крепкие\"}],\" — Инроги не испытывают затруднений при передвижении в поле или в горной местности. Пальцы редуцированы до палочкообразных наростов, которые, как и у лошадей, завершаются копытами, однако \",[\"$\",\"strong\",null,{\"children\":\"у Инрогов эти копыта раздвоены.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Хвост Инрогов длинный (60 см), напоминает львиный, и завершается пушистой кисточкой.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Шерсть у Инрогов разной длины:\"}],\" в основном короткошерстны, однако с возрастом количество длинной шерсти увеличивается: к 100 годам грудь порастает более длинной шерстью, так же как и ноги у основания и у копыт.\"]}]]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u ":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Образ жизни\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Инроги живут табунами, насчитывающими несколько десятков особей.\"}],\" Их общество устойчиво и почти лишено открытых конфликтов: место в иерархии формируется в раннем возрасте и затем редко оспаривается. Им свойственно перемещаться в течение года по знакомым территориям: \",[\"$\",\"strong\",null,{\"children\":\"они предпочитают места с повышенным уровнем проклятой энергии.\"}]]}],[\"$\",\"p\",null,{\"children\":[\"В табуне выделяется несколько жеребцов (их подавляющее большинство среди единорогов), охраняющих табун, и самок. \",[\"$\",\"strong\",null,{\"children\":\"Альфа-самка руководит перемещениями табуна, водя его за собой к местам охоты и отдыха.\"}],\" Инрогам требуется много места и простора и нередко можно заметить, как они скачут по полям в ночной глуши.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Из-за символического статуса и низкой распространенности, единороги охраняются грешниками и содержатся на территориях Алого Двора\"}],\" — где охота на них запрещена и единорогам предоставлена полная свобода — и на территории Оранжереи.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Общение между Инрогами напоминает церемониальное\"}],\" — это сложная система из наклонов головы, поклонов, прыжков и череды голосовых сигналов. Единороги защищают друг друга и очень редко спорят, ранжируя общество по праву сильного в первые годы жизни (20-50 лет), после чего закрепляют за собой определенную роль и позицию внутри табуна.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Как правило, Инроги покидают родной табун, став половозрелыми особями (100 лет), но сохраняют теплые отношения с родителями на протяжении всей жизни.\"}],\" Когда один или несколько единорогов заболевают или ранены, табун стремится помочь и исцелить их. \",[\"$\",\"strong\",null,{\"children\":\"В последние десятилетия своей жизни Инроги постепенно теряют зрение и становятся практически слепыми\"}],\" — такие единороги ходят в центре табуна, ведомые самками и защищаемые самцами. \",[\"$\",\"strong\",null,{\"children\":\"Часто смерть на старости лет единороги принимают, бросаясь в Море Кровавых Слёз.\"}],\" Охота чаще всего проходит на границах Леса Крови.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Питание\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Вопреки представлениям, благородные единороги не являются травоядными. Их природа ближе к хищной: Инроги в первую очередь вампиры и излюбленным их лакомством является кровь других зверей и грешников.\"}]}],[\"$\",\"p\",null,{\"children\":[\"Озлобленные Инроги часто нападают на грешников, а прирученные могут игриво кусать «хозяина», чтобы слизать кровь из нанесенных ран. \",[\"$\",\"strong\",null,{\"children\":\"Если в местах обит 0-15 см; \",[\"$\",\"strong\",null,{\"children\":\"это время считается самым удачным для приручения.\"}]]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Неполовозрелая особь (до 100 лет)\"}],\" — единороги к этому периоду крепнут, вырастая до средних размеров молодняка (2 м для самцов и 1,7 для самок), в это время окончательно развивается рог, у самцов вырастает козлиная бородка, у обоих полов шерсть на груди начинает удлиняться и окрашиваться в более яркий цвет согласно масти Инрога. \",[\"$\",\"strong\",null,{\"children\":\"В этот период Инроги становятся половозрелыми.\"}]]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Взрослый единорог (110-350 лет)\"}],\" — к этому периоду взрослые единороги вырастают до максимальных значений (в холке достигают 2,5-2,7 м для самцов и 2,2-2,4 м для самок), у них вырастают все зубы и окончательно формируется удлиненная шерсть, \",[\"$\",\"strong\",null,{\"children\":\"в этот период достигают пика своей физической мощи.\"}],\" К 250-270 годам начинают терять зрение и чаще использовать рог — \",[\"$\",\"strong\",null,{\"children\":\"тогда он начинает светиться и становится наиболее ценным ресурсом.\"}]]}]]}],\"\\n\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"18:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Инроги являются живородящими существами, беременность самки длится около года, но в случаях опасности единороги способны «замораживать» плод до неустановленного предела\"}],\", чтобы продолжить вынашивать будущего жеребенка, когда опасность минует.\"]}],[\"$\",\"p\",null,{\"children\":[\"Хотя фертильность считается высокой у каждой особи и все единороги считаются способными к зачатию, \",[\"$\",\"strong\",null,{\"children\":\"Инроги крайне редко дают потомство.\"}],\" Влияет на это как то, что половозрелыми они становятся к 100 годам и некоторые особи не доживают до этого возраста, так и то, что \",[\"$\",\"strong\",null,{\"children\":\"самки способны выносить жеребенка единожды\"}],\", в связи с чем они стараются выбрать момент, когда окружающий их мир максимально стабилен и безопасен.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Инроги моногамны, часто выбирают себе пару в период активного взросления (в период между 70-100 годами), либо значительно позже (к 150-200 годам).\"}],\" Инроги горделивые создания и медленно создают пары.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Пара диких — или не прирученных — единорогов в 60% приносят потомство, тогда как прирученные единороги могут потомства и вовсе не принести (рождаемость жеребят в условиях приручения равняется 10%).\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Беременность Инрога считается хорошим знаком и самки в табуне во время беременности получают помощь от всех:\"}],\" им приносят добычу на поздних сроках и подгоняют во время перемещений. Бывали случаи, когда безнадежно раненых беременных самок табун не оставлял, а, наоборот, сплочался вокруг них.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Отношение самцов к жеребятам уважительное:\"}],\" несмотря на присущую им гордыню, единороги ценят детенышей своего вида и всегда встают на защиту молодняка. Отцы и вовсе непрестанно заботятся о жеребенке все 3 года его «младенчества».\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Поведение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Единороги, как гласили легенды, свирепые и ужасающие, горделивые существа, нападающие на каждого, кто им встретится.\"}],\" Во многом это правда: Инроги стараются избегать встречи с грешником. Если же это не удается, Инрог будет горделиво задрав морду всматриваться в того, кто на него наткнулся. \",[\"$\",\"strong\",null,{\"children\":\"Если не поклониться Инрогу, единорог нападет; иногда они нападают и при выказывании формальных жестов уважения\"}],\", что указывает на то, что каждый Инрог действует не из общего для всех принципа, а личного восприятия того, кто перед ним стоит.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Несмо
