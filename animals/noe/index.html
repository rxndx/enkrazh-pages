ine-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Особенности строения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Структурно тело Ноэ не имеет постоянных органов\"}],\", однако в нём можно выделить ряд повторяющихся зон, возникающих при достижении определённого уровня насыщения: поглощающую поверхность, выполняющую роль внешней оболочки и обеспечивающую диффузное впитывание энергии или ресурса; узлы уплотнения, формирующиеся в местах локального перенасыщения атрибутом и выполняющие функции опоры, движения или фиксации; временные контуры переработки, возникающие при наличии избыточного питания и исчезающие при его отсутствии.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Особенность Ноэ заключается в отсутствии завершённой формы:\"}],\" например, участок, ранее служивший для передвижения, при повышении концентрации энергии может трансформироваться в накопительный резервуар или даже в примитивный атакующий элемент.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Зависимость строения Ноэ от атрибута выражена значительно сильнее, чем у любых устойчивых видов, и определяет как поведение, так и последующую физику тела.\"}],\" В то же время, Ноэ тяжело назвать чистыми носителями атрибута и не стоит их использовать в очень высокоуровневой алхимии или же артефакторике: даже при доминировании атрибута их структура всегда содержит примесь фоновой проклятой энергии, и любое влияние посторонних атрибутов может тотчас же спровоцировать начало адаптации.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Скелет как таковой отсутствует, его функции выполняют зоны повышенной плотности, насыщенные атрибутом.\"}],\" Они способны кратковременно имитировать жёсткость (н
