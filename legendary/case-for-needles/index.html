тых. Достаточно тяжелые, запускаются с мощным импульсом немного меняя траекторию в полете. Удобны для выцеливания слабых мест. Для низшего пустого, если не убьет сразу, залп может прервать движение, подкинуть цель в воздух, или наоборот пригвоздить к земле, заставляя пропустить ход. Высшим пустым наносят урон точно и уверенно, на постоянной основе.\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Метательные копья (1шт).\"}],\" Артефакт вкладывает всю свою ярость и энергию полного залпа в создание заостренного куска ржавого металла, направляемого в цель с импульсом, сравнимым с запуском артиллерийского снаряда. Способны летать по баллистической траектории на дальность видимости персонажа. На разгон требуется некоторое расстояние, поэтому в ближнем бою бесполезны. Наносят ощутимый урон даже высшим пустым. Низших способны пронзать навылет, задевая товарищей позади. Если артефакт был напитан взрывчатым алхимическим составом, урон наносится по площади. Другие составы распыляются облаком вокруг в большом радиусе.\"]}]]}],\"\\n\"]}]]}],\"$L21\",\"$L22\"]}]}]\n"])</script><script>self.__next_f.push([1,"21:[\"$\",\"$L20\",null,{\"title\":\"Покаяние (+Спаситель)\",\"variant\":\"abilities\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Дает Айзеку возможность использовать прием класса “Покаяние”, впервые примененный в 1376 году католическим священником Себастьяном Антонио де ла Крусом.\"}],\" Описывалась атака так:\\n\\\"...Сотни пламенных крестов дождем осыпались на создания тьмы, терзая их плоть и разрывая на части. Вопли их, смешанные с запахом горящей плоти, достигли небес, и пролитая к
