,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Оружие способно левитировать, подчиняясь воле владельца.\"}],\" Управление осуществляется посредством сигналов — определённых движений. По мере длительного взаимодействия точность распознавания сигналов повышается. Визуальный контакт не обязателен: оружие воспринимает даже минимальные движения владельца (включая движения пальцев ног, бровей или глаз), улавливая их своим ядром.\"]}]\n17:[\"$\",\"p\",null,{\"children\":\"Скорость и отзывчивость оружия при левитации зависят от степени синхронизации с владельцем. Синхронизация возрастает по мере продолжительности и интенсивности (в том числе кровавости) боя и определяется гейм-мастером. Оружие обладает агрессивной природой и лучше подчиняется владельцу в условиях активного и жестокого сражения.\"}]\n18:[\"$\",\"p\",null,{\"children\":\"Базовая скорость левитац"])</script><script>self.__next_f.push([1,"ии составляет до 15–20 м/с и может увеличиваться до 25–30 м/с при высокой степени синхронизации. Дальность действия левитации и распознавания сигналов ограничена радиусом до 50 метров.\"}]\n19:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Оружие обладает собственной волей и агрессивной природой, перманентно стремясь к участию в сражениях.\"}],\" Оно тяготеет к боям любого масштаба — от дуэлей до крупномасштабных столкновений — и требует постоянной «жатвы», подпитываясь самим фактом конфликта.\"]}]\n1a:[\"$\",\"p\",null,{\"children\":\"Чем активнее владелец вовлекает оружие в сражения, тем выше становится степень их синхронизации. При этом лояльность оружия обусловлена не привязанностью к владельцу, а прагматичным выбором: оно подчиняется тому, с кем с наибольшей вероятностью сможет участвовать в большем количестве боёв.\"}]\n1b:[\"$\",\"p\",null,{\"children\":\"По мере длительного взаимодействия и регулярного участия в сражениях оружие становится всё более отзывчивым и надёжным. При высокой степени синхронизации оно способно защищать владельца даже ценой собственного существования.\"}]\n1c:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Оружие обладает аномально высокой массой, значительно превышающей таковую у аналогичных образцов.\"}],\" Несмотря на это, в руках владельца оно сохраняет управляемость за счёт синхронизации. Тем не менее, полноценно использовать его способны лишь существа с высокоразвитыми зелёными цепями, обладающие выдающейся физической силой и устойчивостью: для прочих его вес становится критическим ограничением, затрудняя или полностью исключая эффективное применение.\"]}]\n1d:[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[\"$\",\"strong\",null,{\"children\":\"Питается негативными эмоциями и культивирует их; как правило, привязывается к тем, чья вера в Тёмного Отца необычайно сильна.\"}]}]]}],\"\\n\"]}]\n1e:[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Может храниться в ЭПФО.\"}]}]\n"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L20\",null,{\"children\":[\"$\",\"$L21\",null,{\"children\":[[\"$\",\"$L22\",null,{\"title\":\"Тополиный пух (+Легендарный)\",\"variant\":\"abilities\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Оружие, находясь в левитации, способно формировать и направлять плотный поток мелкодисперсной субстанции, напоминающей пепел или пыль.\"}],\" Поток имеет выраженный вектор и распространяется в выбранном направлении конусом до 30° на дистанцию до 15 метров. При активации оружие фиксируется в пространстве в одной точке, однако сохраняет возможность свободного вращения вокруг своей оси на 360°, а также изменения угла вверх и вниз, перенаправляя поток в нужную сторону. Попадая под воздействие потока, частицы впиваются в тело противника, вызывая множественные микроповреждения: они режут глаза, забиваются в ноздри и уши, царапают кожу и создают ощущение, будто тело одновременно надрезают со всех сторон и колют иглами. Возникает сильная боль, дезориентация и рефлекторное нарушение концентрации, что существенно затрудняет прицеливание, поддержание заклинаний и любые точные действия. Эффект усиливается при длительном нахождении в зоне воздействия.\"]}],[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[\"$\",\"strong\",null,{\"children\":\"Затрачивает 12 единиц энергии за активацию и 8 единиц за пост поддержания, износ — 10%.\"}]}]]}],\"\\n\"]}]]}],[\"$\",\"$L22\",null,{\"title\":\"Веник (+Зверь)\",\"variant\":\"abilities\",\"children\":[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Оружие совершает высокоскоростное движение, формируя плотный кинетический импульс, представляющий собой сжатую волну рассечённого воздуха и давления, возникающую за счёт резкого ускорения и массы оружия в сочетании с его аномальной природой.\"}],\" В зависимости от траектории движения создаётся либо широкая ударная волна в форме дуги до 120°, либо направленный разрез, уходящий вперёд на дистанцию до 20 метров. Импульс поражает все цели в зоне действия, нанося урон и частично игнорируя преграды средней плотности. Отличительной особенностью способности является выраженный отталкивающий эффект: поражённые цели могут быть отброшены на значительное расстояние, величина которого з
