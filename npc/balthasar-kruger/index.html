ef\":\"/enkrazh-pages/apple-icon.png?apple-icon.2cjallmvglnn7.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L10\",\"5\",{}]]\n"])</script><script>self.__next_f.push([1,"11:I[240374,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/04rx8emuz_wl7.js\",\"/enkrazh-pages/_next/static/chunks/10cnvkinn5od7.js\",\"/enkrazh-pages/_next/static/chunks/0kzyu0d8kfvxw.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2uqro2ux1d-sf.js\",\"/enkrazh-pages/_next/static/chunks/2qdfvanog6a0l.js\"],\"NpcDetailView\"]\n12:I[812725,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/04rx8emuz_wl7.js\",\"/enkrazh-pages/_next/static/chunks/10cnvkinn5od7.js\",\"/enkrazh-pages/_next/static/chunks/0kzyu0d8kfvxw.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2uqro2ux1d-sf.js\",\"/enkrazh-pages/_next/static/chunks/2qdfvanog6a0l.js\"],\"NpcRelationsBlock\"]\n13:I[522016,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/04rx8emuz_wl7.js\",\"/enkrazh-pages/_next/static/chunks/10cnvkinn5od7.js\",\"/enkrazh-pages/_next/static/chunks/0kzyu0d8kfvxw.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/chunks/2uqro2ux1d-sf.js\",\"/enkrazh-pages/_next/static/chunks/2qdfvanog6a0l.js\"],\"\"]\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L11\",null,{\"slug\":\"balthasar-kruger\",\"articleContent\":[[\"$\",\"$L12\",null,{}],\"\\n\",[\"$\",\"section\",null,{\"id\":\"общие-сведения\",\"data-rule-section\":true,\"data-rule-section-title\":\"Общие сведения\",\"className\":\"not-prose my-10 flow-root clear-both scroll-mt-24  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Общие сведения\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":[\"Бальтазар «Тихий» Крюгер — один из старейших действующих представителей \",[\"$\",\"$L13\",null,{\"href\":\"/lore-newbie/organisations/neutral/realty\",\"children\":\"Реальтов\"}],\", заставший как минимум двух Легатов, и грешник, чьё влияние на организацию значительно превосходит то, которое можно предположить по занимаемой им должности.\"]}],\" Сам по себе Уроженец Саксонии, сын потомственного лесника, в жизни никогда не стремился к власти и не отличался особой воинской славой. Напротив, Крюгер привык к совершенно другой жизни — к тишине леса, размеренному труду и необходимости замечать то, что другие предпочитали не видеть.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В Энкраже эти качества неожиданно оказались куда полезнее, чем любая физическая сила\"}],\": после смерти в 1390 году Бальтазар быстро оказался замечен вербовщиками Реальтов и некоторое время провёл на арене, однако довольно скоро стало очевидно, что непосредственный бой интересует его значительно меньше, чем всё происходящее вокруг него. Крюгер одинаково хорошо разбирался в людях, ресурсах, организации и последствиях решений, а потому постепенно превратился из рядового участника в человека, которому другие начали доверять куда более сложные задачи.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Особенно важным в его судьбе стало знакомство с Яном Станиславским, предыдущим легатом Реальтов до 1869 года.\"}],\" Их характеры практически не имели ничего общего: Ян был громким, прямолинейным и импульсивным казаком, привыкшим действовать быстро и полагаться на собственную смекалку, тогда как Бальтазар предпочитал сначала выслушать человека, оценить ситуацию и лишь после этого открыть рот. Несмотря на это, они довольно быстро нашли общий язык: Ян видел в Крюгере качества, которых самому ему порой не хватало, а Бальтазар, в свою очередь, прекрасно понимал, что за внешней бесшабашностью Станиславского скрывается человек, действительно способный вести за собой других.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Когда в 1498 году Ян окончательно укрепился как Легат Реальтов, именно Бальтазар стал одним из тех, кому он доверил наиболее деликатные вопросы. В 1500 году Крюгер официально занял должность заместителя, однако фактически его полномочия довольно быстро вышли далеко за пределы обычной административной работы\"}],\": пока Ян занимался восстановлением военной силы и превращением Реальтов в могущественную организацию, Бальтазар занимался тем, что оставалось за пределами поля боя: финансами, дипломатией, снабжением, переговорами, договорами и многочисленными политическими последствиями решений легата. Ян мог сказать ему: «Бальтазар, разберись», — и после этого переставал задаваться вопросом, каким именно образом тот собирается разбираться. Станиславский доверял своему заместителю настолько, что порой считал излишним знать подробности его работы, а Бальтазар этим доверием пользовался — не столько ради личной власти, сколько ради возможности делать то, что считал необходимым для Реальтов.\"]}],\"$L14\"]]}],\"\\n\",\"$L15\",\"\\n\",\"$L16\"]}]\n"])</script><script>self.__next_f.push([1,"14:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Именно при Бальтазаре постепенно сформировалось то, что впоследствии стало основой аналитической и обеспечивающей структуры организации — канцелярии\"}],\": учёт ресурсов, распределение средств, документация, внутреннее планирование и сбор информации перестали быть второстепенной рутиной и превратились в полноценный механизм, позволявший Реальтам поддерживать своё влияние на протяжении веков, как и в целом увидеть организацию такой, какой она есть сейчас. Время и вовсе показало, что политика нового легата, Эрнеста Клайна, оказалась ему ближе: вместо бесконечной погони за величием Реальтов тот делал ставку на более сложную систему отношений с окружающим миром, где сила организации определялась не только количеством вооружённых бойцов.\"]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"section\",null,{\"id\":\"внешность\",\"data-rule-section\":true,\"data-rule-section-title\":\"Внешность\",\"className\":\"not-prose my-10 flow-root clear-both scroll-mt-24  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Внешность\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бальтазар — высокий, крепко сложенный мужчина с внешностью человека, которому возраст скорее придал веса, чем отнял его.\"}],\" Его лицо отличается выраженной мужественностью: широкие скулы, тяжёлая челюсть, глубокие складки у глаз и аккуратно подстриженная седая борода делают из него человека, привыкшего проводить большую часть жизни на открытом воздухе, а не в кабинетах и залах заседаний.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Особенно примечательны его руки — крупные, сильные, с длинными пальцами и следами старых мозолей.\"}],\" Они плохо соответствуют образу кабинетного политика и скорее напоминают о его прошлом лесника. Впрочем, никто не смеет сомневаться в том, кого выбрал сам Ян Станиславский в славные времена — в конце концов, будь он дубиной, оставил бы его рядом с собой и старый вояка, и молодой лев?\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Волосы практически полностью поседели, хотя в них всё ещё угадывается тёмный цвет прежних лет.\"}],\" Обычно они зачёсаны назад без особой тщательности, оставляя несколько выбившихся прядей. Взгляд Крюгера холодный и внимательный — не тяжёлый, но такой, от которого многим становится несколько неуютно. Он редко смотрит на собеседника долго и открыто, предпочитая короткие, почти броские взгляды.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"16:[\"$\",\"section\",null,{\"id\":\"характер-и-взгляды\",\"data-rule-section\":true,\"data-rule-section-title\":\"Характер и взгляды\",\"className\":\"not-prose my-10 flow-root clear-both scroll-mt-24  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Характер и взгляды\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бальтазар — человек удивительно тихий. Он не любит повышать голос, редко перебивает собеседника и способен выслушивать чужие рассуждения долго, терпеливо и стойко.\"}],\" И даже несмотря на то, что его взгляд редко задерживается на собеседнике, а скорее смотрит куда-то в сторону, не следует полагать, что Бальтазар не слушает — напротив, в такие моменты он весь во внимании. Впрочем, всё равно тяжело избавиться от ощущения, будто Бальтазар вообще не участвует в разговоре: сидит в стороне, спокойно смотрит на собеседника и изредка задаёт короткие вопросы. Но спустя несколько минут выясняется, что он уже успел заметить противоречия в рассказе, определить истинную цель разговора и понять, какую именно информацию человек пытается скрыть.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бальтазар прекрасно знает, что большинством людей гораздо проще управлять их собственными желаниями, а потому он редко заставляет человека делать то, чего тот не хочет — Крюгер предпочитает создать ситуацию, в которой человек сам придёт к нужному ему выводу.\"}],\" При этом Бальтазар вовсе не считает себя манипулятором: в его понимании он лишь учитывает интересы людей, но и себя не обижает. Если человеку можно предложить выгоду вместо угрозы, зачем угрожать? Если проблему можно решить договором, зачем использовать силу? А если договор не работает — зачем продолжать делать вид, будто работает?\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Крюгер вообще обладает пугающей способностью относиться к неприятным вещам без особых эмоций\"}],\": чужой гнев, угрозы, обвинения или даже ненависть редко выводят его из равновесия. Он может спокойно продолжать разговор с человеком, который минуту назад угрожал ему расправой, а затем вежливо поинтересоваться, закончил ли тот.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Крюгер также не испытывает к власти романтического интереса: его не привлекает титул или возможность открыто командовать другими, даже личное обогащение не купит его.\"}],\" Более того, он считает человека, который слишком сильно хочет власти, потенциально опасным.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Наиболее любопытной чертой Бальтазара является его терпение: он способен годами ждать подходящего момента, не предпринимая никаких заметных действий.\"}],\" Там, где другой политик потребовал бы немедленного результата, Крюгер может спокойно позволить ситуации развиваться, постепенно собирая долги, обязательства, договорённости и компромат. И это отношение как пугает, так и вызывает осуждение: там, где следовало бы предоставить ответы и принять тех, кому требуется помощь, Бальтазар может стоять неподвижным булыжником и не сдвинуться с места, пока не поймёт, что вмешательство действительно необходимо.\"]}],\"$L17\"]]}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Порой окружающим даже кажется, что Бальтазар ничего не делает. Пока другие спорят, требуют, угрожают, заключают союзы и пытаются добиться результата немедленно, он может неделями не предпринимать ничего очевидного.\"}],\" А затем выясняется, что нужный человек уже получил письмо, необходимые средства оказались в распоряжении нужной стороны, старый договор внезапно приобрёл новое толкование, а тот, кто ещё вчера отказывался идти на уступки, почему-то изменил своё решение. Крюгер редко оказывается в центре подобных событий — чаще он остаётся где-то за их пределами, словно бы и вовсе ни при чём.\"]}]\n"])</script><script>self.__next_f.push([1,"18:I[96923,[\"/enkrazh-pages/_next/static/chunks/3wqy9od1rtilb.js\",\"/enkrazh-pages/_next/static/chunks/28blb5grkwqbd.js\",\"/enkrazh-pages/_next/static/chunks/0h6t7w-664ybs.js\",\"/enkrazh-pages/_next/static/chunks/1ry3lit2ezq0z.js\",\"/enkrazh-pages/_next/static/chunks/04rx8emuz_wl7.js\",\"/enkrazh-pages/_next/static/chunks/10cnvkinn5od7.js\",\"/enkrazh-pages/_next/static/chunks/0kzyu0d8kfvxw.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkrazh-pages/_next/static/c
