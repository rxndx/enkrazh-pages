оме Амалы, ему никакая другая женщина больше не нужна, он подарил ей кольцо прямо в гостинице и сделал предложение.\"]}]\n24:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Тётушка Хема, узнав об этом, испугалась, что Амала сбежит от нее, что у девушки начнется семейная жизнь, и больше она не будет нуждаться в тете, которая так долго ее опекала и обеспечила ее всем.\"}],\" Запаниковав при мысли об этом, Хема оповестила обо всем родителей своей подопечной. Таким образом семья Амалы, а затем и все в округе узнали, что девушка собирается выходить замуж за чужестранца. По традициям такое было строго запрещено. После такого девушка уже не могла вернуться домой — ее связь с иностранцем порочила честь всей семьи, и видеть ее дома уже не желали.\"]}]\n25:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Теперь Амале оставалось только отказаться от брака и дальше продолжать дело Хемы, на что она и рассчитывала.\"}],\" Хема была уверена, что ее воспитанница никогда не решится преступить традиций, но ошиблась. Амала и Гурам поженились тайно, без церемоний, свидетелей и благословений родителей. Все клятвы друг другу они дали наедине.\"]}]\n26:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Узнав об этом, Хема осыпала свою племянницу проклятиями.\"}],\" Своими поступками Амала разгневала богов, говорила та, и кара непременно обрушится на нее. Такого девушка не могла стерпеть и сильно разозлилась на Хему. Тетка запретила Амале появляться здесь, пока она не перестанет порочить свою семью, и девушка осталась не только без дома, но и без своей гостиницы. Но супруга она все же не бросила. Вместе с ним и его братом они продолжили путешествовать. Втроем они побывали в Дели, где брат Гурама, Гурген, встретил свою будущую супругу, с которой они обвенчались тайно, как и до этого Гурам с Амалой. Путешественники собирались возвращаться на родину, в Армению, где могли бы жить всей семьей счастливо, но возникло препятствие. Обнаружилось, что Амала беременна.\"]}]\n27:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"У супругов в то время не было постоянного дома, часто им приходилось ночевать в приютах, а то и вовсе под открытым небом.\"}],\" Когда срок беременности Амалы уже подходил к концу, им едва удалось найти больницу"])</script><script>self.__next_f.push([1,", в которой девушку согласились принять. В конце концов у Амалы родился мальчик, но счастье супругов длилось недолго: не дожив и до четырех месяцев, ребенок умер от чахотки. Это был удар прежде всего для матери, которая успела привязаться к сыну. В то же время ребенок родился и у брата Гурама, но у него со здоровьем было все в порядке. Амала не могла не чувствовать зависти к ним, ведь их жизнь не была омрачена смертью сына, как у нее. К тому же ее начали одолевать сомнения: возможно, ее родственница была права? Может, еще не поздно исправить совершенные ошибки? Ей не было и двадцати четырех лет, и впереди у нее была вся жизнь.\"]}]\n28:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Наконец, скрепя сердце, они решили разойтись.\"}],\" Гурам собирался выбраться из бедности, улучшить свое положение и начать с Амалой все заново, дав ей обещание, что обязательно к ней вернется. На память он оставил девушке гребень, которым расчесывал ей волосы. Амала же вернулась к прежней жизни и уехала от супруга обратно в гостиницу, к тете Хеме. Хема была вовсе не злым человеком и по-своему любила Амалу, поэтому, узнав о ее злоключениях, с радостью приняла племянницу к себе. Со временем в памяти девушки постепенно забывались те несчастья, которые ее преследовали на протяжении долгих скитаний по Индии с супругом. Она вспоминала о Гураме все реже и реже.\"]}]\n4e:T864, По ее советам девушка познакомилась с мужчиной из хорошей семьи, и теперь, владея целой гостиницей, она готовилась к свадьбе. Прошлое постучалось к ней всего через несколько дней после того, как брак состоялся. В гостиницу приехал ее  месяцы шли, обмороки продолжали происходить, и провалы в памяти становились все глубже.\"]}]\n2b:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Амала не могла не переживать за здоровье Гурама, но из-за беременности ей было сложно навещать его, к тому же нужно было содержать гостиницу, владельцем которой она по-прежнему оставалась.\"}],\" Девушка часто находилась под присмотром мужа в спальне либо в детской комнате, которую супругам хотелось сделать как можно более роскошной и комфортной для будущего ребенка. Роды у Амалы наступили совсем не по плану, начавшись раньше срока. Супругу едва удалось найти врачей, которые вовремя смогли ей помочь. Наконец на свет появился мальчик, и девушка смогла вздохнуть с облегчением.\"]}]\n2c:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Когда состояние Амалы после родов пришло в норму, она решила зайти в комнату к Гураму, чувствуя вину из-за того, что так долго не виделась с ним.\"}],\" В комнате она увидела мужчину, которого она когда-то любила. Он смотрел в окно, пытаясь понять, где он находится, а затем обернулся к Амале с совершенным безразличием во взгляде. Даже в его речи, "])</script><script>self.__next_f.push([1,"в его настроении почти не осталось прежнего Гурама. Девушка сбежала, не выдержав потрясения от этой встречи.\"]}]\n2d:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"С той поры Амала еще пыталась вернуть Гураму память, но тому с трудом удавалось вспомнить хоть что-то о ней, чаще он путал ее с кем-то другим.\"}],\" Вскоре девушка бросила эти попытки, тем более что в ее жизни появились другие проблемы. У ее сына начались расстройства дыхания, а во сне его дыхание могло на время полностью остановиться. В такие моменты лицо ребенка бледнело, а сердце билось медленнее обычного. Амала не могла найти себе места, старалась не отходить от ребенка ни на шаг, разговаривала с ним, читала ему сказки. Работа в гостинице практически полностью легла на мужа. И все же случались ситуации, которые требовали внимания самой Амалы. Как-то раз, ненадолго отлучившись, Амала вернулась в детскую комнату и обнаружила, что ее сын не дышит. Напрасно пыталась она уловить стук маленького сердца, прижимаясь к груди ребенка. Малыш умер, когда ему едва исполнился год.\"]}]\n2e:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Потеря второго ребенка очень тяжело отразилась на Амале. Девушка отказывалась от еды, плакала часами, а когда не плакала, просто молчала, замыкаясь в себе, и лишь благодаря поддержке супруга постепенно начала отходить от случившегося.\"}],\" Слова Хемы о том, что своими поступками она навлекла на себя проклятие, врезались ей в память. Амале казалось, что вся ее жизнь идет под откос, а ей только исполнилось тридцать лет. Но она продолжала жить дальше ради любящего мужа и ради Гурама, которому тоже была нужна. Теперь уже стало ясно, что жизнь сломленного болезнью мужчины подходит к концу. Если раньше он мог вставать и передвигаться, теперь же он был не в силах даже подняться с постели. Амала дала распоряжение горничной ежедневно ухаживать за ним, время от времени приходила сама, кормила его и уделяла ему столько внимания, сколько могла. Ее сына не стало, но потребность о ком-то заботиться осталась, и эту потребность восполнял ей Гурам.\"]}]\n2f:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Девушка читала ему книги, которые до этого читала своему сыну.\"}],\" Книги рано или поздно заканчивались, и Амала покупала их снова и снова. В этих книгах она нашла легенду об озере нектара бессмертия, возле которого б"])</script><script>self.__next_f.push([1,"ыл построен город Амритсар. Согласно легенде, вода из этого озера обладала чудесными свойствами и исцеляла любые болезни. Состояние Гурама было таким тяжелым, что только чудо могло ему помочь. В это чудо и поверила Амала. Она решила отправиться по Великому колесному пути, на котором находится их гостиница, прямо к Амритсару, и попробовать исцелить Гурама водой из того самого озера. Долго она спорила об этом с мужем, который наотрез отказывался ехать так далеко, но потом понял, что просто так Амала не успокоится, и согласился. Они собрали все накопленные деньги, снарядились в путешествие и закрыли гостиницу.\"]}]\n30:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Несколько месяцев они ехали в фургоне, запряженном мулами, пока не прибыли в Амритсар.\"}],\" Супруги остановились в Золотом Храме, находящемся в центре озера, где их встретили сикхи, для которых Амритсар был столицей. Войти в храм мог любой желающий, но прикасаться к воде разрешено было только тем, кто исповедует сикхизм. Повернуть назад Амала не могла. Рассказав о цели своего визита, девушка попросила сикхов обратить всех троих, включая себя, в свою веру. Те увидели серьезность ее намерений, и община сикхов, обычно редко принимающая новообращенных, приняла Амалу и ее спутников под свое крыло.\"]}]\n31:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Они успели вовремя, пока Гурам еще был жив. Не теряя времени, Амала омыла его тело водой из озера.\"}],\" Прошел час, несколько часов, сутки, но состояние у чужестранца осталось таким же. Через два дня Гурам, метаясь в бреду и дрожа всем телом, вдруг широко открыл глаза и увидел перед собой свою возлюбленную, которая сидела подле него. Уставившись на Амалу, он ясно и четко произнес ее имя перед тем, как его сознание окончательно померкло. Душа Гурама покинула этот мир. Вместе с ним оборвалась и жизнь Амалы — ее связь с семьей, традициями, гостиницей были утеряны. Началась ее вторая жизнь, которую женщина провела в общине сикхов.\"]}]\n32:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"На новом месте Амала продолжала жить со своим мужем, который все так же во всем ее поддерживал.\"}],\" Теперь семьей они могли называть не только друг друга, но и всю общину сикхов. По правилам общины Амала взяла себе фамилию Каур, а ее супруг взял фамилию Сингх. Единоверцы помогли Амале обустроиться в хра"])</script><script>self.__next_f.push([1,"ме, относились к ней как к равной, и подобного отношения к женщинам в традиционном индийском обществе она никогда еще не встречала. Не существовало у сикхов и каст, которые были, казалось, неотъемлемой частью Индии. Но у этого идеального мира была и другая сторона. Радикальная партия сикхов, стремившаяся к полной независимости от Индии, перешла к террористическим действиям, начав войну с индийским правительством. Сепаратисты обосновались и в Золотом храме, превратив ее в свою крепость. И Амала решила присоединиться к ним, чтобы с оружием в руках защищать священное место.\"]}]\n33:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Женщина вступила в военное братство хальса, став отныне посвященной. Вместе с посвящением ее обязали соблюдать кодекс поведения сикхов: не стричь волосы, укладывая их деревянным гребнем, носить короткие штаны, присущие солдатам, а кроме того, обычный стальной браслет на правом запястье.\"}],\" Браслет символизировал сдержанность характера, а ношение брюк — постоянную готовность к действиям. Этим правилам Амала следовала с момента посвящения и до самой смерти. Амале также полагался и кинжал сикхов — кирпан, который выдал ей при посвящении офицер индийской армии, примкнувший к сепаратистам, по имени Лалла Сингх Мохан. У него она проходила военную подготовку четыре года и за это время научилась обращаться с оружием.\"]}]\n34:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В июне 1984 года началась операция против сикхов, которая получила название “Голубая звезда”. Целью операции, организованной правительством Индии, был штурм Золотого храма в Амритсаре.\"}],\" В храме, где засели сепаратисты, находились и мирные паломники, но у премьер-министра Индиры Ганди не было другого выбора — необходимо было покончить с террористами. 1 июня к Амритсару начали подходить войска правительства, 3 июня был введен комендантский час по всему штату, 5 июня начался штурм. Сикхи оказывали яростное сопротивление штурмующим. Амала Каур тоже вышла на защиту храма с автоматом в руках и даже открыла огонь вместе с остальными, но так и не успела ни в кого попасть. На штурм правительство отправило танки, которые стреляли по сепаратистам из пулеметов, и пулеметной очередью смертельно ранило Амалу.\"]}]\n35:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Найдя выход из башни, Амал"])</script><script>self.__next_f.push([1,"а вышла в новый мир лишь со смутными воспоминаниями о том, как ей приходилось много раз оплакивать чью-то смерть.\"}],\" Чтобы помнить об этой смерти, первое время она ходила в белом сари, которое на ее родине носят вдовы. Затем воспоминания постепенно стали возвращаться к ней, и цилинь стала носить одежду других цветов. Ей хотелось чувствовать себя женщиной, одеваться нарядно, совсем не так, как диктовали правила военного братства. О тех годах жизни Амала еще не вспомнила, однако у нее в памяти сохранилась ее последняя фамилия — Каур, и женщина продолжила ее носить. Полученную от супруга фамилию она так и не раскрыла ни одной живой душе.\"]}]\n36:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"После гибели в бою Амале больше не хотелось участвовать ни в каких войнах. Ей хотелось воспитывать детей, к этому стремилась ее душа.\"}],\" С первых лет жизни в Энкраже цилинь стала присматривать за маленькими грешниками, по большей части незаметно. Она стремилась сделать Энкраж таким местом, в котором маленькие грешники смогут жить в покое и радости, где все их мечты и желания исполнятся. За время жизни здесь цилинь познакомилась с большим количеством маленьких грешников, привязавшись к ним, и теперь ждет подходящего момента, когда судьба одного из них пересечется с ее собственной, образуя контракт между маленьким грешником и взявшим над ним опеку цилинем.\"]}]\n37:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В новом мире Амале было необходимо узнать, как “правильно” жить, чтобы, подобно индийским гуру, постигшим истину, наставлять других, а также для того, чтобы не давать себя сбить с пути “неправильными” понятиями, омрачающими души и разум грешников.\"}],\" Поиски знаний привели ее к библиотеке, где Амала надолго потерялась в книжном лабиринте, блуждая по его бесчисленным ходам и останавливаясь только для того, чтобы от одной книги перейти к следующей. Со временем она обнаружила книги об устройстве грешников, и в то же время ее стал интересовать другой обитатель Энкража — библиотекарь. Цилинь наблюдала за его работой, пробовала с ним заговорить, общаться письменно или жестами, искала любые способы добиться цели. Процесс переговоров занял у нее около пятнадцати лет, но результат, пусть и заставил себя долго ждать, все же стоил своих усилий.\"]}]\n38:[\"$\",\"p\",null,{\"children\":[[\"$\",\""])</script><script>self.__next_f.push([1,"strong\",null,{\"children\":\"Никто так и не понял, как ей удалось договориться с молчуном-библиотекарем, какие средства убеждения она использовала, как вошла к нему в доверие.\"}],\" Цилинь, казалось, совершила невозможное — она заключила с хозяином библиотеки контракт, согласно которому грешница будет следить за порядком на всей территории библиотеки и помогать грешникам отыскивать для них нужные книги. Таким образом у библиотекаря появилась помощница, и с этого момента в библиотеку стало наведываться больше грешников, чем раньше — общаться с вежливой, отзывчивой Амалой им было куда проще. Для самой же Амалы библиотека стала ее личным местом силы — здесь она практически не чувствовала усталости, а потому могла работать в библиотеке неделями без перерыва. Цилиню даже удалось со временем освоить телекинез, и так как она уже долгое время выполняла фактически роль стража библиотеки при настоящем ее хозяине, то и способность к телекинезу, которой владел оный, также стала для нее основной.\"]}]\n39:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Когда Амала начала искать себе союзников, она уже была известна как цилинь, покровительствующий владениям библиотекаря в замке.\"}],\" Одновременно могло существовать только четыре цилиня, каждый из которых занимал одну из сторон света.\"]}]\n3a:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"До перерождения Амалы цилинем Юга была мавританка Фатимету Ульд Леффад, вышедшая из Башни в середине 16 века.\"}],\" Цилинем ее сделали те грехи, которые она совершала, когда была наложницей-рабыней испанского конкистадора. После завоевания испанцами Перу Фатимету, получившая при крещении имя Альма де Меланья, поселилась в Лиме, которая позже стала главным торговым центром всей Южной Америки из-за своего географического положения, и смогла заработать на торговле целое состояние. Даже когда богатств стало хватать до конца ее жизни и жизни детей, Альма не могла остановиться, желая большего, и ее стремления окончились лишь с нападением пиратов, которые атаковали город в то время, как она готовилась к отплытию в Испанию.\"]}]\n3b:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Став цилинем и получив во владение храм на юге, Альма переделала его так, как того требовали ее амбиции.\"}],\" Она не стала полностью сносить старый храм, но воздвигла большую ступенчатую пирами"])</script><script>self.__next_f.push([1,"ду наподобие мезоамериканских, на вершине которого стал находиться сам храм в том же состоянии, в котором Альма его впервые нашла. Цилинь Юга поселилась в этом храме и жила там до самого искупления грехов. Можно было предположить, что к женщинам она благоволила больше, чем к мужчинам, поскольку перед своим окончательным уходом из Энкража Альма окружила храм непроходимыми зарослями растений, управлять которыми обычно могли лишь самки цилиней. Амале понадобилось около десяти лет, чтобы овладеть магией растений на достаточно сильном уровне и все же попасть в храм.\"]}]\n3c:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"При этом она не забывала и о библиотеке, позволяя себе лишь иногда отлучаться из своих владений.\"}],\" Но это не помешало ей легко заручиться поддержкой лунов, пусть и не сразу из-за того, что переродилась Амала относительно недавно, поскольку цилини и луны были давними союзниками, и испокон веков императорская семья драконов обращалась за помощью цилиней в самые темные времена. Цилини входили в иерархию лунов на равных правах со всеми семьями драконов, и наряду с министерствами лунов у них было свое Министерство Идеалов. Задачей этого министерства с давних времен было сохранение единства и баланса в мире. Эту задачу и взяла на себя Амала.\"]}]\n3d:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Храм был снова открыт, но теперь под управлением Амалы, и вместе с храмом к ней перешел титул Министра Юга официально в 2009 году.\"}],\" Нового министра признали остальные цилини, а также поддержавшие женщину луны. В храме Амала нашла печать, созданную, по легендам лунов, еще Темным Отцом и Темной Матерью из минерала, напоминающего по цвету янтарь.\"]}]\n3e:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Теперь эта печать принадлежала ей и символизировала, что Амала вступила в свои права.\"}],\" На практике это означало, что драконы, обитавшие в храмах на юге, могли обратиться к ней за помощью в случае, если угроза храму окажется слишком серьезной. В свою очередь, и Амала могла обратиться за помощью к лунам. Обе стороны могут и отказать в помощи друг другу, что не повлечет расторжения союза, однако обязательно скажется на отношениях внутри сообщества. Храм цилиней на юге на сегодняшний день остается заброшенным, а его владелица, Амала, продолжает работать в библиотеке.\"]}]\n3f:[\"$\",\""])</script><script>self.__next_f.push([1,"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Последующие пять лет цилинь развивала свои способности к телекинезу и к магии
