рнулся уже через три года с заявлением, что получил дхарму от великого учителя Цзинь Сюаня и больше ему в Китае делать нечего. Вероятно, знание санскрита помогло изучить тантрическое учение быстрее, вероятно, страсть Эндо играла на руку, или сами небеса определили его как избранного. А еще более вероятно то, что Цзинь очень хотел перед смертью, чтоб его понимание дзен нашло развитие в какой-нибудь другой стране, и восприимчивый японец стал для него настоящей находкой. Был ли на самом деле учитель хранителем тайных знаний, или подкупил толпу верующих своей харизмой гуру, так и останется загадкой. Но, что абсолютно точно, именно гуру вложил в голову Тогаши простое и естественное отношение к религиозному служению, делая акцент на внутренних изменениях, а не внешних ограничениях. При передаче Линии он сказал то же самое, что якобы сказала мать во сне: задача Тогаши – спасать людей от страданий.\"]}]\n20:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"(1449) До основания секты в Японии было еще далеко. Смена обстановки помогла Тогаши начать действовать более решительно, но все еще в рамках его же школы.\"}],\" Прошло несколько лет, прежде чем Рёсен смог снискать славу просвещенного монаха, знатока обрядов и абсолютного чемпиона в религиозных диспутах. Столько же - чтобы найти последователей, готовых тайно принять дзен. В то же время монастырь на Хией постоянно участвовал в военно-политических конфликтах, например со школой Сингон или мелкими феодалами, где Эндо мог проявить себя как бывший придворный. Рёсен был искусен в чтении человеческой психики и всех ее нюансов куда больше, чем во владении оружием, чаще оставался вдали от сражений, где его таланты воплощались в дипломатических миссиях и разработке стратегий. Он использовал любые средства ради предотвращения ненужного кровопролития, и порой так выходило, что даже за бездействие враги врагов платили храму шелками и рисом, необходимым для продолжения действий.\"]}]\n21:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"(1451-1456) При синтоистских святилищах обычно строили буддийский храм, потому что, как считалось, боги-духи-ками – это воплощение бодхисаттв.\"}],\" Семейный храм Эн"])</script><script>self.__next_f.push([1,"до назывался Омори Тайся Дзингудзи и являлся как раз таким синкретическим комплексом. Со смертью старого настоятеля-шасо, обязанность легла на плечи Тогаши. Ещё много лет назад монах начал собственные изыскания на основе полученной дхармы, из-за чего вступал в идеологическую конфронтацию с учителями Хиэй. В 1450, Рёсен “утверждающий истину” пришел к мысли, что тэндай искажает учение Будды. И именно тогда он принял судьбоносное решение отдалиться и от горы Хиэй, и от канона ради собственного пути. Чтобы сангха признала новую секту независимой достаточно четырех бунтовщиков. Собрав намного больше таковых, Рёсен переехал в старый храм Омори.\"]}]\n22:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Тем временем обстановка в Империи продолжала накаляться. Дайме низвергались, целые провинции переходили в руки крестьянских общин и религиозных движений.\"}],\" Тогаши подошёл к продвижению Омори со всей ответственностью. Он распространял влияние среди мирян, чуждых сложным ритуалам и жестким практикам традиционных сект. Хотя он не приветствовал насилие, все его близкое окружение состояло либо из фанатиков, либо из самураев и дзи-самураев, интересы которых приходилось учитывать. Он собирал налоги с торговцев и имел монополию на производство саке в регионе, что позволяло содержать организацию. К тому же, был заключен союз с даймё Северной Провинции, а это накладывало некоторые обязательства. Тогаши приходилось ходить по тонкому льду и искать компромиссы между своим авторитетом и необходимостью поддерживать многочисленных союзников в их не слишком-то благородных порывах. Порывы самого Тогаши тоже редко вязались с образом монаха: свод правил Виная, и так не особо соблюдаемый в Японии, для Тогаши будто не существовал. Намеренная “приземленность” сближала его с народом и отдаляла от остальных, более ортодохсальных сект, включая тэндай.\"]}]\n50:Tb53,"])</script><script>self.__next_f.push([1," Затем ее муж-самурай погиб в подавлении крестьянского бунта, и вскоре она с ребенком стояла перед выбором из двух: уйти в монастырь или обратно в семью. Тогаши уговорил ее найти приют в Омори Тайся, он пообещал, что тут она будет в безопасности и всегда может рассчитывать на любую помощь. Их связь начала налаживаться через символические жесты. Касуми действительно заинтересовалась религией, она старалась быть ближе во время совместных медитации, обсуждала сутры наедине и вдохновляла примером человека, который не сломался после удара судьбы. Сектант организовал покровительство над несчастной вдовой с ребенком, и так к ней привязался, что сам стал эмоционально зависим от нее. Забавно, ведь избавление от привязанностей всегда являлось одним из важнейшим этапом для достижения нирваны, и не исключено, что Рёсен осознавал, что в этой жизни вместо просветления он выбрал быть счастливым. При этом он ни разу не тронул объект своего обожания, ему было достаточно иметь под рукой человека, которому можно полностью доверять и который бы принимал его жертвенную помощь взамен безусловной любви. Касуми его бы никогда не предала. Она стала главной синто-священницей Омори-Тайся, когда ее дочь подросла. Ее советы по управлению комплексом не раз спасали его от кризиса, она будто умела предсказывать события, а во время крестовых походов на враждебные храмы, именно она, а не ответственный ученик, вела хозяйство. Со временем напарник начал глубоко уважать Касуми и уже не мог представить свою миссию без нее. В знак своей верности он подарил ей тибетский амулет, привезенный из Китая."])</script><script>self.__next_f.push([1,"23:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"(1456) В 33 года Тогаши познакомился с мико Касуми. Недолго она служила синтоистской “монахиней”, как вышла замуж по расчету и еще через два года у нее родилась дочь Киоши.\"}],\"$50\"]}]\n51:T9ee,"])</script><script>self.__next_f.push([1," Он так же, как и старший, обучался в Киото и в монастыре на Хиэй, так же поехал в Китай и собирался дальше тенью ходить за Тогаши, но отец сдержал слово и сделал наследником младшего сына. Проблемы начались тогда, когда советник Тогаши по имени Цуро захотел устроить заговор против своего брата Согоро, под контролем которого находилась часть провинции. Естественно, руками воинов из Омори. Чтобы исполнить задуманное, Тогаши щедрыми подкупами и обещаниями привлек на свою сторону Юджи, однако Согоро прознал о заговоре и первым нанес удар по замку Эндо. Фанатики и бывшие самураи были готовы и не только смогли отразить удар, но еще и захватить вражеский замок. Согоро был повержен, а Тогаши пришел к власти, но не спешил выполнять обещания, данные Юджи. Пару раз самураи на службе замка Эндо пытались получить обещанное и пару раз уходили ни с чем. Предательство дало Юджи возможность взглянуть на Тогаши как на равного соперника. Неидеального, а в какой-то мере даже испорченного властью и накопленными богатствами, коварного и воинственного теократа, который скрывается за маской праведности. Времена, когда Юджи упрашивал передать ему секретные мантры, давно прошли. Он понял, что его пример для подражания упал в бездну, откуда ему не суждено увидеть просветления. Долгое время до прямого противостояния не доходило, но думать, что унижение Юджи останется без последствий, было бы наивно."])</script><script>self.__next_f.push([1,"24:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Младший брат Юджи пытался догнать старшего всю свою жизнь.\"}],\"$51\"]}]\n25:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"(1463) Когда Император сообщил о намерении перенести священное зеркало из Восточного храма на хранение в Западный храм, Рёсен при поддержке своей агентуры и Касуми подстроил в последнем пожар, распространил слухи о сгоревшем синтае и, воспользовавшись хаосом в стане врагов, убедил императора выбрать пристанищем для новой реликвии Омори-Тайся.\"}],\" Чтобы зеркало попало именно в Омори, сектант фальсифицировал знамения. Фиолетовые облака над Омори, соленые ручьи, радуга в яшмовом зале. Император, став свидетелем чудес, благословил обновленное святилище и отдал зеркало. Вскоре жрецы Западного храма разоблачили трюки Эндо, но благословение императора невозможно отменить, иначе это бы означало уличить живого бога во лжи. Так Рёсен нажил еще одного врага в погоне за сокровищами.\"]}]\n26:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"(1467-77) Удача перешла на сторону обиженных в разгар войны Оннин, когда Тогаши отправился сводить счеты с вассалом.\"}],\" Замок Эндо немедленно воспользовался случаем, собрал всех противников даймё и лично Тогаши в едином заговоре и напал на слабо защищенный замок Согоро. Тогаши успешно вернулся с похода, однако армия союзников Юджи уже сожгла крепость. Касуми и Киоши ритуально самоубились, чтобы не попасть в руки врагов. Клятва защищать своих самых близких людей была нарушена. Они ведь могли бы выжить. Если бы не потакание союзникам, собственное честолюбие, если бы не уверенность в неприступности крепости, если бы не внезапность нападения… Они просто напросто не успели покинуть крепость до того, как их окружили, до того, как прибыло подкрепление, и были вынуждены принять бой. Они с Киоши сдерживали меньшими силами большую осаду, а теперь всё было кончено. Замок Согоро дымился на горизонте погасшими углями.\"]}]\n27:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Свое состояние Тогаши описал как “Дикий чертополох, поникший в зимнем холоде под тяжестью снегов”. Он молчал, когда тела Киоши и Касуми горели.\"}],\" Молчал, когда их вещи отправили семье. Молчал, когда впервые увидел их могилы. Наконец, его мысли о горе обратились мыслями о благочестии, и он воздвиг статую Будды Вайрочаны в главном зале хр"])</script><script>self.__next_f.push([1,"ама. Ранение в последней битве давало о себе знать до сих пор, и надежды на исцеление почти не было - перед собою не солжёшь, но сдаться - опустить руки, плыть по течению, и остаться сам на сам с пожирающей тело желчью и мыслями о безысходности было бы худшим предательством Касуми и Киоши из всех возможных.\"]}]\n28:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Юджи удалось переиграть и уничтожить Рёсена, или, по крайней мере, так он думал.\"}],\" Многолетняя вражда подошла к концу, младший брат управлял наследными землями, а старший, кажется, полностью посвятил себя наставлению юных монахов. Он основал несколько меньших храмов, якобы работал над трудом всей своей жизни и готовился передать Линию лучшему ученику. На самом деле, он очень тихо и незаметно строил план мести. Он старался не привлекать к себе внимания, а все, что он по сути делал – подсылал шпионов в замок Эндо. Спустя пару лет на Юджи устроили засаду разбойники, когда тот шел через лес. Что ж, с кем не бывает. На войне Оннин сражались все со всеми, пользуясь хаосом в столице. Месть Юджи свершилась быстро, без столкновения армий, осады крепостей и лишнего кровопролития. Достаточно было выяснить когда, куда и с кем он направляется, чтобы избавиться от него раз и навсегда. Управление захваченными землями взял на себя сын Хитоши Эндо, бежавший из разрушенного Киото. При этом основные рычаги власти оставались у Рёсена.\"]}]\n52:T918, Он бы справился и без настоятеля. Когда выносить груз ответственности стало тяжело, Рёсен организовал собственные символические похороны, после чего отправился в путь по горам к такому же символическому перерождению. Ежегодно надлежало посетить 33 места паломничества, столько же ликов у Каннон, богини милосердия. При этом дэвом-защитником будды и покровителем сюгендо являлся Фудо, и тут уж ни о каком милосердии говорить не приходится. Ямабуси (как еще называли сюгендзя) были далеки от кротких и пассивных, отстраненных от всего происходящего монахов Дао или брезгливых синтоистских каннуси. Они, вооруженные кто железным посохом, а кто нагинатой или мечом, защищали закон Будды всюду, куда ступала их нога. Их шляпы символизируют каску самурая, кимоно - доспехи самурая, а посох выкован из железа. Мечом Фудо они могут уничтожать видимых врагов, а невидимых изгоня"])</script><script>self.__next_f.push([1,"ют с помощью девяти слогов куджи-ин. Вот кем в итоге стал Рёсен. Последние годы жизни – а их еще предстояло много – он ходил из села в село с рассказами о старых добрых временах, проповедовал, лечил больных и изгонял злых духов. Провожал путников через горы, а политических беженцев - через границы провинций. Через месяц после 88 дня рождения он отправился вглубь леса самоубийц и больше его никто не видел.29:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Так, Сэнгоку дзидай официально начался. Несмотря на бардак в стране, Северная провинция сохраняла относительное спокойствие долгое время, и сын Хитоши осмелел.\"}],\"$52\"]}]\n2a:[\"$\",\"blockquote\",null,{\"className\":\"not-prose relative flow-root my-8 rounded-xl border border-[#9c7b3f26] bg-[#1a1315]/60 backdrop-blur-sm shadow-[0_0_40px_-24px_rgba(0,0,0,0.9)] px-4 py-5 pl-10 sm:px-6 sm:py-6 sm:pl-14\",\"children\":[[\"$\",\"$L53\",null,{\"ref\":\"$undefined\",\"iconNode\":[[\"path\",{\"d\":\"M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"rib7q0\"}],[\"path\",{\"d\":\"M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z\",\"key\":\"1ymkrd\"}]],\"className\":\"lucide-quote absolute left-3 top-5 sm:left-5 sm:top-6 h-4 w-4 text-[#c9bdb460] rotate-180\",\"aria-hidden\":true,\"strokeWidth\":1.5}],[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"absolute left-4 sm:left-6 top-14 sm:top-15 bottom-6 w-px bg-gradient-to-b from-[# зкими для своего величества, самоуверенность питалась только за счет других. Аой хотел быть лучшим, но даже если б достиг желаемого, он не утолил бы жажду до почестей. В этом проявлялся его грех алчности. Грех, который приносил страдания ему самому и до сих пор иногда приносит. Аой верил, что попал в ад – в один из шести буддийских миров, куда может занести Сансара, – и будет вынужден жить тут по всем законам, какими бы жестокими они ни были, пока его карма не очистится.2c:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Затем память стала возвращаться к Омори, а характер - стремительно меняться.\"}],\"$54\"]}]\n2d:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Аой стал Министром и наследником богатств храма Севера, и считал себя вправе судить грешников за их преступления, хотя ему самому не хватало добродетелей.\"}],\" Чтобы кого-то наказать, он мог настроить всех вокруг против этого кого-то. Подкупить, запугать, шантажировать, манипулировать фактами, в общем, все то же самое, чем он занимался при жизни. Дошло до того, что он напал на одного из грешников, потому что узнал в нем своего брата Юджи. Юджи справедливо заметил, что он уже другой человек, и все тут оказались, чтоб искупить свои грехи. Он даже смог внушить цилиню чувство вины, заставил перед собой извиниться и уйти подумать над своим поведением. Аой стал искать истину во внешнем мире, как и свое предназначение. Он должен был покровительствовать достойным, но как бы он узнал, кто заслуживает, а кто нет, если он сам далек от идеала?\"]}]\n55:Ta30,"])</script><script>self.__next_f.push([1," Он долго слушал анахорета, задавал вопросы, на которые тот подробно отвечал, проливая свет в самые темные уголки души. Обнимая ступни наставника, цилинь умолял стать его путеводной звездой в тумане заблуждений. Время шло, Аой стал сам наставлять других, но считал себя вечным учеником Шун Рай Бошо Гена. В Анмемарее послушника приняли с распростертыми объятиями, правда, сразу з
