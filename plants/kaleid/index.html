той энергией. Коричневые прожилки могут становиться более заметными и выразительными по мере старения цветка. Например, молодой цветок может иметь более нежные и тонкие прожилки, которые постепенно усиливаются и становятся более выразительными, когда цветок стареет.\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Корневая система Калейда представляет собой сложный симбиотический организм, причём, она состоит из двух частей:\"}],\" видимой, похожей на ризомы, переплетённой сети буро-золотистых корней, стелящихся по поверхности, и невидимой — микроскопических гиф, уходящих глубоко в почву. Эти гифы образуют микоризу с грибами Микория, произрастающими только на берегах Озера Мёртвых Душ, что является ключевым условием для поглощения растением проклятой энергии.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Листья\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Листья растения, растущие у основания стебля, имеют несимметричную, стрельчатую форму и обладают свойством хамелеона:\"}],\" в пасмурную погоду они окрашены в тусклый серо-зелёный цвет, но под лучами любого света, что будет способен пробиться сквозь смог Озера, приобретают глубокий металлический блеск с медным отливом, эффективно рассеивая излишки энергии.\"]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда произрастания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цвете
