рмы, известной как \\\"огненно-рыжий Айвин\\\", листья выглядят иначе: они плотнее, толще, с выраженными прожилками золотистого цвета. Это связано с тем, что дерево растет в условиях недостатка проклятой энергии. Айвин сбрасывает листья необычным образом: листва опадает почти непрерывно в течении всего года, но сами листья падают очень медленно – под деревом всегда лежит мягкий слой листвы. Опавшие листья еще несколько часов сохраняют тепло и слабое свечение, прежде чем окончательно исчезнуть.\"]}],\"\\n\",[\"$\",\"$L12\",null,{\"name\":\"Плоды\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цветки у Айвина мелкие, многочисленные, собраны в сложные и ветвистые соцветия, напоминающие метелки, и имеют серебристо-розовый оттенок.\"}],\" Плоды — мелкие костянки бледно-лилового цвета с низкой питательной ценностью. В сакральных условиях генеративная функция подавлена, ресурсы перераспределяются преимущественно в листья и корневую систему. Корневая система стержнево-разветвлённая, способная проникать глубоко в землю и даже в камень или архитектурные конструкции.\"]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда произрастания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Айвин является весьма светолюбивым видом, предпочитающим открытые или полуоткрытые территории: преимущественно предгорные или зоны неподалёку от Леса Грёз.\"}],\" Образует редкие рощи, сквозь которые легко проходит свет; кроны способны отражать магическое излучение и свет артефактов. В природных условиях демонстрирует стандартный сезонный цикл развития с листопадом и периодами покоя. Сакральная форма встречается только в храмах Анмемарей: там Айвин меняется, приобретая огненно-рыжую окраску. Особый случай видоизменения растения встречается в Храме Тёмной Матери: снаружи растут обычные розовые Айвины, внутри – только сакральные. Интедикторы считают, что причина в резких перепадах проклятой энергии.\"]}]]}],\"\\n\",[\"$\",\"$L13\",null,{\"children\":[\"$\",\"$L14\",null,{\"children\":[[\"$\",\"$L15\",null,{\"title\":\"Стабилизация под кроной\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Нахождение под кроной Айвина во время листопада оказывает выраженное стабилизирующее воздействие на психическое состояние.\"}],\" У наблюдателей фиксируется снижение внутреннего напряжения, выравнивание дыхательного ритма и повышение способности к длительной концентрации. При продолжительном пребывании возможен переход в состояние углублённой медитации, сопровождающееся усилением восприимчивости к магическим потокам, более точным пониманием сложных текстов, а также эпизодами изменённого восприятия (включая кратковременное ясновидение или усиленную рефлексию собственных поступков);\"]}]}],\"$L16\",\"$L17\",\"$L18\",\"$L19\",\"$L1a\",\"$L1b\"]}]}],\"\\n\",\"$L1c\",\"\\n\",\"$L1d\",\"\\n\",\"$L1e\",\"\\n\",\"$L1f\"]}]\n"])</script><script>self.__next_f.push([1,"24:I[208655,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/0gkg3_pbo_heb.js\",\"/enkrazh-pages/_next/static/chunks/308b3b56paluj.js\",\"/enkrazh-pages/_next/static/chunks/412hvl12myu5u.js\",\"/enkrazh-pages/_next/static/chunks/342ps15a9-yb-.js\",\"/enkrazh-pages/_next/static/chunks/1ntn7efqc-iiw.js\",\"/enkra ории Анмемарей связывается с обнаружением растением Слёз Тёмной Матери\"}],\" — корни Айвина уходят глубоко под землю и добираются до Чаш Потопа, где хранится запас чудотворной жидкости;\"]}]}]\n1a:[\"$\",\"$L15\",null,{\"title\":\"Чувствительность к магическому фону\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Айвин демонстрирует выраженную чувствительность к магическому фону территории:\"}],\" при резких колебаниях уровня проклят"])</script><script>self.__next_f.push([1,"ой энергии (например, во время ритуалов или катаклизмов) у дерева может временно изменяться интенсивность листопада — он либо ускоряется, либо почти полностью прекращается. Данная особенность иногда используется интедикторами как индикатор стабильности среды;\"]}]}]\n1b:[\"$\",\"$L15\",null,{\"title\":\"Ослабление выбросов энергии\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Айвины растут не просто так в священных местах: кроны в том числе ослабляют неконтролируемые выбросы энергии, что делает зоны безопасными для проведения длительных ритуалов или хранения нестабильных артефактов.\"}],\" При этом направленные и осознанные воздействия (заклинания, создания печатей, чтение свитков и так далее) проходят без искажений.\"]}]}]\n20:T7fc, Обычная посадка проста: почву очищают и разрыхляют, убирая лишнюю органику, саженец высаживают неглубоко, сохраняя корневой ком; полив – минимальный: избыток влаги на этом этапе губителен для растения. Первые годы Айвин почти не трогают, крону не формируют и не обрезают. Сакральная посадка сложнее: сначала выбирают место со стабильным уровнем проклятой энергии, интедикторы проверяют не только поверхность, но и глубинные слои почвы. Затем готовят посадочное ложе растения – добавляют в него Слёзы Тёмной Матери и укрепляют минеральную основу. На поверхности наносят печати при помощи Квеллария, которые фиксируют энергетическое поле и помогают дере
