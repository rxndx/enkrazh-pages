null,{\"children\":[[\"$\",\"$L1c\",null,{\"title\":\"Цветение в День Чёрного Солнца\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В День Чёрного Солнца Крето цветет красными крупными цветами, у которых всегда 6 лепестков,\"}],\" каждый лепесток имеет тонкую черную сетку, напоминающую нервную систему человека. Сама \\\"сетка\\\" пульсирует едва заметно. Цветы не имеют запаха, но вкус такой же, как у листьев, только более яркий. Особенность – обильный сок красного цвета, стекающий по стволу ручейками, окрашивая кору в свежие оттенки и капая на землю, создавая иллюзию возобновившегося кровавого дождя. Данный сок крайне ценен для ритуалов высшего посвящения, связанного с поклонением и почитанием Тёмного Отца, однако его сбор требует осторожности – он быстро портится на открытом пространстве, потому его следует собирать в колбы, сотворённые из ресурсов \\\"Отсутствующего\\\" атрибута;\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Использование последователями Отца\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Часто используется последователями Отца – входят в состав отвара, необходимого для интенсивных медитаций и настроя на волну взаимодействия с откровениями Тёмного Отца;\"}]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Безумие и фанатичность\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Употребление листьев (особенно молодых) в большом количестве вызывает безумие и фанатичность, однако в специфическом виде:\"}],\" она фокусируется исключительно на образах и идеях, связанных с Тёмным Отцом, его битвой, жертвой и мощью. Грешник может часами созерцать символику Отца, испытывая экстаз, или с исступлением повторять фрагменты древних песнопений. Провалы в памяти после цветов часто заполняются яркими, но обрывочными видениями битвы, которые последователи считают \\\"благословенными осколками Истины\\\". В сыром виде – в большей степени, в отваре – в меньшей. Передозировка вводит в состояние временной комы, однако молодым грешникам для этого нужно меньшее количество. Кто-то считает, что организм попросту не справляется с интоксикацией проклятой энергии и себя защищает, давая время на восстановление;\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Слёзы старых Крето\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Старые Крето (300+ лет), особенно те, что растут на местах ожесточенных схваток, иногда плачут.\"}],\" В тишине, особенно перед Днем Черного Солнца, из трещин в их коре сочится густая, темная жидкость, стекающая по стволу. Последователи верят, что это не смола, а слезы дерева по Отцу или даже выступившая \\\"память крови\\\" самой битвы. Собирание этих \\\"слез\\\" – редчайший и опаснейший ритуал;\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Влияние цветов на тело и рассудок\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цветы укрепляют и усиливают тело и магические цепи, однако пагубно влияют на рассудок.\"}],\" После употребления грешник действует, скорее, на инстинктах, не всегда отдает отчет своим действиям. По истечению времени воздействия наблюдаются провалы в памяти, немощность, в редких случаях временный отказ цепей. После срыва цветок в течение 30 минут теряет практически весь цвет, а также свойства;\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Вытягивание крови\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Постепенно вытягивает кровь из открытых ран.\"}],\" Данный факт используется для проведения одного из ритуалов, суть которого в следующем: проводящие ритуал обступают дерево, преимущественно молодое, по кругу и под песнопения намеренно отдают свою кровь, нанося себе незначительные повреждения. Такие объединяющие действия создают комфортную среду для медитаций.\"]}]}]]}]}]\n"]
