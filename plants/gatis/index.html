 до 5 метров, диаметр ствола – 30-40 см.\"}]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Корешки\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Серый цвет коры имеет холодный, пепельный оттенок.\"}],\" Бороздки не просто пластинчатые, а образуют сложные, переплетающиеся узоры, напоминающие застывшие потоки слез или древние руны скорби. У старых деревьев (300+) между пластинами коры проглядывает тусклое, едва заметное голубоватое свечение, словно древесина внутри напиталась светом листвы. Корневая система уходит на метр вглубь, но главная особенность – густая сеть тончайших впитывающих корешков, буквально пронизывающих верхний слой почвы. Данные корешки имеют полупрозрачный жемчужно-серый цвет и слабо светятся в темноте, особенно активно после дождя или в местах высокой концентрации проклятой энергии.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Древесина (живого дерева)\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Древесина светло-серая, почти белесая, с едва уловимыми серебристыми прожилками.\"}],\" На срезе кажется матовой, поглощающей свет, а не отражающей его. При горении издает тихий стонущий звук и дает почти невидимый голубоватый дым с запахом озёрного тумана. Некоторые предполагают, что когда наступает День Чёрного Солнца, и кровавый дождь выжигает всё на своём пути, Гатис начинает стонать и петь, чем-то напоминая завывания сирен. Есть те, кто уверен, что Песнь Проклятых Сестёр – это дань традициям, когда какой-то грешник поджигает деревья – и они поют, зазывая путников.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Листья (в период свечения)\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Разумеется, первое, что бросается в глаза при встрече – цвет листвы.\"}],\" Практически всё время он варьируется от голубого до синего цвета. Перед опаданием – тёмно-синего, практически черного. В период цветения (1 месяц) и созревания плодов (3 месяца) в любое время суток листья светятся мягким голубым светом, что может служить хорошим ориентиром для заблудших путников. Кроме цвета и свечения ничем интересным листья не выделяются: внешне похожи на яблоневые, размеры, в среднем, 5х9 см. Черешки листьев короткие и хрупкие, поверхность листа помимо гладкости выделяется бархатистостью.\"]}],\"\\n\",[\"$\",\"$L12\",null,{\"items\":[{\"name\":\"Цветки\"},{\"name\":\"Мякоть\"},{\"name\":\"Кожура плода\"}]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цветки крупные, не светятся, имеют насыщенный оранжевый цвет – неестественно яркий или даже почти ядовитый на фоне голубой листвы.\"}],\" Лепестки толстые, восковые, с лёгким металлическим блеском, при этом в центре – сложный столбик из сросшихся тычинок, контрастирующий с лепестками чернотой. Цвет плода также оранжевый (снаружи), круглый, диаметром до 10-20 см. Кожура плотная, матовая, шероховатая на ощупь за счет тонких спиралевидных узоров, выглядит вдавленной. Мякоть желтая, причём оттенок и насыщенность может сказать о степени созревания. Имеет нежную консистенцию, умеренную сладость, на вкус чем-то похож на манго, банан и хурму, если вообще стоит сравнивать. Последняя, по большей части, отвечает за лёгкую терпкость. Есть косточки – холодные на ощупь, как камень, и если приложить к уху в тишине, некоторые клянутся, что слышат очень далёкий, протяжный шёпот.\"]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[\"$L13\",\"$L14\",[\"$L15\",\"$L16\",\"$L17\",\"$L18\"]]}],\"\\n\",\"$L19\",\"\\n\",\"$L1a\",\"\\n\",\"$L1b\",\"\\n\",\"$L1c\",\"\\n\",\"$L1d\"]}]\n"])</script><script>self.__next_f.push( Связь Гатисов скрывает за собой как преимущества, так и негативные элементы:\"}],\" при гибели старого дерева (особенно центрального или ключевого в круге), разрывается тщательно выстроенная энергетическая и информационная сеть, из-за чего потоки между деревьями искажаются и вызывают \\\"тревогу\\\" у других Гатисов, приводящую к экологической катастрофе. Погибель дерева создаёт внезапный вакуум в месте, где раньше проходила интенсивная переработка проклятой энергии. В соседние деревья начинают поступать хаотичные и нефильтрованные потоки проклятой энергии из почвы и воздуха, с которыми погибшее дерево перестало справляться – и это же становится причиной различных болезней, ослаблению свечений и преждевременному старению/гибели молодых. Возрастает нагрузка на оставшиеся старые деревья, что приводит к перепадам энергии в Лесу Грёз.\"]}]\n18:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Многие исследователи рекомендуют избавляться от старого дерева, несмотря на эстетику:\"}],\" такой погибший \\\"страж\\\" способен создавать зону повышенной опасности, притягивая проклятую энергию, но не справляясь с её очисткой. Это может приводить, помимо общего загрязнения и опасности для грешников, к галлюцинациям и даже провоцировать появление гнозисов.\"]}]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L1e\",null,{\"children\":[\"$\",\"$L1f\",null,{\"children\":[[\"$\",\"$L20\",null,{\"title\":\"Угасание сорванного листа\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Если намеренно оторвать хотя бы один листок – он угаснет спустя 1 час;\"}]}]}],[\"$\",\"$L20\",null,{\"title\":\"Свечение плодов\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Плоды светятся в только определенный период – 2-3 недели после полного созревания.\"}],\" Пригодны к употреблению даже после созревания;\"]}]}],[\"$\",\"$L20\",null,{\"title\":\"Пик свечения и фильтрация\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Самые полезные свойства что листья, что плод, имеют во время свечения, причём интенсивность демонстрирует степень производимой деревом фильтрации от проклятой энергии.\"}],\" При появлении Дня Чёрной Луны свечение достигает пика яркости, напоминая почти неоновые лампы. Важно обратить внимание, что цветки, листья и кора Гатиса беспрерывно занимаются (даже без обработки) нейтрализацией проклятой энергии, впитывая её в себя через окружение. В алхимии может быть полезен в данном контексте для снижения ранга другого ресурса, что может стать минусом, но обеспечить более безопасное соединение для дальнейшего взаимодействия с грешниками с более выраженной (слабой) физиологией или низкой предрасположенности к миру;\"]}]}],[\"$\",\"$L20\",null,{\"title\":\"Эксплуатация продуктов дерева\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если для фильтрации используются продукты дерева, а не само оно, то важно учесть, что у полученных ресурсов есть эксплуатация:\"}],\" после полного потемнения в процессе поглощения проклятой энергии материал становится хрупким и рассыпается в черный порошок при прикосновении. Этот порошок крайне опасен, переходящий в атрибут Тьмы S+ ранга;\"]}]}],[\"$\",\"$L20\",null,{\"title\":\"Запах в период цветения\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В период цветения Гатис очень спорно благоухает, как не принято обычным плодовым деревьям.\"}],\" Запах резкий, неприятный и ни с чем не сравнимый – так дерево защищает себя от паразитов. Он обладает также легким психоактивным эффектом: вызывает беспричинную тревогу, ностальгию по утраченному, легкое головокружение. Неподготовленных он может оттолкнуть или даже вызвать панику. Запах плодов в сравнении с этим слабее и обладает примесью, помимо излишней сладости, землистой грибной нотки, подобно старому погребу;\"]}]}],[\"$\",\"$L20\",null,{\"title\":\"Опасность кожуры\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Кожура на вкус очень горькая и не несёт в себе никакой пользы, так как именно она накапливает всю проклятую энергию поверх себя, удерживая её от попадания в плод.\"}],\" При повреждении (разрезании, разжевывании) высвобождается накопленная в кожуре проклятая энергия, способная привести к сильнейшим судорогам, галлюцинациям ужаса и растворить тело грешника. Обращаться с ней можно только в защитных перчатках, используя инструменты из инертных материалов (специальные стёкла, обработанная кость или особые сплавы). Сам же плод содержит чистую энергию, наиболее полезную для грешников, которое дерево конвертирует и перерабатывает внутри себя – для этого, чтобы предотвратить \\\"выжигание\\\" полезных свойств при попытке снять кожуру, следует вскрывать с помощью извлекающих щипцов верхушку, не нарушая структуры кожуры и не допуская её повреждения. При надавливании на пустое пространство верхушки плод открывается, однако по прежнему важно защищать пальцы от взаимодействия с кожурой, но мякоть можно ныне без опаски съесть;\"]}]}],\"$L21\",\"$L22\",\"$L23\",\"$L24\"]}]}]\n"])</script><script>self.__next_f.push([1,"1a:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В
