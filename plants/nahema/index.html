 clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Самозащита и нападение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Нахема не пытается скрыть свое присутствие или отпугнуть, напротив, ее запах так и манит к себе.\"}],\" Однажды вдохнув запах этого цветка, ему становится уже труднее сопротивляться при отсутствии хоть какой-то ментальной защиты. Вдохнувший запах Нахемы влюбляется в цветок без памяти, забывая обо всем остальном – этот запах буквально заменяет для жертвы необходимость есть или пить. Появляется лишь одна цель – защищать красоту этого цветка. По этой причине Нахема никогда не бывает в одиночестве – вокруг нее бродят звери, одурманенные ее запахом. Но стоит кому-то проявить к ней враждебность, все эти звери в едином порыве атакуют того, кто посмел хоть на мгновение тронуть или даже пройти мимо. В конце концов, влюбленные в Нахему неизбежно умирают от истощения, исполняя перед смертью свой последний долг, чтобы на том месте, где они погибли, мог вырасти новый побег цветка похоти…\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"В случае непосредственной физической угрозы (попытки срезать или выкорчевать) Нахема способна на активный ответ – она резко увеличивает концентрацию феромонов до критического уровня, вызывая у всех находящихся поблизости существ (включая тех, кто ранее не был под влиянием) мгновенный и безрассудный приступ ярости и одержимости, направленный на уничтожение источника угрозы.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Длительное нахождение вблизи цветка (более нескольких часов) даже с ментальной защитой приводит к необратимым изменениям в психике.\"}],\" Как выражаются, происходит эмоциональное выгорание — жертва навсегда теряет способность испытывать сильные чувства к чему-либо, кроме Нахемы, становясь идеальным, послушным и абсолютно безразличным ко всему остальному стражем, и лечится подобная одержимость крайне тяжелыми средствами, угнетающими психику.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Применение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"ul\",null,{\"className\":\"my-6 space-y-3 list-none pl-0\",\"children\":[\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Из нитей нахемы можно изготовить зелье, многократно усиливающее половое влечение.\"}],\" Эффект зелья может подействовать даже при полном половом бессилии. Однако зелье безопасно для употребления лишь при небольших дозах. Чрезмерное употребление зелья из Нахемы может свести с ума: во всех трагических случаях, произошедших с грешниками, выпившими слишком большую дозу зелья, заметна одержимость объектом их вожделения. Нахема
