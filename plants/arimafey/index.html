,\"strong\",null,{\"children\":\"Корневая система мочковатая, развитая, глубиной до 25 см.\"}],\" Корни белесые, сочные, с многочисленными боковыми отростками. Именно в корнях происходит первичный контакт с проклятой энергией почвы и воды.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Стальной стебель\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Сталелитие — ключевое превращение Аримафеи.\"}],\" Когда концентрация проклятой энергии в почве превышает порог, корни начинают активно выталкивать её в наземные части, чтобы не погибнуть от перенасыщения. Проходя через ткани стебля и листьев, ПЭ катализирует метаморфозу: стенки уплотняются, насыщаются минеральными солями из почвы, и растение буквально окаменевает в живую сталь. При этом корни остаются активными ещё некоторое время, удерживая труп растения в вертикальном положении. Стальные стебли и листья сохраняют форму, остроту и даже структуру жилок, но приобретают металлический блеск и твёрдость закалённой стали. Цвет меняется с зелёного на матово-серый с лёгким фиолетовым оттенком — след проклятой энергии.\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"При снижении притока ПЭ сталь подвергается энергетической коррозии: металл разрушается изнутри, теряя связь с проклятой энергией.\"}],\" Сначала появляются трещины, затем чешуйчатая ржавчина, и в конце концов трава рассыпается в мелкий серо-фиолетовый порошок. \",[\"$\",\"strong\",null,{\"children\":\"Полное разрушение происходит примерно со скоростью 20 см в год вне естественной среды.\"}]]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-h
