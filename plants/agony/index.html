\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Бутон формируется на верхушке стебля, закрытый несколькими плотными фиолетово-чёрными чешуйками с металлическим блеском.\"}],\" При распускании чешуйки отгибаются назад, обнажая сердцевину из четырёх (крайне редко пяти) узких лепестков тёмно-фиолетового цвета, почти индиго. Центр цветка содержит компактное соцветие из тычинок с тёмно-синими пыльниками, окружающих маленький, едва заметный пестик. Лепестки не обладают запахом; пыльники, напротив, источают едкий, медицинский аромат.\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Семена формируются в маленькой коробочке у основания цветка после увядания.\"}],\" Они глубоко синие, почти чёрные, сухие, лёгкие, с глянцевой поверхностью. При сдавливании между пальцами трескаются с тихим щелчком, выпуская облачко пыльцы, которое вызывает резкий спазм диафрагмы и невозможность вдохнуть в течение нескольких секунд.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Сок стебля\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Корневая система веретенообразная, состоит из одного толстого корня-лубянки, прикреплённого боковыми присосками к корням лиственных деревьев Леса Крови.\"}],\" Поверхность корня покрыта тончайшими волосками, впитывающими эмоциональные остатки проклятой энергии хозяина — отсюда, по мнению исследователей, специфический вкус боли в соке растения. Сам корень на срезе белесый с красноватыми прожилками; в пищу непригоден и вызывает сильнейшие спазмы желудка.\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Жизненный цикл растения — около двух лет.\"}],\" Первые восемь месяцев агония существует как паразитический росток, не имеющий наземной части. Цветение наступает на 8–9 месяц, длится 3–4 недели, после чего надземная часть отмирает, а корень либо даёт побег на следующий год, либо погибает, отдавая остатки энергии семенам.\"]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда произрастания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Агония привязана к Лесу Крови и не встречается за его пределами.\"}],\" Она предпочитает тенистые участки под пологом лиственных деревьев, особенно там, где почва пропитана кровью или накопила эмоциональные остатки насильственной смерти. На открытых пространствах и в зонах с ярким светом не произрастает вовсе. Для Научной Ассоциации и Вальгардов служит природным индикатором болевых узлов Леса: если в каком-то месте под пологом вдруг появилось скопление агоний, это означает, что корни деревьев здесь впитали концентрированную энергию страданий — возможно, на этом месте погибло крупное существо или произошло преступление. Следопыты также используют это для поиска останков и артефактов, оставленных после битв.\"]}]]}],\"\\n\",\"$L12\",\"\\n\",\"$L13\",\"\\n\",\"$L14\",\"\\n\",\"$L15\",\"\\n\",\"$L16\"]}]\n"])</script><script>self.__next_f.push([1,"17:I[23063,[\"/enkrazh-pages/_next/static/chunks/1i8_llyu6_7ph.js\",\"/enkrazh-pages/_next/static/chunks/0y74e36_pl8w1.js\",\"/enkrazh-pages/_next/static/chunks/207-9w6y4mngq.js\",\"/enkrazh-pages/_next/static/chunks/3va-m2pghbzdw.js\",\"/enkrazh-pages/_next/static/chunks/1-8s9_t85wwr4.js\",\"/enkrazh-pages/_next/static/chunks/121aynm12x8b2.js\",\"/enkrazh-pages/_next/static/chunks/4156732h095-p.js\",\"/enkrazh-pages/_next/static/chunks/0k48ec0yu9fpr.js\",\"/ нии не является ядом – он не разрушает ткани, не вызывает отёков, не действует на кровь и не подавляется стандартными противоядиями; он влияет только на нервную систему.\"}],\" Единственное известное ослабление эффекта — при помощи зелий с нейролептическими свойствами;\"]}]}],[\"$\",\"$L19\",null,{\"title\":\"Адаптация к боли\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"При регулярном, контролируемом контакте с разбавленным соком тело грешника способно выработать специфическую адаптацию — своеобразное привыкание к паттерну боли.\"}],\" Такие грешники описывают ощущения как знакомую, привычную боль, переносимую легче. Однако процесс адаптации требует недель ежедневного воздействия и сам по себе сравнивается с пыткой;\"]}]}],[\"$\",\"$L19\",null,{\"title\":\"Невозможность пересадки\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Все попытки пересадить агонию в контролируемые условия заканчиваются однобоким ростом и отсутствием сока.\"}],\" Без хозяина — дерева, корни которого впитали энергию страданий и сами по себе содержат большое количество проклятой энергии, — растение вырождается в бесполезный сорняк;\"]}]}],[\"$\",\"$L19\",null,{\"title\":\"Зависимость боли от хозяина\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Существует теория, что характер боли при контакте с соком зависит от дерева-паразита:\"}],\" Агония, прикреплённая, например, к старому Крето, вызывает ощущения гниения и пепла, что делает сок из разных участков Леса разнородным товаром;\"]}]}],[\"$\",\"$L19\",null,{\"title\":\"Спящие свидетели\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Семена Агонии прорастают исключительно в почве, удобренной свежей кровью или на месте гибели крупного существа.\"}],\" В обычной земле они впадают в покой, не теряя жизнеспособности, но и не прорастая. Их часто Реальты называют шутливо спящими свидетелями;\"]}]}],[\"$\",\"$L19\",null,{\"title\":\"Пятилепестковая мутация\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Как и у Златоцвета, у Агонии изредка появляется пятый лепесток — знак мутации, вызванной резким всплеском проклятой энергии в Лесу Крови.\"}],\" Такой цветок не вызывает боль; напротив, его сок обладает сильным обезболивающим эффектом, однако найти его почти невозможно, а после срыва вянет в течение часа.\"]}]}]]}]}]\n"])</script><script>self.__next_f.push([1,"13:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Размножение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"$L11\",null,{\"name\":\"Семена\",\"align\":\"left\"}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Основной способ — семенной.\"}],\" После отмирания надземной части коробочка с семенами раскрывается, и лёгкие зёрна разносятся ветром или переносятся на шерсти мелких животных Леса Крови. Поскольку для прорастания требуется специфическая почва, большинство семян погибает или засыпает.\"]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Вегетативное размножение происходит крайне редко: зрелый корень может дать один боковой отросток, если хозяин-дерево достаточно стар и энергетически насыщен.\"}],\" Такие клоны сохраняют свойства материнского растения.\"]}]]]}]\n14:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow \",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Сок стебля — основной и единственный ценный продукт агонии.\"}],\" Его собирают надрезанием стебля в стеклянные ёмкости; металлические контейнеры не подходят — сок прилипает к стенкам и его невозможно полностью отмыть. В чистом виде он применяется как инструмент пыток и допросов: капля в открытую рану вызывает волну боли, распространяющуюся по нервным каналам на расстояние до 8 см от точки контакта. Боль не подавляется обычными анестетиками и болеустойчивостью, поскольку имеет не ментальную, а чисто физическую природу. Сок ценится за предсказуемость: он не убивает, не калечит и не оставляет следов, но ломает волю при длительном употреблении. Полевые хирурги используют разбавленный сок как экстренный стимулятор: боль настолько сильна, что ядро выбрасывает всю доступную ему энергию на максимальной мощности, спасая умирающего. После такого пациент нуждается в длительном восстановлении из-за повышенного износа, а на месте инъекции образуется хроническая невралгия. Алхимики добавляют сок в составы, где требуется компонент, подавляющий и перекрывающий свойства асцендентов;\"]}]]}],\"\\n\",[\"$\",\"li\",null,{\"className\":\"flex gap-3 items-baseline font-article text-[#dcd2ca] text-[1.2 rem] leading-[1.50] my-2\",\"children\":[[\"$\",\"span\",null,{\"aria-hidden\":true,\"className\":\"shrink-0 mt-1.5 h-1.5 w-1.5 rotate-45\",\"style\":{\"backgroundColor\":\"#9c7b3f\"}}],[\"$\",\"span\",null,{\"className\":\"flex-1\",\"children\":[[\"$\",\"strong\",null,{\"children\":\"Семена измельчают и добавляют в дымовые смеси.\"}],\" Дым не убивает, но вызывает у попавших в облако спазмы диафрагмы, кашел
