на в градиент от глубокого лазурного у основания до нежно-сиреневого и почти белого на кончиках; поверхность бархатистая, с мраморным узором из более тёмных прожилок. В темноте, без источников света, листья излучают мягкое, холодное свечение, усиливающееся ближе к центральной жилке.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Лепесток\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Цветки мелкие, собраны в рыхлые щитковидные соцветия на верхушках стеблей.\"}],\" Каждый цветок имеет 5 округлых лепестков небесно-голубого, лавандового или пастельно-сиреневого оттенка с едва заметным перламутровым отливом по краям.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Соцветие\",\"align\":\"right\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Центр цветка — золотисто-жёлтый, образованный плотным кольцом тычинок вокруг крошечного пестика.\"}],\" Лепестки слегка волнистые, с тонкими прозрачными краями, через которые проходит свет. Внешне соцветие напоминает скопление крошечных звёзд, застывших среди листвы.\"]}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Стебель тонкий, изящный, голубовато-зелёный, с едва заметными продольными бороздками.\"}],\" Внутри стебель полый — каналы заполнены жидкостью, близкой по составу к разбавленным слезам Хиниада, которая циркулирует по растению и обеспечивает проводимость атрибутной энергии.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Корень\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Корневая система стержневая, уходит вглубь до 1,5 метра.\"}],\" Корни хрупкие, полупрозрачные, с жемчужно-белым оттенком, на ощупь прохладные. На срезе видны маленькие кристаллические включения — остатки затвердевших слёз, послуживших семенем.\"]}],\"\\n\",[\"$\",\"$L11\",null,{\"name\":\"Звёздная пыль\",\"align\":\"left\"}],\"\\n\",[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Вокруг Аврории постоянно присутствует слабое свечение, похожее на мерцающий туман или звёздную пыль, что особенно усиливается в полной темноте, когда вокруг цветка образуется аура диаметром до 30 см, напоминающая слабое северное сияние.\"}]}],\"\\n\",[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Среда произрастания\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[\"Аврория не привязана к конкретному климату в полной мере, но крайне требовательна к энергетическому фону. \",[\"$\",\"strong\",null,{\"children\":\"Она прорастает исключительно в местах, где слеза Хиниада коснулась земли или камня.\"}],\" Почва при этом не имеет значения — растение одинаково успешно прорастает из трещины скалы, снега или пепла, если слеза на них единожды упала.\"]}],\"$L12\",\"$L13\",\"$L14\"]]}],\"\\n\",\"$L15\",\"\\n\",\"$L16\",\"\\n\",\"$L17\",\"\\n\",\"$L18\",\"\\n\",\"$L19\"]}]\n"])</script><script>self.__next_f.push([1,"1a:I[723063,[\"/enkrazh-pages/_next/static/chunks/3anos-ym07ea3.js\",\"/enkrazh-pages/_next/static/chunks/25sn15fvh4-3s.js\",\"/enkrazh-pages/_next/static/chunks/12bc83s5lx_v7.js\",\"/enkrazh-pages/_next/static/chunks/1esik16ylodcm.js\",\"/enkrazh-pages/_next/static/chunks/02o-q9w4uv8ct.js\",\"/enkrazh-pages/_next/static/chunks/35pjeplx5hjs4.js\",\"/enkrazh-pages/_next/static/chunks/43ncm81-x0r_z.js\",\"/enkrazh-pages/_next/static/chunks/0qqlxw9pw8egc.js\",\"/enkrazh-pages/_next/static/chunks/008jqx5homww4.js\",\"/enkrazh-pages/_next/static/chunk static/chunks/1d-njob3pm5om.js\"],\"CreatureDrops\"]\n12:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Однако для полноценного роста требуется низкая температура и доступ к открытому небу: в замкнутых помещениях без контакта с холодом Аврория вытягивается, теряет окраску и перестаёт светиться.\"}],\" Оптимальные условия — высокогорные плато, расщелины, руины под открытым небом, где холодный воздух и невысокий процент проклятой энергии поддерживают кристаллическую структуру листьев.\"]}]\n13:[\"$\",\"$L11\",null,{\"name\":\"Кристаллизованная слеза\",\"align\":\"left\"}]\n14:[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Аврория не переносит высококонцентрированную проклятую энергию: она либо не прорастает вовсе, сохраняясь в виде кристаллизованный слезы\"}],\", которую впоследствии можно собрать и попробовать продать или вырастить, либо мутирует, теряя свечение и приобретая тусклый серый окрас. Такие экземпляры считаются мёртвыми для алхимических целей.\"]}]\n"])</script><script>self.__next_f.push([1,"15:[\"$\",\"$L1a\",null,{\"children\":[\"$\",\"$L1b\",null,{\"children\":[[\"$\",\"$L1c\",null,{\"title\":\"Эмоциональная память о прародителе\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Аврория сохраняет эмоциональный отпечаток Хиниада, чья слеза дала ей жизнь.\"}],\" При прикосновении к цветку грешник может испытать фрагменты воспоминаний этого конкретного существа — обычно это моменты глубокой скорби, утраты или, напротив, безграничного умиротворения. Уникальность в том, что разные грешники видят разные воспоминания: цветок подстраивается под текущее эмоциональное состояние и отзывается соответственно\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Цветение Аврории\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Если Хиниад плачет в радиусе 500 метров от уже произрастающей Аврории, цветок мгновенно реагирует — распускает новые бутоны в течение нескольких часов независимо от сезона, как бы подпитываясь энергией упавших слёз, не давая им стать отдельными семенами.\"}],\" Если же Хиниад умирает поблизости, Аврория в течение суток теряет голубой оттенок, становясь тёмно-фиолетовой или почти чёрной, и начинает выделять токсичный для грешников пар — такие экземпляры называют «Оплаканными» и используют только в опасных ритуалах. Собирают такую Аврорию исключительно в герметичные сосуды из Отсутствующего атрибута — иначе выделяемый ею пар начинает убивать соседнюю растительность и вызывать у грешников кровотечение из глаз и ушей\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Сбор пыльцы\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Серебристые частицы, оседающие вокруг растения, — это не пыльца, а кристаллизованные испарения с листьев.\"}],\" Они содержат чистую энергию атрибута Космос. Собирать пыль можно только в безветренное время, иначе она рассеивается как дым;\"]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Чудотворная регенерация\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Если отрезать лепесток, рана на цветке затягивается в течение часа, а через месяц лепесток полностью регенерирует, что позволяет аккуратно собирать сырьё без уничтожения растения\"}]}]}],[\"$\",\"$L1c\",null,{\"title\":\"Влияние катаклизмов на цветок\",\"variant\":\"facts\",\"children\":[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"В День Чёрной Луны\"}],\" Аврория светится ярче, а её аромат становится слаще и приторнее. \",[\"$\",\"strong\",null,{\"children\":\"В День Чёрного Солнца\"}],\" свечение почти угасает, но именно в этот ужасающий день растение наиболее эффективно поглощает энергию миазм и нейтрализует проклятую энергию, становясь спасительным маяком небольших зверей в дикой природе. Алхимики считают День Чёрного Солнца наиболее оптимальным време утствуют семена — вместо них в основании пестика формируется крошечный кристалл, который при падении на землю лишь служит концентратором атрибута энергии Космос.\"}],\" Единственный способ размножения — слеза Хиниада: когда он плачет, его слёза, достигнув земли, не испаряется, а кристаллизуются в виде малых звёздчатых капель глубоко в почве. В течение 1–3 лет кристалл поглощает проклятую и нейтральную, порой даже чистую энергию, влагу и эмоциональные эхо окружающей среды, после чего из него прорастает росток Аврории.\"]}],[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Первый листок всегда тускло-серый и не светится. Способность к фотолюминесценции и фильтрации энергии проявляется только на 2-й год жизни. Если сорвать росток до этого момента, он останется бесполезным сорняком F-ранга.\"}]}],[\"$\",\"p\",null,{\"children\":[[\"$\",\"strong\",null,{\"children\":\"Прижившись, Аврория способна существовать до 50 лет, если рядом периодически появляются Хиниады — даже не обязательно плачущие.\"}],\" Если же связь с родительским видом теряется более чем на десятилетие, растение постепенно увядает, превращаясь в безвредный минерал, похожий на голубой кварц.\"]}]]]}]\n"])</script><script>self.__next_f.push([1,"17:[\"$\",\"section\",null,{\"className\":\"not-prose my-10 flow-root clear-both  font-article text-[#dcd2ca] text-[1.05rem] leading-normal  [\u0026\u003ep]:my-2 [\u0026\u003ep]:indent-8  [\u0026_strong]:text-[#e3c9ac] [\u0026_strong]:font-semibold  [\u0026_a]:text-[#b9a8d9] [\u0026_a]:underline [\u0026_a]:underline-offset-4\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"font-heading text-2xl uppercase tracking-wide text-[#ece4de] mb-1\",\"children\":\"Самозащита и нападение\"}],[\"$\",\"div\",null,{\"className\":\"h-px w-16 bg-gradient-to-r from-[#9c7b3f80] to-transparent mb-4\"}],[[\"$\",\"p\",null,{\"children\":[\"$\",\"strong\",null,{\"children\":\"Аврория не является агрессивным растением, но обладает мощной пассивной и активной защитой
